const RACE_TERMS = [
  ['Madring','마드링'], ['Madring','마드링'],
  ['banked','경사진'], ['banking','뱅킹'], ['banked corner','뱅킹 코너'],
  ['grid penalty','그리드 강등'], ['pit lane','피트레인'], ['pit stop','피트스톱'],
  ['pole position','폴 포지션'], ['free practice','연습 주행'],
  ['qualifying','예선'], ['sprint race','스프린트 레이스'],
  ['safety car','세이프티카'], ['virtual safety car','버추얼 세이프티카'],
  ['formation lap','포메이션 랩'], ['parc ferme','파르크 페르메'],
  ['stewards','심판진'], ['steward','심판'], ['penalty','페널티'],
  ['podium','포디움'], ['retirement','리타이어'], ['tyre','타이어'],
  ['slick','슬릭'], ['wet tyre','웨트 타이어'], ['pit wall','피트월'],
  ['title fight','타이틀 경쟁'], ['championship lead','선수권 선두'],
  ['team principal','팀 대표'], ['test driver','테스트 드라이버'],
  ['reserve driver','리저브 드라이버'], ['rookie','신인'],
  ['hypercar','하이퍼카'], ['endurance','내구'], ['stint','스틴트'],
  ['double stint','더블 스틴트'], ['full course yellow','풀코스 옐로'],
];
const NAME_MAP = (()=>{
  const pairs = [];
  DRIVERS.forEach(d=>{
    pairs.push([d.n[1], d.n[0]]);                              /* 풀네임 */
    pairs.push([d.key, d.n[0].split(' ').slice(-1)[0]]);       /* 성만 나올 때 */
  });
  Object.values(TEAMS).forEach(t=>{ if(t.n[1] !== t.n[0]) pairs.push([t.n[1], t.n[0]]); });
  /* 서킷과 대회 이름도 한국어로 (RACES에 이미 두 가지 표기가 들어 있습니다) */
  RACES.forEach(r=>{
    if(r.c && r.c[1] !== r.c[0]) pairs.push([r.c[1], r.c[0]]);
    if(r.n && r.n[1] !== r.n[0]) pairs.push([r.n[1], r.n[0]]);
  });
  LEGENDS.forEach(p => pairs.push(p));
  EXTRA_NAMES.forEach(p => pairs.push(p));
  SPORTSCAR_NAMES.forEach(p => pairs.push(p));
  RACE_TERMS.forEach(p => pairs.push(p));
  const seen = new Set();
  return pairs
    .filter(([en]) => en && en.length > 2 && !seen.has(en) && seen.add(en))
    .sort((a,b) => b[0].length - a[0].length)
    .map(([en,ko]) => [new RegExp('\\b' + en.replace(/[-\/\\^$*+?.()|[\]{}]/g, m => '\\' + m) + '\\b', 'g'), ko]);
})();

/* 번역이 끝난 한국어 문장에 남은 영어 이름만 한국어로 바꿉니다.
   번역기에 한국어를 섞어 보내면 그 한국어까지 다시 번역해 버려
   "Mercedes"가 "현대차"나 "포르쉐"로 둔갑합니다. 그래서 반드시 번역 뒤에 합니다. */
function postNames(s){
  let out = String(s || '');
  for(const [re, ko] of NAME_MAP) out = out.replace(re, ko);
  return out;
}

/* 번역 결과에서 눈에 걸리는 자국을 정리합니다 */
function polish(s){
  return String(s || '')
    .replace(/\s+([,.!?%])/g, '$1')
    .replace(/\(\s+/g, '(')
    .replace(/\s+\)/g, ')')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

/* OpenRouter 무료 모델. 키는 이 브라우저에만 두고 코드에 넣지 않습니다
   (저장소가 공개라 넣으면 남이 가져다 씁니다) */
const OR_URL = 'https://openrouter.ai/api/v1/chat/completions';
/* 실제로 응답이 돌아오는 모델만 남깁니다. NVIDIA 550B 는 2분 넘게 걸려
   상한 안에 못 들어오고, gemma 는 부를 때마다 429 였습니다.
   둘은 호출 수만 태우고 카드는 못 만들었습니다. */
const OR_MODELS = [
  'inclusionai/ling-3.0-flash-fin:free',      /* 실측 19~25초, 10/10 */
  'nex-agi/nex-n2.5-mini:free',               /* 이름 표기가 정확합니다 */
  'dots-studio/dots-3-note-preview:free',     /* 느리지만 형식을 잘 지킵니다 */
];
const orKey = ()=> DB.get('orkey', '');

/* 프롬프트를 고칠 때마다 올립니다. 기기에 저장된 옛 결과를 버리게 하는 표시입니다 */
const HL_VER = 5;

/* 모델이 모르는 이름을 멋대로 옮깁니다 (Charles Leclerc → "찰리 르블랑").
   원문에 나오는 이름만 골라 올바른 한국어 표기를 함께 알려줍니다. */
function nameGlossary(lines){
  const hay = lines.join(' ');
  const seen = new Set(), out = [];
  for(const [re, ko] of NAME_MAP){
    re.lastIndex = 0;
    const m = re.exec(hay);
    if(!m || seen.has(ko)) continue;
    seen.add(ko);
    out.push(m[0] + ' = ' + ko);
    if(out.length >= 40) break;
  }
  return out;
}

/* 번호가 몇 개 빠져도 받은 것만 씁니다. 빠진 자리는 null 로 두고
   화면에서 기존 번역으로 자동으로 메웁니다. */
function orParse(text, n){
  const out = new Array(n).fill(null);
  const re = /\[(\d+)\]\s*([\s\S]*?)(?=\n?\[\d+\]|$)/g;
  let m, got = 0;
  while((m = re.exec(String(text || '')))){
    const i = +m[1] - 1, v = m[2].replace(/\s+/g, ' ').trim();
    if(i >= 0 && i < n && v && !out[i]){ out[i] = v; got++; }
  }
  return got >= Math.ceil(n * 0.6) ? out : null;
}

const OR_SEP = ' ::: ';

/* 하루 한도를 다 쓰면 풀리는 시각까지 AI를 건너뜁니다 */
const aiRestUntil = ()=> +DB.get('aiRest', 0) || 0;
const aiResting   = ()=> Date.now() < aiRestUntil();

/* 형식을 지켰는지 봅니다. 어기면 그 한 건만 버리고 기존 번역으로 메웁니다.
   모델이 규칙을 흘려듣는 일이 잦아 마지막에 한 번 더 거릅니다. */
/* 프롬프트의 보기를 그대로 베껴 오는 일이 있어 막습니다 */
const OR_SAMPLES = ['마드링 절도사건','르클레르 시력 이상','해밀턴 "특혜 요구 안 했다"','포르쉐 수뇌부 작심 발언'];

function cardOk(c){
  if(!c || !c.p) return false;
  if(OR_SAMPLES.includes(c.p)) return false;      /* 보기 그대로면 버립니다 */
  const bad = s => /[.!]$/.test(s) || /[\u4e00-\u9fff]/.test(s) || /(습니다|입니다|합니다)$/.test(s);
  if(c.p.length > 20 || bad(c.p)) return false;         /* 핵심은 짧고 명사로 */
  if(c.h && (c.h.length > 22 || bad(c.h))) return false;
  if(c.d && (c.d.length > 60 || /[\u4e00-\u9fff]/.test(c.d))) return false;
  return true;
}

/* 무료 등급은 하루 50회입니다. 그런데 미리받기가 부문 7개를 다 돌고,
   한 부문이 모델을 바꿔 가며 최대 10회까지 쓰기 때문에, 앱을 한 번 켜는
   것만으로 하루치를 다 태울 수 있었습니다. 그러면 그날 남은 시간 동안
   번역이 통째로 멈춥니다. 그래서 직접 세서 40회에서 멈춥니다.
   (남기는 10회는 사용자가 직접 새로고침할 때 쓸 몫입니다.) */
const AI_DAILY_MAX = 40;
/* 카드뉴스가 화면에 보여 주는 장수. 이만큼만 AI로 만듭니다 */
const AI_CARDS = 10;
const aiToday = ()=> new Date().toISOString().slice(0, 10);
function aiSpent(){
  const d = DB.get('aiDay', null);
  return (d && d.d === aiToday()) ? (+d.n || 0) : 0;
}
function aiSpend(){
  DB.set('aiDay', { d: aiToday(), n: aiSpent() + 1 });
}

/* 무료 등급은 분당 호출 수에 제한이 있습니다. 모델을 바꿔 가며 쉬지 않고
   부르면 전부 429 로 튕깁니다 (실측: 부문 6개에 19회를 태우고 0장).
   모든 AI 호출을 최소 간격으로 벌립니다. 429 를 만나면 더 늦춥니다. */
let aiNextAt = 0;
const AI_GAP = 6000;                 /* 보통 간격 */
const AI_GAP_429 = 20000;            /* 429 를 만난 뒤 간격 */
async function aiGap(){
  const wait = aiNextAt - Date.now();
  if(wait > 0) await new Promise(r => setTimeout(r, wait));
  aiNextAt = Date.now() + AI_GAP;
}
/* AI 호출은 한 번에 하나만. 미리받기와 화면 요청이 동시에 부르면
   서로 호출 제한을 잡아먹어 둘 다 실패합니다. 순서대로 줄을 세웁니다. */
let aiQueue = Promise.resolve();
function aiLock(fn){
  const run = aiQueue.then(fn, fn);
  aiQueue = run.then(()=>{}, ()=>{});
  return run;
}

async function smartBoth(titles, leads){
  const key = orKey();
  if(!key || !titles.length || aiResting()) return null;
  if(aiSpent() >= AI_DAILY_MAX) return null;
  /* 리드는 평균 394자인데 무슨 일인지는 앞머리에 다 담겨 있습니다.
     낱말이 잘리지 않게 200자 근처 빈칸에서 끊어 보냅니다. */
  const cut = s => {
    const t = String(s || '-');
    if(t.length <= 200) return t;
    const p = t.lastIndexOf(' ', 200);
    return t.slice(0, p > 120 ? p : 200);
  };
  const body = titles.map((s, i) => '[' + (i + 1) + '] ' + s + OR_SEP + cut(leads[i])).join('\n');
  const glos = nameGlossary(titles.concat(leads));
  const msg  = glos.length
    ? '아래 이름은 반드시 이 표기를 써라:\n' + glos.join('\n') + '\n\n' + body
    : body;

  /* 한 번 호출에 30초, 전체 150초. 곱해서 모델 5개가 모두 시도됩니다.
     예전엔 45초 x 90초라 모델이 매달리면 2개만 써 보고 끝나서,
     돌릴 때마다 부문 하나씩 카드가 0개로 나왔습니다.
     기다리는 동안에도 1단계 구글 번역이 이미 한국어로 떠 있습니다. */
  const deadline = Date.now() + 150000;
  for(const model of OR_MODELS){
    if(Date.now() > deadline || aiSpent() >= AI_DAILY_MAX) break;
    /* 모델마다 한 번씩만 부릅니다. 실패하면 다음 모델로 넘어갑니다
       (429 는 aiGap 이 20초 띄워 줍니다). */
    try{
        await aiGap();
        const ac = new AbortController();
        const timer = setTimeout(()=>ac.abort(), 30000);
        aiSpend();
        const res = await fetch(OR_URL, { method:'POST', signal:ac.signal,
          headers:{ Authorization:'Bearer ' + key, 'Content-Type':'application/json' },
          body: JSON.stringify({ model, temperature:0.3, max_tokens:9000,   /* 기사 10개면 6000토큰쯤. 모자라면 통째로 잘립니다 */
            messages:[ { role:'system', content: OR_SYS }, { role:'user', content: msg } ]})});
        clearTimeout(timer);
        if(res.status === 429){
          aiNextAt = Date.now() + AI_GAP_429;   /* 몰렸으니 더 쉬어 갑니다 */
          let daily = false, until = 0;
          try{
            const e = await res.clone().json();
            const meta = e?.error?.metadata || {};
            daily = /per-day|daily/i.test(String(e?.error?.message || '') + (meta.limit_source || ''));
            until = +((meta.headers || {})['X-RateLimit-Reset']) || 0;
          }catch(e){}
          if(daily){                       /* 오늘치를 다 썼습니다 */
            DB.set('aiRest', until || (Date.now() + 3600000));
            return null;
          }
          /* 몰린 것뿐이면 다음 모델로 넘어갑니다 (aiGap 이 20초 띄웁니다) */
        }
        if(!res.ok) continue;            /* 이 모델은 실패 — 다음 모델 */
        const j = await res.json();
        const got = orParse(j?.choices?.[0]?.message?.content, titles.length);
        const cards = !got ? null : got.map(s => {
          if(!s) return null;
          /* 모델이 ':::' 대신 '::' 를 쓰는 일이 잦습니다.
             콜론을 두 개 이상 만나면 구분자로 봅니다. */
          const p = s.split(/\s*:{2,}\s*/).map(x => x.trim()).filter(Boolean);
          if(p.length < 2) return null;
          /* AI 결과에도 이름 사전을 적용합니다. 구글 번역과 달리 이 경로는
             거치지 않아서 Toyota·Ferrari 같은 아는 이름이 영어로 남았습니다. */
          const fix = s => polish(postNames(String(s || '').trim()));
          const card = { h:fix(p[0]), p:fix(p[1]), d:fix(p[2]) };
          return cardOk(card) ? card : null;      /* 형식을 어기면 버립니다 */
        });
        /* 한 장이라도 건졌을 때만 성공으로 봅니다. 전부 버려졌다면
           그 모델이 형식을 못 지킨 것이므로 다음 모델을 써 봅니다. */
        if(cards && cards.some(Boolean)) return cards;
        continue;                        /* 형식을 못 지킴 — 다음 모델 */
    }catch(e){ continue; }               /* 시간 초과 — 다음 모델 */
  }
  return null;
}


async function translateTitles(titles, target){
  /* 브라우저가 직접 부르면 구글이 막아 버립니다. 올려둔 사이트에서는 서버를 거칩니다 */
  const base = HOSTED ? '/api/tr/translate_a/single' : 'https://translate.googleapis.com/translate_a/single';
  const url = base + '?client=gtx&sl=en&tl='
            + target + '&dt=t&q=' + encodeURIComponent(titles.map(enFix).join('\n'));
  /* 잠깐 막히는 일이 잦아서 한 번은 쉬었다 다시 부릅니다 */
  let res;
  for(let i = 0; i < 2; i++){
    const ac = new AbortController();
    const timer = setTimeout(()=>ac.abort(), 12000);
    try{
      res = await fetch(url, {signal:ac.signal});
      clearTimeout(timer);
      if(res.ok) break;
      res = null;
    }catch(e){ clearTimeout(timer); res = null; }
    if(i === 0) await new Promise(r => setTimeout(r, 1600));
  }
  if(!res) throw new Error('translate blocked');

  const segs = (await res.json())[0] || [];
  const outs = [];
  let cur = '';
  for(const seg of segs){
    cur += String(seg[0] ?? '');
    const breaks = (String(seg[1] ?? '').match(/\n/g) || []).length;
    for(let i=0; i<breaks; i++){ outs.push(cur.replace(/\s+/g,' ').trim()); cur = ''; }
  }
  if(cur.trim()) outs.push(cur.replace(/\s+/g,' ').trim());

  if(outs.length !== titles.length) throw new Error('segment mismatch');
  /* 한국어일 때만 이름을 손봅니다 (일본어 표기는 데이터에 없습니다) */
  return target === 'ko' ? outs.map(s => polish(koFix(postNames(s)))) : outs.map(polish);
}

/* 캐시에 해당 언어 번역이 없으면 받아와 저장합니다. 성공하면 true */
/* 구글 번역을 먼저 해서 한국어를 바로 띄우고, AI 다듬기는 뒤에서 이어 붙입니다.
   AI를 먼저 기다리면 최대 90초 동안 영어가 그대로 보입니다.
   onStep 이 불리면 화면을 다시 그립니다 (두 번: 구글 직후, AI 직후). */
/* 새로 받은 기사 목록에, 전에 만들어 둔 카드를 주소로 맞춰 옮겨 담습니다.
   기사 순서가 바뀌어도 주소가 같으면 그대로 따라옵니다. */
function carryCards(old, data){
  if(!old || !old.items || !old.hc) return;
  const by = {};
  (old.items || []).forEach((it, i) => {
    Object.keys(old.hc).forEach(lang => {
      const c = (old.hc[lang] || [])[i];
      if(c && c.p) (by[lang] = by[lang] || {})[artId(it)] = c;
    });
  });
  if(!Object.keys(by).length) return;
  data.hc = data.hc || {}; data.hs = data.hs || {}; data.hsd = data.hsd || {};
  Object.keys(by).forEach(lang => {
    const n = Math.min(AI_CARDS, data.items.length);
    const arr = new Array(n).fill(null);
    let hit = 0;
    for(let i = 0; i < n; i++){
      const c = by[lang][artId(data.items[i])];
      if(c){ arr[i] = c; hit++; }
    }
    if(hit){
      data.hc[lang]  = arr;
      data.hs[lang]  = arr.map(x => x && x.p ? (x.h ? x.h + ' ' + x.p : x.p) : null);
      data.hsd[lang] = arr.map(x => x && x.d ? x.d : null);
    }
  });
  data.hv = old.hv;
}
async function ensureTitles(key, data, onStep, noAi){
  if(L === 'en' || !data.items.length) return false;
  data.tr ||= {}; data.trd ||= {}; data.hs ||= {}; data.hsd ||= {}; data.hc ||= {};
  if(data.hv !== HL_VER){        /* 기준이 바뀌었으면 옛 AI 결과를 버립니다 */
    data.hs = {}; data.hsd = {}; data.hc = {}; data.hv = HL_VER;
  }

  /* 카드뉴스는 10장만 보여 줍니다. 20장을 만들면 절반은 버려지는데
     생성 토큰은 그대로 나가므로, 보여 줄 만큼만 만듭니다.
     11번째부터는 구글 번역 제목이 그대로 쓰입니다. */
  const titles = data.items.map(i => i.title || '-');
  const leads  = data.items.map(i => (i.desc || '').replace(/\s+/g, ' ').trim() || '-');
  let changed = false;

  /* 1단계 — 구글 번역 (보통 2초). 일단 한국어로 읽히게 만듭니다 */
  if(!data.tr[L] || !data.trd[L]){
    try{
      const out = await translateTitles([...titles, ...leads], L);
      if(out.length === titles.length + leads.length){
        data.tr[L]  = out.slice(0, titles.length);
        data.trd[L] = out.slice(titles.length);
        DB.set('news3-'+key, data);
        changed = true;
        if(onStep) onStep();
      }
    }catch(e){
      try{                                  /* 제목만이라도 살려 봅니다 */
        data.tr[L] = await translateTitles(titles, L);
        DB.set('news3-'+key, data);
        changed = true;
        if(onStep) onStep();
      }catch(e2){}
    }
  }

  /* 2단계 — AI가 기사체로 다시 씁니다. 실패해도 1단계 결과가 남습니다.
     한 번에 다 못 받는 일이 잦아서(모델이 몇 줄을 빠뜨리거나 형식을 어깁니다)
     빠진 자리만 골라 다시 부릅니다. 전체를 다시 돌리면 이미 받은 것까지
     토큰을 또 씁니다. 몇 번 해도 안 되는 기사가 있으므로 횟수를 제한합니다. */
  if(L === 'ko'){
    const n = Math.min(AI_CARDS, titles.length);
    if(!Array.isArray(data.hc[L]) || data.hc[L].length !== n)
      data.hc[L] = new Array(n).fill(null);

    const gaps = () => {
      const a = [];
      for(let i = 0; i < n; i++){ const c = data.hc[L][i]; if(!(c && c.p)) a.push(i); }
      return a;
    };

    /* 먼저 서버에 올라온 카드를 봅니다. 다른 기기가 이미 만들어 두었다면
       AI를 부르지 않고 그대로 씁니다. 키가 없는 휴대폰에서도 이 길로 보입니다. */
    let miss = gaps();
    if(miss.length && netSb()){
      try{
        const got = await CARDS.get(miss.map(i => data.items[i]));
        let n2 = 0;
        miss.forEach(i => {
          const c = got[CARDS.key(data.items[i])];
          if(c && c.p){ data.hc[L][i] = c; n2++; }
        });
        if(n2){
          const cards = data.hc[L];
          data.hs[L]  = cards.map(x => x && x.p ? (x.h ? x.h + ' ' + x.p : x.p) : null);
          data.hsd[L] = cards.map(x => x && x.d ? x.d : null);
          DB.set('news3-'+key, data);
          changed = true;
          if(onStep) onStep();
        }
      }catch(e){}
    }

    /* 그래도 빈 자리가 있고 이 기기에 키가 있으면 직접 만듭니다 */
    miss = gaps();
    if(noAi || !orKey()) miss = [];
    /* 날이 바뀌면 시도 횟수를 되돌립니다. 안 그러면 한도가 찬 날에 3번을
       다 태우고 다음 날에도 빈 자리가 영영 안 채워집니다. */
    if(data.hcDay !== aiToday()){ data.hcTry = 0; data.hcDay = aiToday(); }
    data.hcTry = +data.hcTry || 0;
    /* 한도에 막혀 있으면 세지 않습니다 — 모델 탓이 아니라 우리 사정입니다 */
    if(miss.length && data.hcTry < 3 && !aiResting() && aiSpent() < AI_DAILY_MAX){
      data.hcTry++;
      DB.set('news3-'+key, data);          /* 형식을 못 지켜 실패해도 횟수는 남깁니다 */
      const got = await aiLock(()=> smartBoth(miss.map(i => titles[i]), miss.map(i => leads[i])));
      if(got){
        const made = [];
        miss.forEach((idx, j) => {
          if(got[j] && got[j].p){ data.hc[L][idx] = got[j]; made.push([data.items[idx], got[j]]); }
        });
        /* 다른 기기도 쓰도록 올려 둡니다. 실패해도 화면에는 영향이 없습니다 */
        if(made.length) CARDS.put(made);
        const cards = data.hc[L];
        data.hs[L]  = cards.map(x => x && x.p ? (x.h ? x.h + ' ' + x.p : x.p) : null);
        data.hsd[L] = cards.map(x => x && x.d ? x.d : null);
        DB.set('news3-'+key, data);
        changed = true;
        if(onStep) onStep();
      }
    }
  }
  return changed;
}
/* 카드를 눌렀을 때 보여줄 자세한 풀이.
   기사 전문은 봇 차단(403)과 저작권 때문에 가져올 수 없습니다. 그래서 언론사가
   배포하는 제목과 도입부, 그 사실만 가지고 우리말로 풀어 씁니다.

const DEEP_SYS = [

/* 본문용 다듬기. 제목처럼 어미를 걷어내지 않고 이름 표기만 맞춥니다 */
const hlBody = s => s ? polish(koFix(postNames(s))) : '';

/* 받아온 풀이는 저장해 둡니다. 같은 기사를 다시 열 때 또 부르면
   하루 호출 한도를 금방 써 버립니다. */
const deepKey = it => 'deep-' + artId(it).slice(-120);

function deepParse(text){
  const s = String(text || '');
  const grab = name => {
    const m = s.match(new RegExp('\\[' + name + '\\]\\s*([\\s\\S]*?)(?=\\n?\\[|$)'));
    const v = m ? m[1].replace(/\s+/g, ' ').trim() : '';
    return (!v || /^-+$/.test(v)) ? '' : v;
  };
  const out = { what: grab('무슨 일'), why: grab('왜 중요'), note: grab('알아둘 것') };
  return out.what ? out : null;
}

/* 기사 하나를 풀어 씁니다. 실패하면 null 을 돌려주고 화면은 도입부만 보여줍니다. */
async function deepRead(it){
  const cached = DB.get(deepKey(it), null);
  if(cached) return cached;
  const key = orKey();
  if(!key || aiResting() || aiSpent() >= AI_DAILY_MAX) return null;

  const title = it.title || '';
  const lead  = (it.desc || '').replace(/\s+/g, ' ').trim();
  if(!title) return null;
  const glos = nameGlossary([title, lead]);
  const msg = (glos.length ? '아래 이름은 반드시 이 표기를 써라:\n' + glos.join('\n') + '\n\n' : '')
    + '제목: ' + title + '\n도입부: ' + (lead || '(없음)');

  const deadline = Date.now() + 60000;
  for(const model of OR_MODELS.slice(0, 3)){
    if(Date.now() > deadline || aiSpent() >= AI_DAILY_MAX) break;
    try{
      await aiGap();
      const ac = new AbortController();
      const timer = setTimeout(()=>ac.abort(), 25000);
      aiSpend();
      const res = await fetch(OR_URL, { method:'POST', signal:ac.signal,
        headers:{ Authorization:'Bearer ' + key, 'Content-Type':'application/json' },
        body: JSON.stringify({ model, temperature:0.3, max_tokens:3000,
          messages:[ { role:'system', content: DEEP_SYS }, { role:'user', content: msg } ]})});
      clearTimeout(timer);
      if(res.status === 429){
        aiNextAt = Date.now() + AI_GAP_429;
        try{
          const e = await res.clone().json();
          const meta = e?.error?.metadata || {};
          if(/per-day|daily/i.test(String(e?.error?.message || '') + (meta.limit_source || ''))){
            DB.set('aiRest', +((meta.headers || {})['X-RateLimit-Reset']) || (Date.now() + 3600000));
            return null;
          }
        }catch(e){}
        continue;                       /* 잠깐 몰린 것뿐이니 다음 모델로 */
      }
      if(!res.ok) continue;
      const j = await res.json();
      const got = deepParse(j?.choices?.[0]?.message?.content);
      if(got){
        const clean = { what: hlBody(got.what), why: hlBody(got.why), note: hlBody(got.note) };
        DB.set(deepKey(it), clean);
        return clean;
      }
    }catch(e){}
  }
  return null;
}

/* 기사 읽기 — 밖으로 나가지 않고 앱 안에서 봅니다.
   언론사 기사 페이지는 봇 차단(403)이라 본문을 가져올 수 없고, 전문을 그대로 옮기는 것도
   저작권 문제가 있습니다. 그래서 피드가 배포용으로 제공하는 리드 문단만 번역해 보여주고,
   전문은 원문 링크로 넘깁니다. */
function openArticle(it, title, lead){
  const s = SERIES[it.series || newsSeries];
  const hay = (it.title + ' ' + (it.desc || ''));
  const hits = TERMS.filter(x => x.re.test(hay)).slice(0, 6);

  const terms = hits.length ? `
    <div class="sec">${t('art.terms')}</div>
    <div class="terms">${hits.map(x => `
      <div class="term">
        <b>${esc(lz3(x.n))}</b>
        <span>${esc(lz3(x.d))}</span>
      </div>`).join('')}</div>` : '';

  openSheet(`
    ${it.img ? `<img class="artimg" src="${esc(it.img)}" alt="" onerror="this.remove()">` : ''}
    <div class="artmeta">
      <span class="pill" style="color:${s.color}">${esc(s.name)}</span>
      <span>${esc(it.src)} · ${esc(relTime(it.at))}</span>
    </div>
    <h2 class="arttitle">${esc(title)}</h2>
    <div id="deepBox"></div>
    ${lead ? `<p class="artlead">${esc(lead)}</p>` : ''}
    ${terms}
    <div class="note">${t('art.note')}</div>
    <a class="btn flow artlink" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">${t('art.full')}</a>
    <div class="sec">${t('cmt.title')}</div>
    <div id="cmtBox"><div class="muted">${t('cmt.loading')}</div></div>
    <button class="btn ghost sm" id="artClose">${t('r.close')}</button>`);

  $('#artClose').onclick = closeSheet;

  /* 댓글 — 읽기는 누구나, 쓰기는 구글 로그인한 사람만 */
  const art = artId(it);
  async function drawCmt(){
    const b = $('#cmtBox'); if(!b) return;
    let list;
    try{ list = await CMT.list(art); }
    catch(e){ b.innerHTML = `<div class="muted">${t('cmt.fail')}</div>`; return; }
    const me = googleUser();
    b.innerHTML =
      (list.length
        ? list.map(c => `<div class="cmt"><b>${esc(c.who)}</b><span class="tm num">${fmtTime(c.at)}</span><p>${esc(c.text)}</p></div>`).join('')
        : `<div class="muted">${t('cmt.none')}</div>`)
      + (me
        ? `<div class="cin"><input type="text" id="cmtIn" maxlength="300" placeholder="${esc(t('cmt.ph'))}"><button class="flow" id="cmtSend">${t('chat.send')}</button></div>`
        : `<div class="note">${t('cmt.needLogin')}</div>`);
    const send = $('#cmtSend'), inp = $('#cmtIn');
    if(send && inp){
      const go = async () => {
        const v = inp.value.trim(); if(!v) return;
        send.disabled = true;
        try{ await CMT.add(art, CFG.nick, v); inp.value = ''; await drawCmt(); }
        catch(e){ toast(t('net.err')); }
        finally{ const s = $('#cmtSend'); if(s) s.disabled = false; }
      };
      send.onclick = go;
      inp.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
    }
  }
  drawCmt();

  /* 자세한 풀이 — 받아오는 동안에도 도입부가 이미 떠 있어 화면이 비지 않습니다.
     한 번 받으면 저장해 두므로 같은 기사를 다시 열 때는 바로 뜹니다. */
  (async () => {
    const box = $('#deepBox'); if(!box) return;
    const has = DB.get(deepKey(it), null);
    const can = orKey() && !aiResting() && aiSpent() < AI_DAILY_MAX;
    if(!has && !can) return;                       /* 조용히 도입부만 보여줍니다 */
    if(!has) box.innerHTML = `<div class="deep wait">${t('art.deepWait')}</div>`;
    let d = null;
    try{ d = await deepRead(it); }catch(e){}
    const cur = $('#deepBox'); if(!cur) return;    /* 그새 창을 닫았습니다 */
    if(!d){ cur.innerHTML = ''; return; }
    cur.innerHTML = `<div class="deep">
      <p class="what">${esc(d.what)}</p>
      ${d.why  ? `<p class="why"><b>${t('art.deepWhy')}</b>${esc(d.why)}</p>` : ''}
      ${d.note ? `<p class="why"><b>${t('art.deepNote')}</b>${esc(d.note)}</p>` : ''}
      <span class="by">${t('art.deepBy')}</span></div>`;
  })();
}

/* 좌우로 넘기는 카드뉴스. 인스타 캐러셀 규격(4:5, 표지 + 한 장에 한 소식)을 따랐습니다 */
/* 카드 사진 고르기
   - 못 불러오면 뺍니다
   - 너무 작으면(가로 400 미만) 늘리면 흐릿해지므로 뺍니다
   - 세로로 긴 사진은 4:5 칸에서 얼굴이 잘리기 쉬워 가운데로 잡습니다
   사진을 빼면 아래 시리즈 색 배경이 드러납니다 */
function fitPhoto(img){
  img.onerror = ()=> img.remove();
  img.onload = ()=>{
    const w = img.naturalWidth, ht = img.naturalHeight;
    if(w < 400){ img.remove(); return; }
    if(ht > w) img.style.objectPosition = '50% 50%';   /* 세로 사진 */
  };
}

function paintDeck(data, titles, descs){
  const s = SERIES[newsSeries], list = $('#newsList');
  const nice  = data.hs?.[L] || null;      /* 기사체로 다시 쓴 제목이 있으면 우선 */
  const niced = data.hsd?.[L] || null;     /* 다시 쓴 본문 */
  const cards = data.hc?.[L] || null;      /* 카드용 훅·핵심·설명 */
  const items = data.items.slice(0, 10);          /* 인스타도 한 묶음에 10~20장입니다 */
  const deck = el('div','deck');

  const cover = el('button','cardn cover');
  cover.style.setProperty('--cc', s.color);
  cover.innerHTML = `
    <div class="in">
      <div class="hd"><span class="tag solid" style="background:rgba(255,255,255,.22)">${esc(s.name)}</span>
        <span class="no">${items.length}${t('news.cards')}</span></div>
      <div class="big">${esc(t('news.coverTitle', s.name))}</div>
      <div class="lead">${esc(t('news.coverSub'))}</div>
    </div>
    <div class="swipe">${t('news.swipe')}<span class="ar">${ic('chev')}</span></div>`;
  deck.appendChild(cover);

  items.forEach((it,i)=>{
    const title = nice?.[i] || (titles?.[i] ? hl(titles[i]) : it.title);
    const lead  = niced?.[i] || descs?.[i] || it.desc || '';
    const card  = cards?.[i];
    /* 카드 문구가 있으면 훅·핵심·설명 세 단으로 그립니다.
       AI가 다듬은 짧은 핵심이 제일 좋지만, 키가 없거나 하루 한도를 다 쓴 날에는
       못 받습니다. 그때도 카드뉴스 모양을 유지하려고 번역된 제목을 그대로 핵심에
       싣고 아래에 내용 줄을 둡니다. 글자가 기니 조금 작게(full) 보여 줍니다.
       규칙으로 제목을 줄여 봤지만 우리말 서술어가 망가져서 그만뒀습니다
       ("주도한다" → "주"). 짧은 핵심은 AI 몫입니다. */
    const body = (card && card.p)
      ? `${card.h ? `<div class="hook">${esc(card.h)}</div>` : ''}
         <div class="punch">${esc(card.p)}</div>
         ${card.d ? `<div class="line">${esc(card.d)}</div>` : ''}`
      : `<div class="punch full">${esc(title)}</div>
         ${lead ? `<div class="line">${esc(lead)}</div>` : ''}`;
    const c = el('button','cardn');
    c.innerHTML = `
      ${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy">` : ''}
      <span class="sc"></span>
      <div class="in">
        <div class="hd"><span class="tag solid" style="background:${s.color}">${esc(s.name)}</span>
          <span class="no">${i+1} / ${items.length}</span></div>
        <div class="bd">
          ${body}
          <div class="ft"><span class="pill">${esc(it.src)}</span><span>${esc(relTime(it.at))}</span></div>
        </div>
      </div>`;
    c.style.setProperty('--cc', s.color);
    const im = c.querySelector('img'); if(im) fitPhoto(im);
    c.onclick = ()=> openArticle({...it, series:newsSeries}, title, lead);
    deck.appendChild(c);
  });

  /* 점을 눌러서도, 화살표로도 넘어갑니다 — 손가락 스와이프가 안 먹는 경우가 있어서 */
  /* 카드에 댓글 수를 한 번의 요청으로 붙입니다 */
  CMT.counts(items.map(artId)).then(n=>{
    items.forEach((it,i)=>{
      const c = n[artId(it)];
      if(!c) return;
      const ft = deck.children[i+1] && deck.children[i+1].querySelector('.ft');
      if(ft) ft.insertAdjacentHTML('beforeend', `<span class="cn">${ic('chat')}${c}</span>`);
    });
  });

  const bar  = el('div','deckbar');
  const prev = el('button','prev'); prev.type='button';
  prev.setAttribute('aria-label', t('news.prev')); prev.innerHTML = ic('chev');
  const next = el('button','next'); next.type='button';
  next.setAttribute('aria-label', t('news.next2')); next.innerHTML = ic('chev');
  const dots = el('div','dots');
  const total = items.length + 1;
  for(let i = 0; i < total; i++){
    const b = el('button', i === 0 ? 'on' : '');
    b.type = 'button'; b.setAttribute('aria-label', String(i + 1));
    b.onclick = () => goTo(i);
    dots.appendChild(b);
  }
  bar.appendChild(prev); bar.appendChild(dots); bar.appendChild(next);

  list.innerHTML = ''; list.appendChild(deck); list.appendChild(bar);

  /* 지금 몇 번째인지 — 옮길 때와 같은 기준(스크롤 위치)으로 재야 어긋나지 않습니다 */
  const current = () => {
    const base = deck.children[0].offsetLeft, x = deck.scrollLeft;
    let near = 0, best = Infinity;
    [...deck.children].forEach((c, i) => {
      const d = Math.abs((c.offsetLeft - base) - x);
      if(d < best){ best = d; near = i; }
    });
    return near;
  };
  function goTo(i){
    const c = deck.children[i]; if(!c) return;
    deck.scrollTo({ left: c.offsetLeft - deck.children[0].offsetLeft, behavior:'smooth' });
  }
  function mark(){
    const n = current();
    [...dots.children].forEach((d, i) => d.classList.toggle('on', i === n));
    prev.disabled = n === 0;
    next.disabled = n >= total - 1;
  }
  prev.onclick = () => goTo(current() - 1);
  next.onclick = () => goTo(current() + 1);

  let tick;
  deck.onscroll = () => { clearTimeout(tick); tick = setTimeout(mark, 80); };
  mark();
}

function buildNewsChips(){
  const box = $('#newsChips'); box.innerHTML = '';
  /* 묶음이 없는 시리즈를 먼저, GT 계열은 뒤에 모아 둡니다 */
  Object.keys(SERIES).filter(k=>!SERIES[k].noNews).forEach(k=>{
    const s = SERIES[k];
    const b = el('button','chip' + (k===newsSeries?' on':''));
    b.style.setProperty('--cc', s.color);
    b.innerHTML = `<i class="sdot" style="background:${s.color}"></i>${esc(s.name)}`;
    b.onclick = ()=>{ newsSeries = k; buildNewsChips(); renderNews(); };
    box.appendChild(b);
  });
}

/* 시리즈를 미리 한국어로 옮겨 둡니다. 칩을 눌렀을 때 기다리지 않도록.
   무료 모델은 호출 제한이 있어 한 번에 하나씩, 넉넉히 쉬어 가며 처리합니다.
   이미 받아 둔 시리즈는 건너뜁니다. */
let preBusy = false;
async function prefetchNews(){
  if(preBusy || L !== 'ko') return;
  preBusy = true;
  try{
    for(const k of Object.keys(SERIES)){
      if(SERIES[k].noNews) continue;
      let c = DB.get('news3-'+k, null);
      const fresh = c && Date.now() - c.at < NEWS_TTL;
      if(fresh && c.tr?.[L] && c.trd?.[L]) continue;   /* 번역까지 됐으면 넘어갑니다 */
      if(!fresh){
        try{ c = { at: Date.now(), items: await fetchNews(k) }; DB.set('news3-'+k, c); }
        catch(e){ continue; }
      }
      try{
        /* 여기서는 AI를 부르지 않습니다. 구글 번역만으로도 한국어로 읽히고,
           AI 하루 한도는 사용자가 실제로 연 부문에 씁니다. */
        await ensureTitles(k, c, ()=>{ if(newsSeries === k && tab === 'news') paintNews(c); }, true);
      }catch(e){}
      await new Promise(r => setTimeout(r, 1500));   /* 구글 번역만 하므로 조금만 쉽니다 */
    }
  }finally{ preBusy = false; }
}

async function renderNews(force){
  buildNewsChips();
  buildNewsView();
  const key = newsSeries, list = $('#newsList');
  const cache = DB.get('news3-'+key, null);
  const fresh = cache && (Date.now() - cache.at < NEWS_TTL);

  if(cache){
    paintNews(cache);
    /* 저장된 소식이 있어도 AI 카드가 아직 없으면 여기서 만듭니다.
       예전에는 뒤에서 조용히 돌려 실패해도 표시가 없었습니다. */
    const needAi = L === 'ko' && orKey() && !(cache.hc && cache.hc[L] && cache.hc[L].length);
    if(needAi && aiResting()){
      $('#newsFresh').textContent = t('news.aiRest');
    }else if(needAi && aiSpent() >= AI_DAILY_MAX){
      $('#newsFresh').textContent = t('news.aiRest');
    }else if(needAi){
      $('#newsFresh').textContent = t('news.aiWork');
    }
    ensureTitles(key, cache, ()=>{ if(newsSeries === key) paintNews(cache); })
      .then(()=>{
        if(newsSeries !== key) return;
        paintNews(cache);
        if(needAi && !(cache.hc && cache.hc[L] && cache.hc[L].length))
          $('#newsFresh').textContent = t('news.aiFail');
      })
      .catch(()=>{});
  }
  if(fresh && !force) return;

  if(!cache) list.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  $('#newsFresh').textContent = t('news.loading');
  $('#btnRefreshNews').disabled = true; $('#btnRefreshNews').classList.add('spin');
  try{
    const items = await fetchNews(key);
    const data = { at: Date.now(), items };
    /* 전에 만든 카드를 버리지 않고 옮겨 담습니다. 기사가 그대로면 다시
       만들 이유가 없고, 한도에 걸린 날에는 사라지기만 합니다. */
    carryCards(cache, data);
    DB.set('news3-'+key, data);
    if(newsSeries === key) paintNews(data);
    await ensureTitles(key, data, ()=>{ if(newsSeries === key) paintNews(data); });
    if(newsSeries === key) paintNews(data);
  }catch(e){
    if(newsSeries !== key) return;
    if(cache){ paintNews(cache); toast(t('news.stale')); }
    else{
      $('#newsFresh').textContent = t('news.failedShort');
      list.innerHTML = `<div class="empty">${ic('wifi')}${t('news.failed')}</div>`;
    }
  }finally{ $('#btnRefreshNews').disabled = false; $('#btnRefreshNews').classList.remove('spin'); }
}

function paintNews(data){
  const s = SERIES[newsSeries];
  $('#newsFresh').textContent = t('news.updated', relTime(data.at));
  const list = $('#newsList'); list.innerHTML = '';
  if(!data.items.length){ list.innerHTML = `<div class="empty">${ic('news')}${t('news.empty')}</div>`; return; }
  const nice   = data.hs?.[L] || null;      // 기사체로 다시 쓴 제목이 있으면 우선
  const niced  = data.hsd?.[L] || null;     // 다시 쓴 본문
  const titles = data.tr?.[L] || null;      // 번역된 제목이 있으면 그걸 씁니다
  const descs  = data.trd?.[L] || null;     // 리드 문단 번역
  const key = newsSeries;
  if(newsView === 'card'){ paintDeck(data, titles, descs); return; }
  data.items.forEach((it,i)=>{
    const lead = niced?.[i] || descs?.[i] || it.desc || '';
    const title = nice?.[i] || (titles?.[i] ? hl(titles[i]) : it.title);

    /* 맨 위 기사는 사진을 크게 써서 무엇이 오늘의 소식인지 한눈에 보이게 합니다 */
    if(i === 0 && it.img){
      const b = el('button','nlead');
      b.innerHTML = `
        <img src="${esc(it.img)}" alt="" loading="eager" onerror="this.closest('.nlead').classList.add('noimg')">
        <div class="ov">
          <h3>${esc(title)}</h3>
          <div class="nfoot">
            <span class="pill" style="color:${s.color}">${esc(s.name)}</span>
            <span class="src">${esc(it.src)} · ${esc(relTime(it.at))}</span>
          </div>
        </div>`;
      b.onclick = ()=> openArticle({...it, series:key}, title, lead);
      list.appendChild(b);
      return;
    }

    const a = el('article','nitem');
    a.style.animationDelay = Math.min(i,8)*28 + 'ms';
    a.innerHTML = `
      ${it.img ? `<img class="th" src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
      <div class="nb">
        <button class="hl"><h3>${esc(title)}</h3></button>
        ${lead ? `<p>${esc(lead)}</p>` : ''}
        <div class="nfoot">
          <span class="pill" style="color:${s.color}">${esc(s.name)}</span>
          <span class="src">${esc(it.src)} · ${esc(relTime(it.at))}</span>
        </div>
      </div>`;
    a.querySelector('.hl').onclick = ()=> openArticle({...it, series:key}, title, lead);
    list.appendChild(a);
  });
}
$('#btnRefreshNews').onclick = ()=> renderNews(true);

/* 첫 화면이 뜬 뒤 나머지 시리즈를 조용히 미리 받아 둡니다 */
setTimeout(prefetchNews, 20000);

/* ══════════════════════════════════════════════════════════════
   1-2. 마이홈 — 관심 시리즈 · 응원팀 · 응원선수
   ══════════════════════════════════════════════════════════════ */
const myGet = ()=> DB.get('myhome', null);
let myDraft = null;

/* 팀 컬러를 밝게(+) 또는 어둡게(-) 조절합니다 */
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  const ch = i => {
    let v = (n >> (16 - i*8)) & 255;
    v = amt < 0 ? v * (1 + amt) : v + (255 - v) * amt;
    return Math.max(0, Math.min(255, Math.round(v)));
  };
  return '#' + [0,1,2].map(i => ch(i).toString(16).padStart(2,'0')).join('');
}

/* 팀 컬러로 칠한 오리지널 포뮬러카.
   실물 사진 대신 직접 그린 도형이라 저작권 걱정 없이 파일 안에 들어갑니다 */
function carSvg(c){
  const dk = shade(c,-.40), lt = shade(c,.32), ink = shade(c,-.72), tyre = '#15171b';
  const wheel = (x,r) => `
    <circle cx="${x}" cy="88" r="${r}" fill="${tyre}"/>
    <circle cx="${x}" cy="88" r="${r-3}" fill="none" stroke="#2c3037" stroke-width="1.5"/>
    <circle cx="${x}" cy="88" r="${r*.44}" fill="${lt}"/>
    <circle cx="${x}" cy="88" r="${r*.18}" fill="${ink}"/>`;
  return `<svg viewBox="0 0 420 132" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="212" cy="118" rx="176" ry="7" fill="#000" opacity=".22"/>

    <path d="M332 32h76v13h-76z" fill="${c}"/>
    <path d="M338 51h64v8h-64z" fill="${lt}"/>
    <path d="M400 24h12v58h-12z" fill="${dk}"/>

    <path d="M62 96h278v11H62z" fill="${dk}"/>
    <path d="M4 101h70v10H4z" fill="${c}"/>
    <path d="M0 90h11v25H0z" fill="${dk}"/>

    <path d="M9 100 L152 85 L152 97 L9 105 Z" fill="${c}"/>

    <path d="M152 85 C172 73 192 67 212 65 L242 63 L252 40 L268 40 L274 67
             L332 79 L338 96 L152 96 Z" fill="${c}"/>
    <path d="M196 78 L272 76 L322 87 L324 96 L196 96 Z" fill="${dk}"/>
    <path d="M202 81 L268 79 L308 88 L202 88 Z" fill="${lt}" opacity=".38"/>
    <path d="M276 70 L330 81 L332 87 L276 76 Z" fill="${lt}" opacity=".5"/>

    <path d="M214 66 L244 64 L246 74 L216 76 Z" fill="${ink}"/>
    <path d="M178 86 C192 60 226 55 246 63" fill="none" stroke="${ink}"
          stroke-width="7" stroke-linecap="round"/>

    ${wheel(120,28)}
    ${wheel(320,30)}
  </svg>`;
}

/* 응원팀 소속 선수를 먼저, 나머지는 순위대로 */
const myDrivers = team => [...DRIVERS].sort((a,b)=>
  (a.t===team?0:1)-(b.t===team?0:1) || a.p-b.p);

const seriesTeams = s => Object.keys(TEAMS).filter(k => TEAMS[k].s === s);
const teamPhoto   = k => TEAM_PHOTO[TEAMS[k].p || k] || null;
/* F1은 선수 약칭(LEC)을 쓰고, 나머지 시리즈는 제조사 약칭(TOY)을 씁니다 */
const teamCode    = tm => tm.n[1].replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();

/* 팀 하나만 저장하던 예전 형식을 팀 목록 형식으로 바꿔 읽습니다 */
function myNorm(my){
  if(!my) return null;
  return { series: my.series || ['f1'],
           teams:  my.teams || (my.team ? [my.team] : []),
           driver: my.driver || '' };
}

function renderHomeSetup(){
  const my = myNorm(myGet());
  myDraft = myDraft || (my ? { series:[...my.series], teams:[...my.teams], driver:my.driver }
                           : { series:['f1'], teams:[], driver:'' });
  const d = myDraft;

  $('#p-home').innerHTML = `
    <h2 class="hsetup">${t('my.setTitle')}</h2>
    <p class="lbl" style="margin:0 0 20px">${t('my.setLead')}</p>

    <div class="setup-step">
      <div class="fl">${t('my.step1')} <span class="hint">· ${t('my.step1h')}</span></div>
      <div id="myS"></div>
    </div>
    <div class="setup-step">
      <div class="fl">${t('my.step2')} <span class="hint">· ${t('my.step2h')}</span></div>
      <div id="myT"></div>
    </div>
    <div class="setup-step">
      <div class="fl">${t('my.step3')} <span class="hint">· ${t('my.step3h')}</span></div>
      <div class="tgrid" id="myD"></div>
    </div>
    <button class="btn flow" id="myDone">${t('my.done')}</button>`;

  /* mark가 있으면 팀 색 배지에 약칭을 넣어 로고처럼 씁니다 */
  const card = (on, color, label, mark) => {
    const b = el('button', 'tcard' + (on ? ' on' : ''));
    b.type = 'button';
    b.style.setProperty('--tc', color);
    b.innerHTML = (mark ? `<i class="mk" style="background:${color}">${esc(mark)}</i>` : '')
                + `<em>${esc(label)}</em>`;
    return b;
  };

  const paintS = ()=>{
    const box = $('#myS'); box.innerHTML = '';
    const mk = k => {
      const s = SERIES[k];
      const b = card(d.series.includes(k), s.color, s.name);
      b.classList.add('ser');
      b.onclick = ()=>{
        const i = d.series.indexOf(k);
        if(i < 0) d.series.push(k);
        else{
          d.series.splice(i,1);
          d.teams = d.teams.filter(x => TEAMS[x].s !== k);   /* 뺀 시리즈의 팀도 같이 뺍니다 */
        }
        paintS(); paintT(); paintD();
      };
      return b;
    };
    const grid = el('div','tgrid');
    Object.keys(SERIES).forEach(k => grid.appendChild(mk(k)));
    box.appendChild(grid);
  };

  /* 고른 시리즈별로 묶어서 보여주고, 팀은 여러 개 고를 수 있습니다 */
  const paintT = ()=>{
    const box = $('#myT'); box.innerHTML = '';
    if(!d.series.length){ box.innerHTML = `<div class="note">${t('my.needSeries')}</div>`; return; }
    d.series.forEach(sk=>{
      const head = el('div','tgroup');
      head.innerHTML = `<i class="sdot" style="background:${SERIES[sk].color}"></i>${esc(SERIES[sk].name)}`;
      box.appendChild(head);
      const grid = el('div','tgrid');
      seriesTeams(sk).forEach(k=>{
        const tm = TEAMS[k];
        const b = card(d.teams.includes(k), tm.c, lz(tm.n), teamCode(tm));
        b.onclick = ()=>{
          const i = d.teams.indexOf(k);
          if(i < 0) d.teams.push(k); else d.teams.splice(i,1);
          if(!DRIVERS.some(x => x.code===d.driver && d.teams.includes(x.t))) d.driver = '';
          paintT(); paintD();
        };
        grid.appendChild(b);
      });
      box.appendChild(grid);
    });
  };

  /* 선수는 F1만 데이터가 있습니다. 고른 F1 팀 소속을 먼저 보여줍니다 */
  const paintD = ()=>{
    const box = $('#myD'); box.innerHTML = '';
    const mine = d.teams.filter(k => TEAMS[k].s === 'f1');
    if(!mine.length){ box.innerHTML = `<div class="note">${t('my.noF1')}</div>`; return; }
    [...DRIVERS].sort((a,b)=> (mine.includes(a.t)?0:1)-(mine.includes(b.t)?0:1) || a.p-b.p)
      .forEach(dr=>{
        const b = card(d.driver === dr.code, TEAMS[dr.t].c, lz(dr.n), dr.code);
        b.onclick = ()=>{ d.driver = dr.code; paintD(); };
        box.appendChild(b);
      });
  };
  paintS(); paintT(); paintD();

  $('#myDone').onclick = ()=>{
    if(!d.series.length) return toast(t('my.needSeries'));
    if(!d.teams.length)  return toast(t('my.needTeam'));
    const f1 = d.teams.filter(k => TEAMS[k].s === 'f1');
    if(f1.length && !DRIVERS.some(x => x.code === d.driver)) d.driver = myDrivers(f1[0])[0].code;
    DB.set('myhome', { series:[...d.series], teams:[...d.teams], driver:d.driver });
    myDraft = null;
    toast(t('my.saved'));
    renderHome();
  };
}

/* 관심 시리즈 소식을 모아, 응원팀·응원선수가 언급된 것만 골라냅니다 */
async function homeNews(my){
  const out = [];
  for(const s of my.series){
    if(SERIES[s]?.noNews) continue;      /* 출처에 사진이 없어 소식에서 뺀 시리즈 */
    let c = DB.get('news3-'+s, null);
    if(!c || Date.now() - c.at > NEWS_TTL){
      try{ c = { at:Date.now(), items: await fetchNews(s) }; DB.set('news3-'+s, c); }
      catch(e){ if(!c) continue; }
    }
    await ensureTitles(s, c);
    c.items.forEach((it,i)=> out.push({ ...it, series:s, tt: (c.hs?.[L]?.[i]) || (c.tr?.[L]?.[i] ? hl(c.tr[L][i]) : it.title),
                                        td: (c.hsd?.[L]?.[i]) || c.trd?.[L]?.[i] || it.desc || '' }));
  }
  out.sort((a,b)=> (b.at||0) - (a.at||0));

  /* 성(姓)과 팀 이름으로 찾습니다. 세 글자 약칭(LEC 등)은
     electric·select 같은 단어에 걸려서 쓰지 않습니다 */
  const dr = DRIVERS.find(x => x.code === my.driver);
  const words = [ dr && dr.key, ...my.teams.map(k => TEAMS[k].n[1]) ]
                  .filter(Boolean).map(w => w.toLowerCase());
  const seen = new Set();
  const hit = out.filter(it => {
    const s = (it.title + ' ' + (it.desc||'')).toLowerCase();
    if(!words.some(w => s.includes(w))) return false;
    if(seen.has(it.link)) return false;        /* 여러 시리즈를 고르면 같은 기사가 겹칩니다 */
    seen.add(it.link);
    return true;
  });
  return { mine: hit.slice(0,12), all: out.slice(0,12) };
}

/* ══════════════════════════════════════════════════════════════
   승자 맞히기 — 경기 전에 우승자를 고르고, 끝나면 채점해 포인트를 받습니다.
   결과를 자동으로 받아올 데이터가 없어서, 경기가 끝나면 누가 이겼는지
   직접 골라 확정하는 방식입니다.
   ══════════════════════════════════════════════════════════════ */
const GAME_HIT = 50;          /* 적중 기본 점수 */
const GAME_BONUS = 10;        /* 연속 적중 1회당 보너스 */
const GAME_BONUS_MAX = 50;

const RANKS = [
  { at:0,    n:['루키','Rookie','ルーキー'] },
  { at:150,  n:['세미프로','Semi-pro','セミプロ'] },
  { at:400,  n:['프로','Pro','プロ'] },
  { at:900,  n:['에이스','Ace','エース'] },
  { at:1800, n:['레전드','Legend','レジェンド'] },
];

const picksOf  = ()=> DB.get('picks', {});
const pointsOf = ()=> Object.values(picksOf()).reduce((s,p)=> s + (p.pts || 0), 0);
const rankOf   = pts => [...RANKS].reverse().find(r => pts >= r.at) || RANKS[0];

/* 최근 경기부터 거슬러 올라가며 연속 적중 횟수를 셉니다 */
function streakOf(){
  const done = Object.entries(picksOf())
    .filter(([,p]) => p.result)
    .sort((a,b) => (b[1].at || 0) - (a[1].at || 0));
  let n = 0;
  for(const [,p] of done){ if(p.pick === p.result) n++; else break; }
  return n;
}

/* F1은 드라이버, 나머지 시리즈는 제조사를 고릅니다 */
function pickables(r){
  if(r.s === 'f1') return DRIVERS.map(d => ({ k:d.code, n:lz(d.n), c:TEAMS[d.t].c, mk:d.code }));
  return seriesTeams(r.s).map(k => ({ k, n:lz(TEAMS[k].n), c:TEAMS[k].c, mk:teamCode(TEAMS[k]) }));
}
const pickName = (r, k) => (pickables(r).find(x => x.k === k) || {}).n || k;

/* 사흘 안에 채점한 결과가 있으면 카드 위에 띄워 줍니다 */
function lastScored(){
  const picks = picksOf();
  const hit = Object.entries(picks)
    .filter(([,p]) => p.result && Date.now() - (p.at || 0) < 3*86400000)
    .sort((a,b) => (b[1].at || 0) - (a[1].at || 0))[0];
  if(!hit) return null;
  const r = RACES.find(x => x.id === hit[0]);
  return r ? { r, p:hit[1] } : null;
}

/* 결과를 아직 안 넣은 지난 경기가 있으면 그것부터, 없으면 다음 경기 */
function gameRace(){
  const picks = picksOf();
  const pending = RACES
    .filter(r => status(r) === 'done' && picks[r.id] && !picks[r.id].result)
    .sort((a,b) => b.ms - a.ms)[0];
  return pending || nextRace();
}

function gameCard(){
  const r = gameRace();
  if(!r) return '';
  const picks = picksOf(), mine = picks[r.id];
  const pts = pointsOf(), rank = rankOf(pts), streak = streakOf();
  const st = status(r);
  const last = lastScored();

  let body;
  if(mine && st === 'done' && !mine.result){
    body = `<div class="gm-my">${t('gm.picked', esc(pickName(r, mine.pick)))}</div>
            <button class="btn flow sm" id="gmResult">${t('gm.enterResult')}</button>`;
  }else if(mine){
    body = `<div class="gm-my">${t('gm.picked', esc(pickName(r, mine.pick)))}</div>
            ${st === 'soon' ? `<button class="btn ghost sm" id="gmPick">${t('gm.change')}</button>`
                            : `<div class="note">${t('gm.locked')}</div>`}`;
  }else if(st === 'soon'){
    body = `<button class="btn flow sm" id="gmPick">${t('gm.pick')}</button>`;
  }else{
    body = `<div class="note">${t('gm.tooLate')}</div>`;
  }

  return `
    <div class="gm">
      <div class="gm-top">
        <div class="gm-rank">
          <b>${esc(lz3(rank.n))}</b>
          <span>${pts.toLocaleString()} P</span>
        </div>
        ${streak > 1 ? `<div class="gm-streak">${t('gm.streak', streak)}</div>` : ''}
      </div>
      <div class="gm-race">
        <i class="sdot" style="background:${SERIES[r.s].color}"></i>
        <b>${esc(rname(r))}</b>
        <span>${st === 'done' ? t('gm.ended') : fmtShort(r.ms)}</span>
      </div>
      ${last ? `<div class="gm-res ${last.p.pick === last.p.result ? 'hit' : 'miss'}">
            <b>${last.p.pick === last.p.result ? t('gm.hit', last.p.pts) : t('gm.miss')}</b>
            <span>${esc(rname(last.r))} · ${t('gm.answer', esc(pickName(last.r, last.p.result)))}</span>
          </div>` : ''}
      <div class="gm-q">${t('gm.q')}</div>
      ${body}
    </div>`;
}

function wireGame(){
  const r = gameRace(); if(!r) return;
  const bp = $('#gmPick'), br = $('#gmResult');
  if(bp) bp.onclick = ()=> openPick(r, false);
  if(br) br.onclick = ()=> openPick(r, true);
}

/* result=false면 예측, true면 실제 결과 입력 */
function openPick(r, result){
  const list = pickables(r);
  const cur = result ? null : (picksOf()[r.id] || {}).pick;
  openSheet(`
    <h2>${result ? t('gm.whoWon') : t('gm.q')}</h2>
    <div class="muted">${esc(rname(r))} · ${esc(fmtFull(r.ms))}</div>
    <div class="tgrid" id="gmGrid" style="margin-top:14px"></div>
    <button class="btn ghost sm" id="gmClose">${t('r.close')}</button>`);

  const grid = $('#gmGrid');
  list.forEach(x=>{
    const b = el('button', 'tcard' + (x.k === cur ? ' on' : ''));
    b.type = 'button';
    b.style.setProperty('--tc', x.c);
    b.innerHTML = `<i class="mk" style="background:${x.c}">${esc(x.mk)}</i><em>${esc(x.n)}</em>`;
    b.onclick = ()=>{
      const all = picksOf();
      if(result){
        const p = all[r.id]; if(!p) return;
        p.result = x.k;
        p.at = Date.now();   /* 최근 채점 순서를 이 시각으로 셉니다 */
        const win = p.pick === x.k;
        p.pts = win ? GAME_HIT + Math.min(streakOf() * GAME_BONUS, GAME_BONUS_MAX) : 0;
        all[r.id] = p;
        DB.set('picks', all);
        toast(win ? t('gm.hit', p.pts) : t('gm.miss'));
      }else{
        all[r.id] = { pick:x.k, at:Date.now(), result:null, pts:0 };
        DB.set('picks', all);
        toast(t('gm.saved', x.n));
      }
      closeSheet();
      renderHome();
    };
    grid.appendChild(b);
  });
  $('#gmClose').onclick = closeSheet;
}

async function renderHome(){
  const my = myNorm(myGet());
  if(!my || !my.teams.length) return renderHomeSetup();

  const dr = DRIVERS.find(x => x.code === my.driver) || null;
  /* 응원선수가 속한 팀을 맨 위로 올립니다 */
  const order = [...my.teams].sort((a,b)=>
    (dr && b === dr.t ? 1 : 0) - (dr && a === dr.t ? 1 : 0));
  const hasF1 = my.teams.some(k => TEAMS[k].s === 'f1');
  const lead  = dr ? lz(dr.n) : lz(TEAMS[order[0]].n);

  $('#p-home').innerHTML = gameCard() +
    order.map(k => teamCard(k, dr)).join('') + `
    ${hasF1 ? '' : `<div class="note" style="margin-top:14px">${t('my.other')}</div>`}
    <div class="hsec">

      <button class="refresh" id="myRefresh">${t('news.refresh')}</button>
    </div>
    <div id="myNews"><div class="skel"></div><div class="skel"></div></div>
    <button class="btn ghost sm" id="myEdit" style="margin-top:24px">${t('my.edit')}</button>`;

  wireGame();
  $('#myEdit').onclick    = ()=>{ myDraft = null; renderHomeSetup(); };
  $('#myRefresh').onclick = ()=>{ my.series.forEach(s => DB.del('news3-'+s)); renderHome(); };

  const box = $('#myNews');
  try{
    const { mine, all } = await homeNews(my);
    const list = mine.length ? mine : all;
    box.innerHTML = '';
    if(!list.length){ box.innerHTML = `<div class="empty">${ic('news')}${t('my.noNews')}</div>`; return; }
    if(!mine.length){
      const h = el('div','note'); h.style.marginBottom = '10px';

    }
    list.forEach((it,i)=>{ const c = newsCard(it); c.style.animationDelay = Math.min(i,8)*28+'ms'; box.appendChild(c); });
  }catch(e){
    box.innerHTML = `<div class="empty">${ic('wifi')}${t('news.failedShort')}</div>`;
  }
}

/* 이름/성을 나눠 성만 굵게 — 중계 그래픽처럼 보이게 */
function dnameHtml(d){
  const full = dname(d), i = full.lastIndexOf(' ');
  return i < 0 ? esc(full)
               : `<span class="gn">${esc(full.slice(0,i))}</span>${esc(full.slice(i+1))}`;
}
/* 결과 데이터(영문 포디움)에서 우승·포디움 수를 셉니다 */
function driverStats(d){
  let wins=0, pod=0;
  RACES.forEach(r=>{
    if(r.s!=='f1' || !r.p) return;
    const en = r.p[1];
    if(en[0].includes(d.key)) wins++;
    if(en.some(x=>x.includes(d.key))) pod++;
  });
  return {wins, pod};
}

let calYM = (()=>{ const p = partsNow(); return {y:p.y, m:p.m}; })();
let calSel = null;
const visibleRaces = ()=> calFilter==='all' ? RACES : RACES.filter(r=>r.s===calFilter);

function buildCalChips(){
  const box = $('#calChips'); box.innerHTML = '';
  const mk = (k,label,color)=>{
    const b = el('button','chip' + (k===calFilter?' on':''));
    b.innerHTML = (color?`<i class="sdot" style="background:${color}"></i>`:'') + esc(label);
    b.onclick = ()=>{ calFilter = k; calSel = null; renderCal(); };
    box.appendChild(b);
  };
  mk('all', t('cal.all'));
  Object.entries(SERIES).forEach(([k,s])=> mk(k, s.name, s.color));
}

function renderCal(){
  /* 캘린더 카드 — 다음 경기가 없으면 숨깁니다 */
  const cta = $('#calCta'), nr = nextRace();
  if(cta){
    cta.hidden = !nr;
    if(nr){
      /* widTheme 은 이 함수보다 아래에서 선언됩니다. 지금은 부팅이 소식 탭으로
         시작해 문제가 없지만, 순서가 바뀌어도 앱이 멈추지 않도록 감쌉니다 */
      try{ const sz = widSize(); $('#calCtaPrev').innerHTML = widgetSvg(nr, widTheme, sz.w, sz.h, widLay()); }catch(e){}
      cta.onclick = openWidget;
    }
  }
  buildCalPills();
  $('#calView').hidden   = calMode !== 'cal';
  $('#standView').hidden = calMode !== 'stand';
  if(calMode === 'stand'){ renderStandings(); return; }

  buildCalChips();
  renderHero();
  const {y,m} = calYM;
  $('#calTitle').textContent = fmtMonth(Date.UTC(y, m-1, 15, 12));

  const byDay = {};
  visibleRaces().forEach(r=>{ (byDay[dayKey(r.ms)] ||= []).push(r); });

  const grid = $('#cgrid'); grid.innerHTML = '';
  t('cal.dow').forEach(d=>{ const h = el('div','dow'); h.textContent = d; grid.appendChild(h); });

  const lead = new Date(Date.UTC(y, m-1, 1)).getUTCDay();
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const todayKey = dayKey(Date.now());

  for(let i=0;i<lead;i++) grid.appendChild(el('button','cell pad'));
  for(let d=1; d<=days; d++){
    const key = `${y}-${m}-${d}`;
    const races = byDay[key] || [];
    const c = el('button','cell' + (races.length?' has':'') + (key===todayKey?' today':'')
              + (key===calSel?' sel':'') + ((lead+d-1)%7===0?' sun':''));
    /* 점만 찍지 않고 어떤 시리즈 경기인지 이름을 함께 적습니다 (2개까지, 나머지는 +N) */
    c.innerHTML = `<span class="d num">${d}</span>`
      + races.slice(0,2).map(r=>
          `<span class="cl" style="color:${SERIES[r.s].color}">${esc(SERIES[r.s].name)}</span>`).join('')
      + (races.length > 2 ? `<span class="cl more">+${races.length-2}</span>` : '');
    /* 날짜를 누르면 맨 위 히어로 카드가 그 경기(서킷·일시·남은 시간)로 바뀌므로
       히어로가 보이도록 위로 스크롤합니다 */
    if(races.length) c.onclick = ()=>{
      const sel = calSel === key ? null : key;
      calSel = sel; renderCal();
      if(!sel) return;
      requestAnimationFrame(()=>{
        const before = window.scrollY;
        window.scrollTo({top:0, behavior:'smooth'});
        /* 부드러운 스크롤이 동작하지 않는 환경(웹뷰 등) 대비 —
           애니메이션이 돌고 있으면 위치가 이미 바뀌었으므로 건드리지 않습니다 */
        setTimeout(()=>{ if(window.scrollY === before && before !== 0) window.scrollTo(0, 0); }, 400);
      });
    };
    grid.appendChild(c);
  }

  const list = $('#raceList'); list.innerHTML = '';
  let shown, title;
  if(calSel){
    shown = byDay[calSel] || [];
    title = t('cal.day', fmtDate(shown[0]?.ms ?? Date.now()));
  }else{
    shown = visibleRaces().filter(r=>{ const p = dayKey(r.ms).split('-'); return +p[0]===y && +p[1]===m; });
    title = t('cal.month', fmtMonth(Date.UTC(y,m-1,15,12)), shown.length);
  }
  $('#listTitle').textContent = title;

  if(!shown.length){
    list.innerHTML = `<div class="empty">${ic('flag')}${t('cal.none')}</div>`;
  }else{
    shown.forEach((r,i)=> list.appendChild(raceCard(r,i)));
  }
  if(!calSel){
    const up = RACES.filter(r=>r.ms > Date.now()).slice(0,3);
    if(up.length){
      const h = el('div','sec'); h.textContent = t('cal.upcoming'); list.appendChild(h);
      up.forEach((r,i)=> list.appendChild(raceCard(r,i)));
    }
  }
}

function raceCard(r, i){
  const s = SERIES[r.s], st = status(r);
  const b = el('button','rcard');
  b.style.animationDelay = Math.min(i,8)*28 + 'ms';
  /* 월·요일은 언어별 접미사(8月 / Aug)가 붙으므로 통째로, 일자는 숫자만 뽑습니다 */
  const g = k => k==='day'
    ? (dtf({day:'numeric'}).formatToParts(r.ms).find(x=>x.type==='day')?.value ?? '')
    : dtf(k==='month' ? {month:'short'} : {weekday:'short'}).format(r.ms);
  const stat = st==='live' ? `<div class="dd" style="color:#e5162b">${t('r.live')}</div>`
             : st==='done' ? `<div class="dd" style="color:var(--tx-3)">${t('r.done')}</div>`
             : `<div class="dd num">D-${Math.max(0,Math.ceil((r.ms-Date.now())/86400000))}</div>
                <div class="tm num">${fmtTime(r.ms)}</div>`;
  b.innerHTML = `
    <div class="rdate" style="color:${s.color}">
      <span style="position:absolute;inset:0;background:${s.color};opacity:.11"></span>
      <span class="mo">${esc(g('month'))}</span>
      <span class="dd num">${esc(g('day'))}</span>
      <span class="wd">${esc(g('weekday'))}</span>
    </div>
    <div class="rmain">
      <div class="rtop"><i class="sdot" style="background:${s.color}"></i>${esc(s.name)} · ${t('r.round', r.r)}
        ${r.sp?`<span class="tag" style="padding:2px 6px;font-size:9px">${t('r.sprint')}</span>`:''}</div>
      <div class="rname">${ccTag(r)}${esc(rname(r))}</div>
      <div class="rsub">${esc(rcirc(r))}</div>
    </div>
    <div class="rstat">${stat}</div>`;
  b.onclick = ()=> openRace(r);
  return b;
}

/* ── 시트 ── */
function openSheet(html){
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#scrim').classList.add('open');
  $('#sheet').scrollTop = 0;
}
let sheetClearTimer;
function closeSheet(){
  $('#scrim').classList.remove('open');
  /* 닫힌 뒤에도 내용이 DOM에 남으면 지난 방의 입력창·로그가 살아 있는 것처럼 보입니다.
     애니메이션이 끝난 뒤, 그 사이 다시 열리지 않았을 때만 비웁니다. */
  clearTimeout(sheetClearTimer);
  sheetClearTimer = setTimeout(()=>{
    if(!$('#scrim').classList.contains('open')) $('#sheet').innerHTML = '';
  }, 450);
}
$('#scrim').onclick = e => { if(e.target.id === 'scrim') closeSheet(); };

/* 채널 홈 대신 그 경기 영상으로 바로 보냅니다.
   경기 전·중이면 생중계 페이지, 끝난 뒤면 지난 방송 목록으로 갑니다 */
function watchUrl(w, r){
  if(!w.yt) return w.url;
  return 'https://www.youtube.com/@' + w.yt + (status(r) === 'done' ? '/streams' : '/live');
}

/* 이 경기 영상을 유튜브에서 바로 찾아 줍니다 */
function videoSearch(r){
  const q = [SERIES[r.s].full[1], r.c[1], new Date(r.ms).getFullYear(),
             status(r) === 'done' ? 'highlights' : 'live'].join(' ');
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
}

/* 경기 영상을 앱 안에서 바로 재생합니다.
   유튜브 검색 결과를 통째로 임베드하는 방법(listType=search)은 막혀 있어서,
   서버가 대신 검색 페이지를 받아와 영상 목록을 뽑고, 그중 이 경기 영상을 골라 넣습니다.
   같은 주말에 다른 선수권(TC 아메리카·GT4 등)이 함께 열려 그쪽 영상이 위로 올 때가 있어
   제목에 서킷과 시리즈 이름이 들어갔는지로 점수를 매겨 고릅니다. */
const vidCache = {};

function ytQuery(r){
  return ['"' + SERIES[r.s].full[1] + '"', r.c[1], new Date(r.ms).getFullYear(),
          status(r) === 'done' ? 'highlights' : 'live'].join(' ');
}

/* 검색 결과에서 영상 하나를 고릅니다 */
function pickVideo(html, r){
  const shorts = new Set([...html.matchAll(/"reelWatchEndpoint":\{"videoId":"([\w-]{11})"/g)].map(m => m[1]));
  const seen = new Set(), list = [];
  /* videoRenderer 덩어리마다 id와 제목이 함께 들어 있습니다 */
  for(const chunk of html.split('"videoRenderer"')){
    const id = (chunk.match(/"videoId":"([\w-]{11})"/) || [])[1];
    if(!id || shorts.has(id) || seen.has(id)) continue;
    const title = (chunk.match(/"title":\{"runs":\[\{"text":"([^"]{3,120})"/) || [])[1] || '';
    seen.add(id);
    list.push({ id, title });
  }
  if(!list.length) return null;

  const ours   = SERIES[r.s].full[1].toLowerCase();
  const track  = r.c[1].toLowerCase();
  const others = Object.keys(SERIES).filter(k => k !== r.s).map(k => SERIES[k].full[1].toLowerCase())
                   .concat(['tc america','gt4 america','gt4 europe','gt2 european','formula 4','f1 academy']);

  /* 서킷 이름이 제목에 안 나오는 경기가 있습니다(예: Virginia International → "VIR").
     그래서 경기 이름의 낱말도 보되, 어느 경기에나 나오는 흔한 말은 빼야
     엉뚱한 영상이 걸립니다 */
  const COMMON = new Set(['race','races','grand','prix','hours','hour','challenge','michelin',
    'sprint','cup','international','circuit','speedway','raceway','motor','park','round',
    'the','and','at','of','pirelli','powered','aws','gt','gt3','gt4','miles','km']);
  const words = r.n[1].toLowerCase().split(/[^a-z0-9]+/)
                  .filter(x => x.length > 2 && !COMMON.has(x));

  const score = v => {
    const t = v.title.toLowerCase();
    let s = 0;
    if(t.includes(track)) s += 5;
    if(t.includes(ours))  s += 4;
    if(words.some(x => t.includes(x))) s += 2;
    if(others.some(o => t.includes(o) && !t.includes(ours))) s -= 6;   /* 다른 선수권 영상 */
    if(/highlight|하이라이트|ハイライト|full race|決勝/.test(t)) s += 2;
    if(/preview|프리뷰|예고|trailer|onboard/.test(t)) s -= 3;          /* 경기 영상이 아닌 것 */
    return s;
  };
  const best = list.map(v => ({ ...v, s: score(v) })).sort((a,b) => b.s - a.s)[0];
  return best.s > 0 ? best.id : list[0].id;
}

async function findVideo(r){
  if(vidCache[r.id] !== undefined) return vidCache[r.id];
  if(!HOSTED){ vidCache[r.id] = null; return null; }
  try{
    const ac = new AbortController();
    const timer = setTimeout(()=>ac.abort(), 12000);
    const res = await fetch('/api/yt/results?search_query=' + encodeURIComponent(ytQuery(r)),
                            { signal: ac.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const id = pickVideo(await res.text(), r);
    vidCache[r.id] = id;
    return id;
  }catch(e){ vidCache[r.id] = null; return null; }
}

/* 경기 카드 안의 영상 자리를 채웁니다 */
async function fillVideo(r){
  const box = document.getElementById('vidBox');
  if(!box) return;
  const id = await findVideo(r);
  if(!document.getElementById('vidBox')) return;      /* 그 사이 카드가 닫혔으면 그만둡니다 */
  if(!id){
    box.innerHTML = `<a class="btn ghost sm vidout" href="${esc(videoSearch(r))}"
                        target="_blank" rel="noopener noreferrer">${t('watch.openYt')}</a>`;
    return;
  }
  box.innerHTML = `<div class="vidwrap">
      <iframe src="https://www.youtube-nocookie.com/embed/${esc(id)}?rel=0"
              title="${esc(rname(r))}" loading="lazy" allowfullscreen
              allow="accelerometer; encrypted-media; picture-in-picture; fullscreen"></iframe>
    </div>`;
}

function openRace(r){
  const s = SERIES[r.s], st = status(r);
  const rev = DB.get('reviews', {})[r.id];
  const ck = circuitKey(r);

  const watch = (WATCH[r.s]||[]).map(w=>`
    <a class="watch" href="${watchUrl(w, r)}" target="_blank" rel="noopener noreferrer">
      <span class="ico" style="background:linear-gradient(152deg,${w.c1},${w.c2})">${
        w.ico ? ic(w.ico,'fill') : esc(w.mark).replace(/\n/g,'<br>')}</span>
      <span class="nm">${esc(w.nm)}</span><span class="sb">${esc(lz(w.sb))}</span>
    </a>`).join('');

  /* 주말 타임테이블 — 날짜가 바뀔 때마다 머리글을 넣고, 다음 세션을 강조합니다.
     같은 주말 2차전처럼 결승 하나뿐이면 카드를 아예 내지 않습니다 (위 시각 카드와 겹칩니다) */
  const ses = sessionsOf(r), upNext = ses.find(x => x.end > Date.now());
  let lastDay = '';
  const sesRows = ses.map(se=>{
    const sst = sesStatus(se), dk = dayKey(se.ms);
    const head = dk === lastDay ? '' : `<div class="tday">${esc(fmtDate(se.ms))}</div>`;
    lastDay = dk;
    const badge = sst === 'live' ? t('ses.now')
                : se === upNext  ? esc(shortLeft(se.ms)) : '';
    const cls = [sst === 'done' && 'past', sst === 'live' && 'now',
                 sst === 'soon' && se === upNext && 'next', se.key && 'key'].filter(Boolean).join(' ');
    return `${head}<div class="ses ${cls}">
      <i class="dot"></i><span class="sn">${esc(sesName(se.k))}</span>
      <span class="st num">${esc(fmtTime(se.ms))}</span><span class="sd">${badge}</span></div>`;
  }).join('');
  const sesHtml = ses.length < 2 ? '' : `<div class="sec">${t('ses.title')}</div>
    <div class="card ttbl" style="--acc:${s.color}">${sesRows}</div>
    ${r.ss ? '' : `<div class="note">${t('ses.est')}</div>`}`;

  let resultHtml = '';
  if(st !== 'soon'){
    resultHtml = `<div class="sec">${t('r.results')}</div>` + (r.p
      ? `<div class="podium">${lz(r.p).map((n,i)=>`<div class="pod"><b class="p${i+1}">${i+1}</b>${esc(n)}</div>`).join('')}</div>`
      : `<div class="note">${t('r.noResults')}
           <a href="${s.results}" target="_blank" rel="noopener noreferrer"
              style="color:var(--br);font-weight:800">${esc(t('r.official', s.name))}</a></div>`);
  }

  const rateHtml = st === 'done' ? `
    <div class="sec">${t('r.rate')}</div>
    <div class="stars" id="starRow">${[1,2,3,4,5].map(i=>
      `<button data-v="${i}" class="${rev&&rev.stars>=i?'lit':''}" aria-label="${i}">
         <svg viewBox="0 0 24 24">${PATHS.star}</svg></button>`).join('')}</div>
    <textarea id="revText">${esc(rev?.text || '')}</textarea>
    <button class="btn flow" id="saveRev">${t('r.saveRate')}</button>` : '';

  openSheet(`
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap">
      <span class="tag solid" style="background:${s.color}">${esc(s.name)} ${t('r.round', r.r)}</span>
      ${r.sp?`<span class="tag">${t('r.sprintWknd')}</span>`:''}
      ${st==='live'?`<span class="tag live">${t('r.live')}</span>`:''}
      ${st==='done'?`<span class="tag grey">${t('r.done')}</span>`:''}
    </div>
    <h3>${ccTag(r)}${esc(rname(r))}</h3>
    <div class="muted">${esc(rcirc(r))} · ${esc(sfull(r.s))}</div>
    ${ck ? `<div class="trkcard" id="trkCard" style="--acc:${s.color}">
             <span class="wash"></span>
             <span class="info"><b>${esc(rcirc(r))}</b><span class="lbl">${t('r.trackTap')}</span></span>
             ${track3d(ck, s.color, 150, 'trk3dEl')}
           </div>` : ''}
    <div class="card" style="margin-top:14px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:800;letter-spacing:-.02em">${fmtFull(r.ms)}</div>
        <div class="muted">${esc(t('r.tzNote', TZ, r.h))}</div>
      </div>
      ${st==='soon' ? `<div style="text-align:right;flex:0 0 auto">
        <div class="num" style="font-size:19px;font-weight:800;color:var(--br);letter-spacing:-.03em">D-${Math.max(0,Math.ceil((r.ms-Date.now())/86400000))}</div>
        <div class="muted">${esc(leftTime(r.ms))}</div></div>` : ''}
    </div>
    ${sesHtml}
    <button class="btn ghost sm" id="btnIcs">${ic('cal')} ${t('r.addCal')}</button>

    <div class="sec">${t('watch.video')}</div>
    <div id="vidBox"><div class="skel vid"></div></div>
    <div class="sec">${t('r.watch')}</div>
    <div class="wgrid">${watch}</div>
    <div class="note">${t('r.watchNote')}</div>

    ${resultHtml}${rateHtml}

    <button class="btn ghost sm" id="btnRoom">${ic('chat')} ${t('r.makeRoom')}</button>
    <button class="btn ghost sm" id="btnClose">${t('r.close')}</button>`);
  fillVideo(r);

  $('#btnClose').onclick = closeSheet;
  $('#btnIcs').onclick   = ()=> downloadIcs(r);
  /* 서킷 카드를 누르면 3D ↔ 평면(위에서 본 모습) 전환 */
  const tc = $('#trkCard');
  if(tc) tc.onclick = ()=> $('#trk3dEl').classList.toggle('flat');
  $('#btnRoom').onclick  = ()=>{ closeSheet(); switchTab('chat'); openCreateRoom(r.id); };

  if(st === 'done'){
    let picked = rev?.stars || 0;
    const row = $('#starRow');
    row.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ picked = +b.dataset.v;
        row.querySelectorAll('button').forEach(x=> x.classList.toggle('lit', +x.dataset.v <= picked)); };
    });
    $('#saveRev').onclick = ()=>{
      if(!picked){ toast(t('r.pickStar')); return; }
      const all = DB.get('reviews', {});
      all[r.id] = { stars:picked, text:$('#revText').value.trim().slice(0,500), at:Date.now() };
      DB.set('reviews', all);
      toast(t('r.saved', picked)); closeSheet();
    };
  }
}

/* 주말 전체를 세션마다 하나씩 일정으로 만들어 내려받습니다 */
function downloadIcs(r){
  const s = SERIES[r.s], z = n => String(n).padStart(2,'0');
  const f = ms => { const d = new Date(ms);
    return d.getUTCFullYear()+z(d.getUTCMonth()+1)+z(d.getUTCDate())+'T'+z(d.getUTCHours())+z(d.getUTCMinutes())+'00Z'; };
  /* ICS는 , ; \ 를 이스케이프해야 합니다 — 경기·서킷 이름에 들어가면 줄이 깨집니다 */
  const q = v => String(v).replace(/([\\,;])/g, '\\$1').replace(/\r?\n/g, '\\n');
  const stamp = f(Date.now());
  const ses = sessionsOf(r);
  const ev = se => {
    const nm = s.name + ' R' + r.r + ' ' + rname(r) + (se.k === 'r' ? '' : ' — ' + sesName(se.k));
    return ['BEGIN:VEVENT','UID:'+r.id+'-'+se.k+'@apex-motorsport','DTSTAMP:'+stamp,
      'DTSTART:'+f(se.ms),'DTEND:'+f(se.end),
      'SUMMARY:'+q(nm),'LOCATION:'+q(rcirc(r)),'DESCRIPTION:'+q(sfull(r.s)),
      'BEGIN:VALARM','TRIGGER:-PT'+CFG.lead+'M','ACTION:DISPLAY','DESCRIPTION:'+q(nm),'END:VALARM',
      'END:VEVENT'];
  };
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//APEX Motorsport//EN','CALSCALE:GREGORIAN']
    .concat(...ses.map(ev), ['END:VCALENDAR']).join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], {type:'text/calendar;charset=utf-8'}));
  const a = el('a'); a.href = url; a.download = r.id + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast(ses.length > 1 ? t('ses.icsAll', ses.length) : t('r.icsDone'));
}

   3. 단톡방
   ══════════════════════════════════════════════════════════════ */
const DAY = 24*3600*1000;
const raceOf = id => RACES.find(r=>r.id===id);

/* 경기 연결 방은 경기 종료 시점부터, 자유 방은 생성 시점부터 24시간을 셉니다. */
function deadlineOf(room){
  const base = room.raceId ? (raceOf(room.raceId)?.end ?? room.createdAt) : room.createdAt;
  return Math.max(room.lastActivity || room.createdAt, base) + DAY;
}
function pruneRooms(){
  const rooms = DB.get('rooms', []);
  const keep  = rooms.filter(r => Date.now() < deadlineOf(r));
  if(keep.length !== rooms.length){
    DB.set('rooms', keep);
    const msgs = DB.get('msgs', {});
    Object.keys(msgs).forEach(k=>{ if(!keep.some(r=>r.id===k)) delete msgs[k]; });
    DB.set('msgs', msgs);
  }
  return keep;
}

const NTFY  = 'https://ntfy.sh/';
const LOBBY = 'apex-motorsport-lobby-v1';

/* 토픽별로 마지막에 받은 메시지 id를 기억해 두고, 다음부터는 그 뒤엣것만 받습니다.
   전에는 2.5초마다 방의 전체 대화를 처음부터 다시 내려받아, 대화가 쌓일수록
   무거워지고 무료 서버의 전송 한도도 빨리 썼습니다. */
const ntfyLast = {};
async function ntfyPoll(topic, onlyNew){
  const since = (onlyNew && ntfyLast[topic]) ? ntfyLast[topic] : 'all';
  const r = await fetch(NTFY + topic + '/json?poll=1&since=' + since, {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const txt = (await r.text()).trim();
  if(!txt) return [];
  const out = [];
  txt.split('\n').forEach(line=>{
    let row; try{ row = JSON.parse(line); }catch(e){ return; }
    if(row.id) ntfyLast[topic] = row.id;
    if(typeof row.message !== 'string') return;
    try{ out.push(JSON.parse(b64dec(row.message))); }                  /* 지금 형식 */
    catch(e){ try{ out.push(JSON.parse(row.message)); }catch(e2){} }   /* 예전 평문 */
  });
  return out;
}
/* ── 내 기기 사본 ──
   무료 서버는 12시간이 지나면 대화를 지웁니다. 내가 한 번 받아둔 것은
   이 기기에 남겨두고 서버 응답과 합쳐서 보여줍니다. 그래서 대화가 안 사라집니다. */
const msgKey = m => (m.sys ? 's' : 'm') + '|' + (m.who || '') + '|' + m.text + '|' + (m.img || '') + '|' + m.at;
function mirrorMsgs(roomId, fresh){
  const map = new Map();
  DB.get('mir-' + roomId, []).concat(fresh).forEach(m => map.set(msgKey(m), m));
  const merged = [...map.values()].sort((a,b)=>a.at - b.at).slice(-300);
  DB.set('mir-' + roomId, merged);
  return merged;
}
/* 방 목록도 같은 방식으로 — 서버에서 사라져도 24시간 규칙이 살아 있게 */
function mirrorRooms(fresh){
  const map = new Map();
  DB.get('mir-rooms', []).forEach(r => map.set(r.id, r));
  fresh.forEach(r=>{
    const prev = map.get(r.id);
    map.set(r.id, prev && prev.lastActivity > r.lastActivity ? prev : r);
  });
  const alive = [...map.values()].filter(r => Date.now() < deadlineOf(r));
  DB.set('mir-rooms', alive);
  /* 사라진 방의 대화 사본도 함께 정리 */
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith('ms-mir-') && k !== 'ms-mir-rooms'
       && !alive.some(r => 'ms-mir-' + r.id === k)) localStorage.removeItem(k);
  });
  return alive;
}

/* ntfy는 한글이 섞인 본문을 파일 첨부로 바꿔버려서 대화가 통째로 사라집니다.
   그래서 보낼 때 base64(ASCII)로 감싸고, 받을 때 되돌립니다. */
const b64enc = s => btoa(String.fromCharCode.apply(null, new TextEncoder().encode(s)));
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));

async function ntfyPub(topic, obj){
  const r = await fetch(NTFY + topic, {method:'POST', body:b64enc(JSON.stringify(obj))});
  if(r.status === 429){ const e = new Error('rate'); e.rate = true; throw e; }   /* 무료 서버 전송 제한 */
  if(!r.ok) throw new Error('HTTP ' + r.status);
}

const beatAt = {};
async function beat(room, force){
  const now = Date.now();
  if(!force && now - (beatAt[room.id] || 0) < 20000) return;
  beatAt[room.id] = now;
  try{ await ntfyPub(LOBBY, {k:'beat', id:room.id, at:now, n:room.members.length}); }catch(e){}
}

/* 어떤 형태로 붙여넣어도 https://xxxx.supabase.co 만 남깁니다.
   (뒤에 /rest/v1, 물음표, 슬래시, 공백이 붙어 와도 정리) */
function normUrl(raw){
  let s = String(raw || '').trim();
  if(!s) return '';
  if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
  try{ return new URL(s).origin; }catch(e){ return ''; }
}

/* 사진 한 장 최대 크기. 무료 저장소가 1GB라 넉넉히 잡아도 수천 장은 들어갑니다 */
const IMG_MAX_BYTES = 3 * 1024 * 1024;
const IMG_MAX_SIDE  = 1280;

/* 사진을 줄입니다. GIF는 움직임이 사라지므로 손대지 않습니다 */
function shrinkImage(file){
  return new Promise((res, rej)=>{
    if(file.type === 'image/gif'){ res(file); return; }
    const fr = new FileReader();
    fr.onerror = ()=> rej(new Error('read'));
    fr.onload = ()=>{
      const im = new Image();
      im.onerror = ()=> rej(new Error('decode'));
      im.onload = ()=>{
        const k = Math.min(1, IMG_MAX_SIDE / Math.max(im.width, im.height));
        const cv = el('canvas');
        cv.width  = Math.round(im.width  * k);
        cv.height = Math.round(im.height * k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        cv.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', 0.82);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* 저장소에 올리고 공개 주소를 돌려줍니다 */
async function uploadImage(file){
  const n = net();
  if(n.mode !== 'sb') throw new Error('no-storage');
  const blob = await shrinkImage(file);
  if(blob.size > IMG_MAX_BYTES) throw new Error('too-big');
  const ext  = blob.type === 'image/gif' ? 'gif' : 'jpg';
  const name = Date.now().toString(36) + Math.random().toString(36).slice(2,8) + '.' + ext;
  const base = n.url.replace(/\/+$/, '');
  const res  = await fetch(base + '/storage/v1/object/chat/' + name, {
    method:'POST',
    headers:{ apikey:n.key, Authorization:'Bearer ' + n.key, 'Content-Type':blob.type },
    body: blob });
  if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0,120));
  return base + '/storage/v1/object/public/chat/' + name;
}

async function sb(path, opt){
  const n = net();
  /* 예전 anon 키(JWT, eyJ...)는 Bearer로도 보내야 하지만
     새 publishable 키(sb_publishable_...)를 Bearer로 보내면 JWT 파싱 오류가 납니다. */
  const headers = { apikey:n.key, 'Content-Type':'application/json',
                    Prefer:'return=representation' };
  if(n.key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + n.key;
  /* 부르는 쪽이 헤더를 얹을 수 있게 합쳐 줍니다. 예전에는 통째로 갈아치워서
     Prefer 하나만 넘겨도 apikey 가 사라져 인증이 깨졌습니다. */
  const o = Object.assign({}, opt || {});
  o.headers = Object.assign(headers, o.headers || {});
  const res = await fetch(n.url.replace(/\/+$/,'') + '/rest/v1/' + path, o);
  const txt = await res.text();
  if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + txt.slice(0,140));
  return txt ? JSON.parse(txt) : null;
}

  const set = new Set();

    if(netFree()){
      const evs = await ntfyPoll(LOBBY);
      const decl = new Map(), beats = new Map();
      evs.forEach(d=>{
        if(d.k === 'room') decl.set(d.id, d);
        else if(d.k === 'beat'){
          const b = beats.get(d.id);
          if(!b || d.at > b.at) beats.set(d.id, d);
        }
      });
      const list = [...decl.values()].map(d=>{
        const b = beats.get(d.id);
        return { id:d.id, title:d.title, desc:d.desc || '', max:d.max, raceId:d.raceId || null,
                 owner:d.owner, members:new Array(b ? b.n : 0).fill(''),
                 createdAt:d.at, lastActivity: b ? Math.max(b.at, d.at) : d.at };
      });
      /* 서버에서 사라진 방도 내 사본에 있으면 24시간 규칙까지 유지됩니다 */
      return mirrorRooms(list).sort((a,b)=>b.lastActivity - a.lastActivity);
    }

    const list = (await sb('rooms?select=*&order=last_activity.desc')).map(fromRow);
    /* 만료된 방은 먼저 본 클라이언트가 지웁니다 */
    const dead = list.filter(r => Date.now() >= deadlineOf(r));
    for(const r of dead){
      const q = 'eq.' + encodeURIComponent(r.id);
      try{ await sb('messages?room_id=' + q, {method:'DELETE'});
           await sb('rooms?id=' + q,       {method:'DELETE'}); }catch(e){}
    }
    return list.filter(r => Date.now() < deadlineOf(r));
  },

  async create(room){
    if(!netOn()){ const rs = pruneRooms(); rs.push(room); DB.set('rooms', rs); return room; }
    if(netFree()){
      await ntfyPub(LOBBY, {k:'room', id:room.id, title:room.title, desc:room.desc,
                            max:room.max, raceId:room.raceId, owner:room.owner, at:room.createdAt});
      return room;
    }
    await sb('rooms', {method:'POST', body:JSON.stringify(toRow(room))});
    return room;
  },

  async patch(id, fields, room){
    if(!netOn()){
      const rs = DB.get('rooms', []), r = rs.find(x=>x.id===id);
      if(r){ Object.assign(r, fields); DB.set('rooms', rs); }
      return;
    }
    if(netFree()){ if(room) await beat(room, true); return; }
    const row = {};
    if('members' in fields)      row.members = fields.members;
    if('lastActivity' in fields) row.last_activity = fields.lastActivity;
    await sb('rooms?id=eq.' + encodeURIComponent(id), {method:'PATCH', body:JSON.stringify(row)});
  },

  async msgs(roomId){
    if(!netOn()) return DB.get('msgs', {})[roomId] || [];
    if(netFree()){
      /* 한 번은 전체를 받아 사본을 채우고, 그 뒤로는 새 것만 받습니다 */
      const fresh = (await ntfyPoll(roomTopic(roomId), fullLoaded[roomId])).map(d=>{
        if(d.k === 'msg')   return {who:d.who, text:d.text, sys:false, at:d.at};
        if(d.k === 'join')  return {sys:true, text:t('chat.joined',  d.who), at:d.at};
        if(d.k === 'leave') return {sys:true, text:t('chat.leftMsg', d.who), at:d.at};
        return null;
      }).filter(Boolean);
      fullLoaded[roomId] = true;
      return mirrorMsgs(roomId, fresh);   /* 12시간 지나 서버에서 빠져도 남습니다 */
    }
    /* 새로 올라온 것만 받습니다. 받은 것은 사본에 합쳐 두어
       서버가 잠들거나 오프라인이어도 이전 대화가 남습니다. */
    const seen = DB.get('mir-' + roomId, []);
    const since = seen.length ? Math.max(...seen.map(m=>m.at)) : 0;
    const rows = await sb('messages?room_id=eq.' + encodeURIComponent(roomId)
                          + (since ? '&at=gt.' + since : '')
                          + '&select=*&order=at.asc&limit=300');
    return mirrorMsgs(roomId, rows.map(m=>({ who:m.who, text:m.text, sys:!!m.sys, at:+m.at, img:m.img || '' })));
  },

  /* kind: 'msg' | 'join' | 'leave' */
  async send(roomId, kind, payload, room){
    const at = Date.now();
    if(!netOn()){
      pushMsgLocal(roomId, kind === 'msg' ? {who:payload.who, text:payload.text, at}
        : {sys:1, at, text:t(kind === 'join' ? 'chat.joined' : 'chat.leftMsg', payload.who)});
      return;
    }
    if(netFree()){
      await ntfyPub(roomTopic(roomId), Object.assign({k:kind, at}, payload));
      if(room) await beat(room, kind !== 'msg');
      return;
    }
    const text = kind === 'msg' ? payload.text
               : t(kind === 'join' ? 'chat.joined' : 'chat.leftMsg', payload.who);
    await sb('messages', {method:'POST', body:JSON.stringify(
      {room_id:roomId, who:kind==='msg' ? payload.who : null, text, sys:kind!=='msg', at,
       img: payload.img || null})});
    if(kind === 'msg') await CHAT.patch(roomId, {lastActivity:at});
  },
};
