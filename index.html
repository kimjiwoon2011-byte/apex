<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX</title>
<style>
/* ═══════════════════════════  디자인 토큰  ═══════════════════════════ */
:root{
  /* 표면 */
  --bg:#eff4ff;
  --surface:#ffffff;
  --surface-2:#f5f8ff;
  --surface-3:#eaf1fe;
  --glass:#f1f6ff;
  --glass-2:#e7f0ff;
  --line:#e1eafa;
  --line-2:#cfdef7;
  /* 글자 */
  --tx:#061225;
  --tx-2:#4a6488;
  --tx-3:#8ba2c6;
  /* 브랜드 */
  --br:#1257e8;
  --br-2:#4d92ff;
  --br-3:#96c2ff;
  --br-ink:#ffffff;
  --br-tint:#e6efff;
  --br-tint-2:#d3e4ff;
  /* 오로라 */
  --au1:rgba(77,146,255,.60);
  --au2:rgba(18,87,232,.42);
  --au3:rgba(150,194,255,.55);
  /* 그림자 */
  --sh1:0 1px 2px rgba(9,30,66,.05), 0 2px 8px rgba(9,30,66,.05);
  --sh2:0 4px 14px rgba(9,30,66,.08), 0 14px 34px rgba(9,30,66,.07);
  --sh3:0 24px 64px rgba(9,30,66,.24);
  --sh-br:0 6px 20px rgba(18,87,232,.30);
  /* 라운드 */
  --r1:10px; --r2:14px; --r3:18px; --r4:24px; --r5:30px;
  --ease:cubic-bezier(.32,.72,0,1);
}
:root[data-theme="dark"]{
  --bg:#030711;
  --surface:#0b1424;
  --surface-2:#111c31;
  --surface-3:#17253f;
  --glass:#070f1d;
  --glass-2:#0c1729;
  --line:#1b2b47;
  --line-2:#27395a;
  --tx:#edf3ff;
  --tx-2:#9db1d1;
  --tx-3:#657da3;
  --br:#62a8ff;
  --br-2:#8cc0ff;
  --br-3:#2b5da8;
  --br-ink:#03101f;
  --br-tint:#122442;
  --br-tint-2:#1a3157;
  --au1:rgba(40,116,240,.50);
  --au2:rgba(12,58,150,.55);
  --au3:rgba(98,168,255,.30);
  --sh1:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 4px 14px rgba(0,0,0,.45), 0 14px 34px rgba(0,0,0,.35);
  --sh3:0 24px 64px rgba(0,0,0,.7);
  --sh-br:0 6px 20px rgba(30,90,200,.45);
}

/* ── BOX BOX 참고: 숫자·마이크로 라벨용 기술적 서체 스택 ── */
:root{
  --mono:ui-monospace,'SF Mono','JetBrains Mono','Roboto Mono','DM Mono',Menlo,monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0;min-height:100dvh;overflow-x:hidden;
  font-family:'Pretendard','SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',
              'Apple SD Gothic Neo','Hiragino Sans','Noto Sans JP','Malgun Gothic',system-ui,sans-serif;
  font-feature-settings:'cv01','ss01';
  background:var(--bg);color:var(--tx);
  letter-spacing:-.011em;
  transition:background .4s var(--ease),color .4s var(--ease);
}
button,input,textarea,select{font-family:inherit;letter-spacing:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}

/* ═══════════════════════  숨쉬는 파란 배경  ═══════════════════════ */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(64px);display:block}
.aurora .a1{width:80vmax;height:80vmax;left:-30vmax;top:-38vmax;
  background:radial-gradient(circle,var(--au1) 0%,transparent 66%);animation:breathe 18s ease-in-out infinite}
.aurora .a2{width:64vmax;height:64vmax;right:-24vmax;bottom:-22vmax;
  background:radial-gradient(circle,var(--au2) 0%,transparent 66%);animation:breathe 25s ease-in-out infinite reverse}
.aurora .a3{width:50vmax;height:50vmax;left:14vmax;bottom:6vmax;
  background:radial-gradient(circle,var(--au3) 0%,transparent 68%);animation:drift 31s ease-in-out infinite}
@keyframes breathe{
  0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.40}
  50%    {transform:translate3d(7vmax,5vmax,0) scale(1.26);opacity:.92}
}
@keyframes drift{
  0%,100%{transform:translate3d(0,0,0) scale(.9);opacity:.28}
  35%    {transform:translate3d(-9vmax,-6vmax,0) scale(1.16);opacity:.68}
  70%    {transform:translate3d(6vmax,-3vmax,0) scale(1.04);opacity:.42}
}
.flow{
  background-image:linear-gradient(105deg,var(--br) 0%,var(--br-2) 26%,#a9cdff 50%,var(--br-2) 74%,var(--br) 100%);
  background-size:300% 100%;animation:slide 15s linear infinite;
}
@keyframes slide{to{background-position:300% 50%}}
/* 동작 최소화를 켠 기기에서는 움직임을 모두 멈춥니다.
   어지럼증·멀미가 있는 분들이 켜는 설정이라 배경뿐 아니라 등장 효과까지 끕니다. */
@media (prefers-reduced-motion:reduce){
  .aurora i,.flow{animation:none}
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important
  }
}

/* ═══════════════════════════  레이아웃  ═══════════════════════════ */
.app{max-width:540px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}

/* ── 헤더: 유리질 + 큰 타이틀 ── */
/* 배경 오로라가 계속 움직이므로 backdrop-filter는 쓰지 않습니다.
   (움직이는 blur 레이어를 실시간 샘플링하면 합성 잔상이 생겨 화면이 겹쳐 보임) */
.hdr{
  position:sticky;top:0;z-index:40;
  padding:calc(env(safe-area-inset-top) + 10px) 20px 0;
  background:linear-gradient(175deg,var(--glass-2),var(--glass));
  border-bottom:1px solid transparent;
  transition:border-color .3s;
}
.hdr::after{
  content:'';position:absolute;left:0;right:0;top:100%;height:12px;pointer-events:none;
  background:linear-gradient(var(--glass),transparent)
}
.hdr.stuck{border-bottom-color:var(--line)}
.hdr-bar{display:flex;align-items:center;height:38px}
.hdr-bar .logo{margin-right:auto}
.icon-btn[disabled]{opacity:.4}
.icon-btn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;letter-spacing:.02em}
.logo-mark{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(150deg,var(--br),var(--br-2));box-shadow:var(--sh-br)
}
.logo-mark svg{width:17px;height:17px;fill:currentColor}
.icon-btn{
  margin-left:8px;width:36px;height:36px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--tx-2);display:grid;place-items:center;cursor:pointer;
  transition:transform .18s var(--ease),background .2s
}
.icon-btn:active{transform:scale(.9);background:var(--surface-3)}
.icon-btn svg{width:18px;height:18px}
/* 축소는 font-size(레이아웃 재계산) 대신 transform으로 — 스크롤 중 리플로우가 없습니다 */
.hdr-title{
  margin:2px 0 12px;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15;
  transform-origin:left top;
  transition:transform .28s var(--ease),margin-bottom .28s var(--ease)
}
.hdr.stuck .hdr-title{transform:scale(.63);margin-bottom:-1px}

main{padding:14px 16px 0}
.panel{display:none}
.panel.active{display:block;animation:enter .34s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.sec{font-size:13px;font-weight:700;color:var(--tx-2);letter-spacing:.01em;
  margin:24px 4px 10px;display:flex;align-items:center;gap:8px;text-transform:none}
.sec:first-child{margin-top:6px}
.sec::before{content:'';width:3px;height:13px;border-radius:2px;flex:0 0 3px;
  background:linear-gradient(180deg,var(--br),var(--br-2))}

/* 인라인 아이콘 — 이모지 대신 씁니다 (OS·폰트에 따라 모양이 달라지지 않도록) */
.ic{width:1em;height:1em;flex:0 0 auto;vertical-align:-.13em;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
/* 국가 코드 배지 — 국기 이모지 대체 */
.cc{display:inline-block;font-size:9px;font-weight:900;letter-spacing:.06em;
  padding:2px 5px;border-radius:5px;background:var(--surface-3);color:var(--tx-3);
  vertical-align:.1em;margin-right:6px;line-height:1.35}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:16px;box-shadow:var(--sh1)}
.muted{color:var(--tx-2);font-size:12.5px;line-height:1.6}
.note{font-size:11.5px;color:var(--tx-2);line-height:1.6;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px;margin-top:12px}
.note b{color:var(--tx)}

/* ── 하단 탭바 ── */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:540px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  padding:8px 6px calc(env(safe-area-inset-bottom) + 10px);
  background:var(--glass);border-top:1px solid var(--line)
}
.tabs::before{
  content:'';position:absolute;left:0;right:0;bottom:100%;height:14px;pointer-events:none;
  background:linear-gradient(transparent,var(--glass))
}
.tabs button{
  border:0;background:none;cursor:pointer;color:var(--tx-3);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;
  font-size:10.5px;font-weight:700;border-radius:var(--r2);
  transition:color .22s var(--ease)
}
.tabs button .ib{
  width:38px;height:26px;border-radius:999px;display:grid;place-items:center;
  transition:background .26s var(--ease),transform .26s var(--ease)
}
.tabs button svg{width:21px;height:21px;stroke-width:2}
.tabs button.on{color:var(--br)}
.tabs button.on .ib{background:var(--br-tint);transform:translateY(-2px);
  box-shadow:0 4px 12px color-mix(in srgb,var(--br) 26%,transparent)}
.tabs button.on svg{stroke-width:2.4}
.tabs button:active .ib{transform:scale(.88)}

/* ── 칩 ── */
/* 시리즈가 8개로 늘면서 가로 스크롤로는 뒤쪽이 잘려 보이지 않았습니다.
   줄바꿈으로 바꿔 한 화면에 전부 나오게 합니다 */
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:2px 0 10px}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--tx-2);
  border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:7px;box-shadow:var(--sh1);
  transition:transform .18s var(--ease),background .22s,color .22s,border-color .22s
}
.chip:active{transform:scale(.94)}
.chip .sdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.chip.on{background:var(--cc,var(--br));color:#fff;border-color:transparent;
  box-shadow:0 4px 16px color-mix(in srgb,var(--cc,var(--br)) 48%,transparent)}
.chip.on .sdot{background:#fff!important;box-shadow:0 0 0 3px rgba(255,255,255,.28)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;
  padding:4px 8px;border-radius:7px;background:var(--br-tint);color:var(--br);letter-spacing:.03em}
.tag.solid{color:#fff}
.tag.grey{background:var(--surface-3);color:var(--tx-2)}
.tag.live{background:#e5162b;color:#fff}
.tag.live::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;animation:blip 1.2s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}

/* ═══════════════════════════  소식  ═══════════════════════════ */
.nmeta{display:flex;align-items:center;gap:9px;margin:2px 2px 12px;font-size:11.5px;color:var(--tx-3)}
/* 보기 전환과 마지막 갱신 시각을 한 줄에 둡니다 */
.nbar{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.nbar .pills{margin:0;flex:1;max-width:220px}
.nbar b{font-size:11.5px;color:var(--tx-3);font-weight:700;white-space:nowrap}
.nmeta b{color:var(--tx-2);font-weight:700}
.refresh{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--br);
  font-size:11.5px;font-weight:800;border-radius:999px;padding:7px 13px;cursor:pointer;
  box-shadow:var(--sh1);transition:transform .18s var(--ease)}
.refresh:active{transform:scale(.94)}
.refresh:disabled{opacity:.45}

.nitem{display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r3);padding:13px;margin-bottom:10px;
  box-shadow:var(--sh1);animation:pop .4s var(--ease) backwards;
  transition:transform .2s var(--ease),border-color .2s}
.nitem:active{transform:scale(.985)}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.nitem .th{width:94px;height:71px;border-radius:var(--r2);object-fit:cover;flex:0 0 94px;
  background:var(--surface-3);border:1px solid var(--line)}
.nitem .nb{flex:1;min-width:0}
/* 제목은 이제 링크가 아니라 앱 안에서 기사를 여는 버튼입니다 */
.nitem .hl{text-decoration:none;color:inherit;display:block;width:100%;text-align:left;
  border:0;background:none;padding:0;cursor:pointer;font:inherit}
.nitem .hl:active{opacity:.55}

/* ── 경기 영상 (앱 안에서 재생) ── */
.vidwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r2);
  overflow:hidden;background:#000;box-shadow:var(--sh1)}
.vidwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.skel.vid{aspect-ratio:16/9;height:auto;border-radius:var(--r2)}
.vidout{display:block;text-align:center;text-decoration:none;line-height:1.2;margin-top:0}

/* ── 기사 읽기 ── */
.artimg{width:100%;border-radius:var(--r2);margin-bottom:14px;display:block;
  aspect-ratio:16/9;object-fit:cover}
.artmeta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx-3);margin-bottom:9px}
.arttitle{margin:0 0 12px;font-size:19px;line-height:1.36;font-weight:800;letter-spacing:-.015em}
.artlead{margin:0 0 6px;font-size:14px;line-height:1.72;color:var(--tx-2)}
.deep{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--br);
      border-radius:var(--r2);padding:13px 14px;margin:0 0 12px}
.deep.wait{color:var(--tx-3);font-size:12.5px;border-left-color:var(--line)}
.deep .what{margin:0;font-size:14.5px;line-height:1.75;font-weight:600;color:var(--tx-1)}
.deep .why{margin:9px 0 0;font-size:13px;line-height:1.7;color:var(--tx-2)}
.deep .why b{color:var(--br);font-weight:800}
.deep .by{display:block;margin-top:10px;font-size:10.5px;color:var(--tx-3)}
.terms{display:grid;gap:9px}
/* 순차 등장 — 한꺼번에 튀어나오지 않게 앞의 여덟 개만 조금씩 늦춥니다.
   뒤쪽은 어차피 화면 밖이라 지연을 주지 않습니다. */
.nitem:nth-child(1),.nlead:nth-child(1),.cardn:nth-child(1){animation-delay:0ms}
.nitem:nth-child(2),.nlead:nth-child(2),.cardn:nth-child(2){animation-delay:40ms}
.nitem:nth-child(3),.nlead:nth-child(3),.cardn:nth-child(3){animation-delay:80ms}
.nitem:nth-child(4),.nlead:nth-child(4),.cardn:nth-child(4){animation-delay:120ms}
.nitem:nth-child(5),.nlead:nth-child(5),.cardn:nth-child(5){animation-delay:160ms}
.nitem:nth-child(6),.nlead:nth-child(6),.cardn:nth-child(6){animation-delay:200ms}
.nitem:nth-child(7),.nlead:nth-child(7),.cardn:nth-child(7){animation-delay:240ms}
.nitem:nth-child(8),.nlead:nth-child(8),.cardn:nth-child(8){animation-delay:280ms}

/* 카운트다운 초 — 1초마다 다시 그려지므로 그때마다 한 번 튑니다.
   네 칸 모두 튀면 산만해서 초 칸에만 답니다. */
@keyframes tick{
  0%{transform:translateY(-3px);opacity:.45}
  60%{transform:translateY(0);opacity:1}
  100%{transform:none}
}
.cdn b.tick{animation:tick .42s var(--ease)}

/* 카드를 누를 때 살짝 눌리는 느낌 — 목록 항목과 같은 정도로 */
.deck{scroll-behavior:smooth}
/* 다음 경기 캘린더로 들어가는 카드. 미리보기를 같이 보여 줘야
   무엇을 만드는 기능인지 한눈에 압니다 */
.calcta{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);
  padding:12px 14px;margin:0 0 12px;box-shadow:var(--sh2);color:inherit;
  transition:transform .18s var(--ease),box-shadow .22s;animation:pop .45s var(--ease) backwards}
.calcta:active{transform:scale(.985)}
.calcta .cc-prev{flex:0 0 46px;width:46px;height:74px;border-radius:9px;overflow:hidden;
  background:var(--surface-3);box-shadow:var(--sh1)}
.calcta .cc-prev svg{width:100%;height:100%;display:block}
.calcta .cc-tx{flex:1;min-width:0}
.calcta .cc-tx b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.015em}
.calcta .cc-tx small{display:block;margin-top:3px;font-size:11.5px;line-height:1.5;color:var(--tx-2)}
.calcta .cc-go{flex:0 0 auto;width:8px;height:8px;border-right:2px solid var(--tx-3);
  border-bottom:2px solid var(--tx-3);transform:rotate(-45deg);margin-right:4px}
/* 기사 댓글 */
.cmt{border-bottom:1px solid var(--line);padding:11px 2px}
.cmt:last-of-type{border-bottom:0}
.cmt b{font-size:12.5px;font-weight:800}
.cmt .tm{font-size:10px;color:var(--tx-3);margin-left:7px}
.cmt p{margin:5px 0 0;font-size:13px;line-height:1.55;color:var(--tx-2);word-break:break-word}
#cmtBox .cin{border-top:1px solid var(--line);margin-top:6px}
#cmtBox .cin button{width:56px}
.term{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px}
.term b{display:block;font-size:12.5px;font-weight:800;color:var(--br);margin-bottom:4px}
.term span{display:block;font-size:12px;line-height:1.6;color:var(--tx-2)}
.artlink{display:block;text-align:center;text-decoration:none;line-height:1.2}
.nitem h3{margin:0 0 6px;font-size:15.5px;line-height:1.42;font-weight:700;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nitem p{margin:0 0 8px;font-size:11.5px;line-height:1.5;color:var(--tx-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nfoot{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--tx-3);flex-wrap:nowrap}
.nfoot .pill{background:var(--surface-3);border-radius:6px;padding:3px 7px;font-weight:800;flex:0 0 auto}
.nfoot .src{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nfoot .tr{margin-left:auto;color:var(--br);font-weight:800;text-decoration:none;flex:0 0 auto;
  background:var(--br-tint);border-radius:7px;padding:4px 8px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px}
.nfoot .tr .ic{width:11px;height:11px;vertical-align:0}
/* 맨 위 기사 — 사진을 크게 깔고 제목을 얹습니다 */
.nlead{position:relative;display:block;width:100%;padding:0;text-align:left;color:inherit;
  border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;margin-bottom:14px;
  background:var(--surface);box-shadow:var(--sh2);cursor:pointer;
  animation:pop .45s var(--ease) backwards;transition:transform .2s var(--ease)}
.nlead:active{transform:scale(.985)}
.nlead>img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.nlead .ov{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;
  background:linear-gradient(0deg,rgba(3,7,15,.96) 8%,rgba(3,7,15,.55) 62%,transparent)}
.nlead h3{margin:0 0 8px;font-size:20px;line-height:1.35;font-weight:800;color:#fff;
  letter-spacing:-.025em;text-shadow:0 1px 8px rgba(0,0,0,.5);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nlead .nfoot{color:rgba(255,255,255,.74)}
.nlead .nfoot .pill{background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}

.skel{height:92px;border-radius:var(--r3);margin-bottom:10px;
  background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);
  background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

/* ── 카드뉴스 (좌우로 넘기는 캐러셀) ── */
.deck{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x proximity;scroll-padding-left:16px;overscroll-behavior-x:contain;
  padding:2px 16px 4px;margin:0 -16px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.cardn{flex:0 0 calc(100% - 34px);scroll-snap-align:start;position:relative;
  background-image:linear-gradient(150deg,var(--cc,#2b3a55),#0a0f1a 78%);
  aspect-ratio:4/5;border-radius:var(--r4);overflow:hidden;border:1px solid var(--line);
  background:var(--surface-3);box-shadow:var(--sh2);cursor:pointer;padding:0;text-align:left;
  color:inherit;transition:transform .2s var(--ease);
  animation:pop .5s var(--ease) backwards}
.cardn:active{transform:scale(.985)}
.cardn>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:50% 28%}
.cardn .sc{position:absolute;inset:0;background:
  linear-gradient(0deg,rgba(3,7,15,.96) 22%,rgba(3,7,15,.45) 58%,rgba(3,7,15,.30))}
/* 안전 여백 — 인스타 4:5 기준 상하 6%, 좌우 5.5% */
.cardn .in{position:absolute;inset:0;padding:6% 5.5%;display:flex;flex-direction:column;color:#fff}
.cardn .hd{display:flex;align-items:center;gap:7px}
.cardn .no{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;
  color:rgba(255,255,255,.72)}
.cardn .bd{margin-top:auto}
.cardn h3{margin:0 0 10px;font-size:27px;line-height:1.24;font-weight:800;letter-spacing:-.035em;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cardn p{margin:0 0 12px;font-size:12.5px;line-height:1.55;color:rgba(255,255,255,.8);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cardn .ft{display:flex;align-items:center;gap:8px;font-size:10.5px;
  color:rgba(255,255,255,.7);font-weight:600}
.cardn .ft .pill{background:rgba(255,255,255,.18);border-radius:6px;padding:3px 7px;font-weight:800}
.cardn .ft .cn{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:800}
.cardn .ft .cn .ic{width:12px;height:12px;vertical-align:0}

/* 카드뉴스 세 단 — 훅(작게) · 핵심(크게) · 설명(작게).
   릴스 카드처럼 지나가며 봐도 무슨 일인지 알아보게 만듭니다 */
.cardn .hook{font-size:15px;font-weight:900;color:#fff;letter-spacing:-.025em;
  margin:0 0 5px;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.cardn .punch{font-size:46px;font-weight:900;line-height:1.2;letter-spacing:-.055em;
  color:#5aa9ff;margin:0 0 10px;
  /* 시스템 글꼴은 900이 끝이라, 획을 덧그려 더 굵게 보이게 합니다.
     다만 한글은 획을 너무 올리면 ㅁ·ㅇ 속이 메워져 뭉갭니다. 1.6px 까지가 한계입니다 */
  -webkit-text-stroke:1.6px #5aa9ff;paint-order:stroke fill;
  text-shadow:0 2px 18px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.7);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* 제목을 통째로 실을 때 — 파란색·900·획 덧그리기는 그대로 두고 크기만 줄여
   세 줄까지 보이게 합니다 */
.cardn .punch.full{font-size:26px;line-height:1.22;letter-spacing:-.04em;
  -webkit-text-stroke:.9px #5aa9ff;-webkit-line-clamp:3;margin-bottom:8px}
.cardn .line{font-size:13px;font-weight:600;line-height:1.5;color:rgba(255,255,255,.9);
  margin:0 0 12px;text-shadow:0 1px 6px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 글자가 많아 아래쪽 그늘을 조금 더 올립니다 */
.cardn .sc{background:linear-gradient(0deg,rgba(3,7,15,.97) 30%,rgba(3,7,15,.55) 62%,rgba(3,7,15,.28))}

/* 표지 — 아래 1/3을 비워 두는 인스타 관행을 따릅니다 */
.cardn.cover{background:linear-gradient(160deg,var(--cc),color-mix(in srgb,var(--cc) 30%,#05080f))}
.cardn.cover .in{justify-content:flex-start}
.cardn.cover .big{font-size:34px;font-weight:900;letter-spacing:-.045em;line-height:1.1;margin:18px 0 12px}
.cardn.cover .lead{font-size:13.5px;line-height:1.65;color:rgba(255,255,255,.88);max-width:90%}
.cardn.cover .swipe{position:absolute;left:5.5%;bottom:6%;font-size:12px;font-weight:800;
  color:rgba(255,255,255,.9);display:flex;align-items:center;gap:7px}
.cardn.cover .swipe .ar{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

/* 손가락으로 안 넘어갈 때를 위한 화살표 */
.deckbar{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 2px}
.deckbar button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--tx-2);display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--sh1);flex:0 0 34px;transition:transform .18s var(--ease),background .2s}
.deckbar button:active{transform:scale(.88);background:var(--surface-3)}
.deckbar button:disabled{opacity:.3}
.deckbar button svg{width:17px;height:17px}
.deckbar button.prev svg{transform:rotate(180deg)}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:0}
.dots button{width:6px;height:6px;border-radius:50%;background:var(--line-2);border:0;padding:0;
  display:block;cursor:pointer;transition:background .25s,width .25s}
.dots button.on{background:var(--br);width:18px;border-radius:3px}

/* ═══════════════════════════  캘린더  ═══════════════════════════ */
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhd strong{font-size:17px;font-weight:800;letter-spacing:-.02em}
.calnav{border:1px solid var(--line);background:var(--surface-2);color:var(--tx);
  width:34px;height:34px;border-radius:var(--r1);cursor:pointer;font-size:15px;line-height:1;
  transition:transform .18s var(--ease),background .2s}
.calnav:active{transform:scale(.88);background:var(--surface-3)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cgrid .dow{text-align:center;font-size:10.5px;font-weight:800;color:var(--tx-3);padding-bottom:8px}
.cell{min-height:58px;border:0;background:none;border-radius:var(--r2);padding:6px 2px 5px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;
  font-weight:600;color:var(--tx);cursor:default;position:relative;overflow:hidden;
  transition:background .2s,color .2s,transform .18s var(--ease)}
.cell .d{font-size:12.5px;line-height:1.15;margin-bottom:2px}
.cell .cl{font-size:8px;font-weight:800;line-height:1.3;letter-spacing:-.01em;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cl.more{color:var(--tx-3)}
.cell.pad{opacity:.2}
.cell.sun .d{color:#e0566a}
.cell.has{cursor:pointer;background:var(--surface-2)}
.cell.has:active{transform:scale(.92)}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--br)}
.cell.today .d{font-weight:800;color:var(--br)}
.cell.sel{background:var(--br);color:var(--br-ink);box-shadow:var(--sh-br)}
.cell.sel .d,.cell.sel.sun .d{color:var(--br-ink)}
.cell.sel .cl{color:var(--br-ink)!important;opacity:.9}

/* ── 경기 카드 ── */
.rcard{
  width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r3);padding:11px;margin-bottom:9px;cursor:pointer;color:var(--tx);
  display:flex;align-items:stretch;gap:12px;box-shadow:var(--sh1);
  transition:transform .18s var(--ease),box-shadow .22s;animation:pop .4s var(--ease) backwards}
.rcard:active{transform:scale(.98);box-shadow:var(--sh1)}
.rdate{
  flex:0 0 52px;border-radius:var(--r2);padding:8px 4px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;gap:1px;position:relative;overflow:hidden}
.rdate::before{content:'';position:absolute;inset:0;opacity:.13}
.rdate>*{position:relative}
.rdate .mo{font-size:9.5px;font-weight:800;letter-spacing:.04em;opacity:.85}
.rdate .dd{font-size:20px;font-weight:800;line-height:1.05;letter-spacing:-.03em}
.rdate .wd{font-size:9.5px;font-weight:700;opacity:.7}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.rtop{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--tx-3);letter-spacing:.02em}
.rtop .sdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.rname{font-size:14px;font-weight:700;letter-spacing:-.015em;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rsub{font-size:11px;color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rstat{flex:0 0 auto;align-self:center;text-align:right}
.rstat .dd{font-size:13px;font-weight:800;color:var(--br);letter-spacing:-.02em}
.rstat .tm{font-size:10.5px;color:var(--tx-3);margin-top:2px}

/* ═══════════════════════════  시트  ═══════════════════════════ */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(3,10,26,.62);
  display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex;animation:fadein .24s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:540px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:var(--r5) var(--r5) 0 0;
  border:1px solid var(--line);border-bottom:0;
  padding:8px 20px calc(env(safe-area-inset-bottom) + 24px);
  box-shadow:var(--sh3);animation:rise .42s var(--ease)}
@keyframes rise{from{transform:translateY(80px)}to{transform:none}}
.grab{width:36px;height:4px;border-radius:3px;background:var(--line-2);margin:6px auto 16px}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.3}

/* 중계 앱 아이콘 */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px;margin-top:12px}
.watch{text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .18s var(--ease)}
.watch:active{transform:scale(.92)}
.watch .ico{
  width:58px;height:58px;border-radius:17px;display:grid;place-items:center;
  font-weight:900;font-size:15px;color:#fff;letter-spacing:-.04em;line-height:1.02;text-align:center;
  position:relative;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.22)}
.watch .ico::after{content:'';position:absolute;inset:0;
  background:linear-gradient(158deg,rgba(255,255,255,.32),transparent 52%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);border-radius:inherit}
.watch .nm{font-size:11.5px;font-weight:700;text-align:center;line-height:1.3}
.watch .sb{font-size:9.5px;color:var(--tx-3);text-align:center;line-height:1.3}

.podium{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.pod{display:flex;align-items:center;gap:11px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px;font-size:13px;font-weight:600}
.pod b{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;color:#08172b;flex:0 0 23px;font-weight:900}
/* 순위 색은 위치(nth-child)가 아니라 실제 순위로 정합니다 —
   드라이버 상세처럼 목록이 3개를 넘는 곳에서도 맞아야 하므로 */
.pod b.p1{background:linear-gradient(145deg,#ffdc63,#f0b400)}
.pod b.p2{background:linear-gradient(145deg,#e3e9f2,#b9c4d4)}
.pod b.p3{background:linear-gradient(145deg,#eab77a,#c98442)}

.stars{display:flex;gap:8px;margin:12px 0}
.stars button{border:0;background:none;cursor:pointer;padding:0;line-height:0;
  color:var(--line-2);transition:transform .14s var(--ease),color .18s}
.stars button svg{width:32px;height:32px;fill:currentColor;stroke:none}
.stars button.lit{color:#ffc531}
.stars button:active{transform:scale(1.22)}
.rstars{display:flex;gap:2px;color:#ffc531}
.rstars svg{width:13px;height:13px;fill:currentColor;stroke:none}
.rstars svg.off{color:var(--line-2)}

textarea,input[type=text],input[type=number],input[type=password],select{
  width:100%;font-size:14px;color:var(--tx);background:var(--surface-2);
  border:1.5px solid var(--line);border-radius:var(--r2);padding:12px 14px;outline:none;
  transition:border-color .22s,background .22s}
textarea:focus,input:focus,select:focus{border-color:var(--br);background:var(--surface)}
textarea{resize:vertical;min-height:78px}
.fl{display:block;font-size:11.5px;font-weight:800;color:var(--tx-3);margin:14px 0 7px;letter-spacing:.02em}

.btn{width:100%;border:0;border-radius:var(--r2);padding:14px;font-size:14.5px;font-weight:800;
  cursor:pointer;color:#fff;margin-top:14px;box-shadow:var(--sh-br);letter-spacing:-.01em;
  transition:transform .18s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface-2);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:#e03050;box-shadow:none}
.btn.sm{padding:11px;font-size:13px;margin-top:10px}
.btn:disabled{opacity:.4;box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── 주말 세션 타임테이블 ── */
.ttbl{padding:4px 0;margin-top:12px;overflow:hidden}
.tday{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx-3);padding:13px 16px 7px}
.ttbl>.tday:first-child{padding-top:6px}
.ses{display:flex;align-items:center;gap:11px;padding:11px 16px}
.ses+.ses{box-shadow:inset 0 1px 0 var(--line)}
.ses .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:0 0 7px}
.ses .sn{flex:1;min-width:0;font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ses .st{font-size:13.5px;font-weight:700;color:var(--tx-2);flex:0 0 auto}
.ses .sd{font-size:9.5px;font-weight:800;color:var(--tx-3);flex:0 0 auto;
  min-width:46px;text-align:right;letter-spacing:.02em}
.ses.key .sn{font-weight:800}
.ses.past{opacity:.42}
.ses.next{background:var(--surface-2)}
.ses.next .dot{background:var(--acc,var(--br));
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc,var(--br)) 20%,transparent)}
.ses.next .sn,.ses.next .st{color:var(--tx)}
.ses.next .sd{color:var(--acc,var(--br))}
.ses.now{background:var(--surface-2)}
.ses.now .dot{background:#e5162b;animation:blip 1.2s ease-in-out infinite;box-shadow:none}
.ses.now .sd{color:#e5162b}

/* ═══════════════════════════  단톡방  ═══════════════════════════ */
.room{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r3);padding:15px;margin-bottom:10px;cursor:pointer;color:var(--tx);
  box-shadow:var(--sh1);transition:transform .18s var(--ease);animation:pop .4s var(--ease) backwards}
.room:active{transform:scale(.98)}
.rt{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;letter-spacing:-.02em}
.rt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd{font-size:12.5px;color:var(--tx-2);margin:7px 0 11px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rf{display:flex;align-items:center;gap:11px;font-size:10.5px;color:var(--tx-3);flex-wrap:wrap;font-weight:600}
.rf span{display:inline-flex;align-items:center;gap:4px}
.rf .ic{width:12px;height:12px;vertical-align:0}
.rf .cnt{font-weight:800;color:var(--br)}
.rf .ttl{color:#e0566a;font-weight:800}

.fab{position:fixed;right:calc(50% - 270px + 18px);bottom:calc(env(safe-area-inset-bottom) + 90px);
  z-index:60;width:56px;height:56px;border-radius:19px;border:0;cursor:pointer;color:#fff;
  display:grid;place-items:center;box-shadow:0 12px 30px rgba(18,87,232,.45);
  transition:transform .22s var(--ease)}
.fab svg{width:24px;height:24px;stroke-width:2.6}
.fab:active{transform:scale(.88) rotate(90deg)}
@media (max-width:576px){.fab{right:18px}}

.cwrap{display:flex;flex-direction:column;height:min(58dvh,460px);margin-top:12px}
.clog{flex:1;overflow-y:auto;padding:4px 2px 10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 13px;font-size:13.5px;line-height:1.48;word-break:break-word;
  animation:pop .3s var(--ease) backwards}
.msg .who{font-size:10.5px;font-weight:800;opacity:.7;display:block;margin-bottom:4px}
.msg.other{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);
  border-radius:16px 16px 16px 5px}
.msg.me{align-self:flex-end;color:#fff;border-radius:16px 16px 5px 16px;
  background:linear-gradient(140deg,var(--br),var(--br-2))}
.msg .tm{font-size:9.5px;opacity:.62;margin-top:5px;display:block;text-align:right}
.msg.sys{align-self:center;background:var(--surface-3);color:var(--tx-3);font-size:10.5px;
  max-width:100%;text-align:center;padding:5px 12px;border-radius:999px;font-weight:700}
.cin{display:flex;gap:9px;padding-top:11px;border-top:1px solid var(--line);align-items:center}
.cin .pick{flex:0 0 40px;width:40px;height:40px;border-radius:var(--r2);cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);color:var(--tx-2);display:grid;place-items:center;
  transition:transform .18s var(--ease),background .2s}
.cin .pick:active{transform:scale(.9);background:var(--surface-3)}
.cin .pick:disabled{opacity:.45}
.cin .pick svg{width:19px;height:19px}
/* 대화 속 사진 */
.msg .mimg{display:block;max-width:100%;width:210px;border-radius:11px;margin:2px 0 6px;
  background:var(--surface-3)}
.cin input{flex:1}
.cin button{border:0;border-radius:var(--r2);width:52px;color:#fff;font-weight:800;cursor:pointer;
  font-size:12.5px;transition:transform .18s var(--ease)}
.cin button:active{transform:scale(.9)}

/* ═══════════════════════════  알림  ═══════════════════════════ */
.cd{border-radius:var(--r4);padding:22px 20px;color:#fff;box-shadow:var(--sh2);position:relative;
  overflow:hidden;cursor:pointer;transition:transform .2s var(--ease)}
.cd:active{transform:scale(.985)}
.cd .cc{background:rgba(255,255,255,.24);color:#fff}
.cd .lbl{color:rgba(255,255,255,.94)}   /* 파란 카드 위에서는 회색 라벨이 묻힙니다 */
.favcard .np .lbl{color:var(--tx-3)}
.cd .lbl{font-size:11px;font-weight:800;opacity:.92;letter-spacing:.06em;text-transform:uppercase}
.cd .nm{font-size:22px;font-weight:800;margin:8px 0 4px;line-height:1.22;letter-spacing:-.03em}
.cd .ci{font-size:11.5px;opacity:.9;font-weight:600}
.cdn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.cdn div{background:rgba(255,255,255,.19);border-radius:var(--r2);padding:11px 4px 9px;text-align:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.20)}
.cdn b{display:block;font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.05em;
  line-height:1.05}
.cdn span{display:block;margin-top:4px;font-family:var(--mono);font-size:8.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;opacity:.85}

.trow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tx{flex:1;min-width:0}
/* 직계 b만 — 설명문 안에서 강조로 쓰는 <b>까지 블록이 되면 안 됩니다 */
.trow .tx>b{display:block;font-size:14px;font-weight:800;letter-spacing:-.02em}
.trow .tx small{font-size:11.5px;color:var(--tx-3);line-height:1.5}
.trow .tx small b{color:var(--tx-2)}
.sw{width:47px;height:28px;border-radius:99px;border:0;background:var(--line-2);position:relative;
  cursor:pointer;flex:0 0 47px;transition:background .26s var(--ease)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:transform .26s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.28)}
.sw.on{background:var(--br)}
.sw.on::after{transform:translateX(19px)}

.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat3 div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:15px 8px;text-align:center;box-shadow:var(--sh1)}
.stat3 b{display:block;font-size:23px;font-weight:800;color:var(--br);letter-spacing:-.04em}
.stat3 span{font-size:10.5px;color:var(--tx-3);font-weight:700}

.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);
  padding:14px;margin-bottom:9px;box-shadow:var(--sh1)}
.rev .rh{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:6px}
.rev p{margin:7px 0 0;font-size:12.5px;color:var(--tx-2);line-height:1.55}

.empty{text-align:center;padding:52px 24px;color:var(--tx-3);font-size:13px;line-height:1.7;
  background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r4)}
.empty svg{width:42px;height:42px;margin:0 auto 14px;display:block;opacity:.42;
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty b{color:var(--tx-2)}

.seg{display:grid;gap:9px;margin-top:8px}
.seg.c2{grid-template-columns:1fr 1fr}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);color:var(--tx);
  border-radius:var(--r2);padding:14px 8px;cursor:pointer;font-size:13px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .18s var(--ease),border-color .22s,background .22s,color .22s}
.seg button:active{transform:scale(.95)}
.seg button .p{width:100%;height:26px;border-radius:8px;border:1px solid var(--line)}
.seg button.on{border-color:var(--br);background:var(--br-tint);color:var(--br)}

.toast{position:fixed;left:50%;bottom:112px;z-index:99;transform:translateX(-50%) translateY(10px);
  background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:999px;
  font-size:13px;font-weight:800;box-shadow:var(--sh3);opacity:0;pointer-events:none;
  transition:opacity .28s var(--ease),transform .28s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════════════════════
   BOX BOX 참고 컴포넌트
   ══════════════════════════════════════════════════════════════ */

/* 마이크로 라벨 — 대문자, 넓은 자간, 아주 작게 */
.lbl{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx-3);line-height:1.3}

/* 알약형 세그먼트 컨트롤 */
.pills{display:inline-flex;gap:3px;padding:3px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);margin:0 auto 16px;
  width:100%;max-width:280px}
.pills button{flex:1;border:0;background:none;cursor:pointer;border-radius:999px;
  padding:9px 12px;font-size:12.5px;font-weight:800;color:var(--tx-3);letter-spacing:-.01em;
  transition:background .25s var(--ease),color .25s var(--ease)}
.pills button.on{background:var(--tx);color:var(--bg)}
.pillwrap{display:flex;justify-content:center}

/* 히어로 — 다음 경기 */
.hero{position:relative;overflow:hidden;border-radius:var(--r4);padding:20px 18px 18px;
  margin-bottom:18px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;transition:transform .2s var(--ease)}
.hero:active{transform:scale(.985)}
.hero .wash{position:absolute;inset:0;opacity:.16;pointer-events:none;
  background:linear-gradient(165deg,var(--acc) 0%,transparent 62%)}
.hero>*{position:relative}
.hero .rnd{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;padding-right:66px}
.hero h2{margin:0;font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1.08;
  padding-right:58px}
.hero .circ{font-size:13px;font-weight:800;color:var(--acc);margin-top:5px;letter-spacing:-.01em}
.hero .dt{font-size:12px;color:var(--tx-2);margin-top:3px;font-weight:600}
.hero .cdrow{display:flex;gap:8px;margin-top:18px;align-items:stretch}
.hero .cdu{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;
  background:color-mix(in srgb,var(--acc) 9%,var(--surface-2));
  border:1px solid color-mix(in srgb,var(--acc) 18%,var(--line));
  border-radius:var(--r2);padding:10px 4px 8px;align-items:center}
.hero .cdu b{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;
  letter-spacing:-.04em;color:var(--acc)}
.hero .trk{position:absolute;right:-8px;top:4px;
  width:104px;height:104px;color:var(--acc);pointer-events:none;opacity:.30}
/* 직계 svg = 서킷 데이터가 없을 때 쓰는 추상 리본 (3D는 .trk3d 안에 들어감) */
.hero .trk>svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:5;
  stroke-linecap:round;stroke-linejoin:round;opacity:.38}

/* 순위 행 — 0패딩 순위 + 큰 포인트 + 작은 캡션 */
.slist{border-top:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:13px 6px;border:0;border-bottom:1px solid var(--line);background:none;
  color:var(--tx);cursor:pointer;transition:background .2s}
.srow:active{background:var(--surface-2)}
.srow .pos{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--tx-3);
  flex:0 0 22px;letter-spacing:-.02em}
.srow .bar{width:3px;align-self:stretch;border-radius:2px;flex:0 0 3px}
.srow .who{flex:1;min-width:0}
.srow .who b{display:block;font-size:15px;font-weight:800;letter-spacing:-.025em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 직계 span만 = 팀 라인. 이름 안의 .gn(b > span)에는 적용되면 안 됩니다 */
.srow .who>span{display:block;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.06em;margin-top:2px;text-transform:uppercase}
.srow .pts{text-align:right;flex:0 0 auto}
.srow .pts b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;
  letter-spacing:-.03em;line-height:1}
.srow .pts span{display:block;font-family:var(--mono);font-size:8.5px;font-weight:700;
  letter-spacing:.14em;color:var(--tx-3);margin-top:3px}
.srow .fav{flex:0 0 auto;color:var(--line-2);display:grid;place-items:center;padding:4px}
.srow .fav svg{width:15px;height:15px;fill:currentColor;stroke:none}
.srow .fav.on{color:#ffc531}
.srow .chev{flex:0 0 auto;color:var(--tx-3)}
.srow .chev svg{width:15px;height:15px;stroke-width:2.4}

/* 즐겨찾기 대시보드 카드 */
.favcard{position:relative;overflow:hidden;border-radius:var(--r3);padding:15px;
  border:1px solid var(--line);background:var(--surface);margin-bottom:9px;
  display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--sh1)}
.favcard .wash{position:absolute;inset:0;opacity:.13;
  background:linear-gradient(120deg,var(--acc),transparent 68%)}
.favcard>*{position:relative}
.favcard .code{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.03em;
  color:var(--acc);flex:0 0 auto}
.favcard .meta{flex:1;min-width:0}
.favcard .meta b{display:block;font-size:15px;font-weight:800;letter-spacing:-.025em}
.favcard .meta>span{font-size:11px;color:var(--tx-2);font-weight:600}
.favcard .np{text-align:right;flex:0 0 auto}
.favcard .np b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;line-height:1}

/* 캘린더 미리보기 */
.widprev{margin-top:14px;border-radius:var(--r3);overflow:hidden;border:1px solid var(--line);
  background:var(--surface-2);line-height:0}
.widprev svg{width:100%;height:auto;display:block}

/* 로그인 / 회원가입 화면 */
.auth{position:fixed;inset:0;z-index:90;overflow-y:auto;
  background:linear-gradient(170deg,var(--glass-2),var(--bg) 45%);
  display:flex;align-items:center;justify-content:center;
  padding:32px 22px calc(env(safe-area-inset-bottom) + 32px);
  animation:fadein .3s ease}
/* display를 직접 선언했으므로 [hidden]의 기본 display:none을 되살려줘야 합니다 */
.auth[hidden]{display:none}
.auth-box{width:100%;max-width:400px}
.auth-brand{text-align:center;margin-bottom:26px}
.logo-mark.lg{width:56px;height:56px;border-radius:17px;margin:0 auto 14px;display:grid;
  place-items:center;color:#fff;background:linear-gradient(150deg,var(--br),var(--br-2));
  box-shadow:var(--sh-br)}
.logo-mark.lg svg{width:32px;height:32px;fill:currentColor}
.auth-brand h1{margin:0 0 6px;font-size:34px;font-weight:800;letter-spacing:.02em}
.auth-brand .lbl{margin:0}
.auth .pills{max-width:none;margin-bottom:6px}
.auth .btn{margin-top:20px}
.auth .btn.sm{margin-top:10px}
/* 구글 버튼은 구글 브랜드 가이드대로 흰 바탕에 로고를 그대로 씁니다 */
.btn.google{background:#fff;color:#1f1f1f;border:1px solid #dadce0;box-shadow:var(--sh1);
  display:flex;align-items:center;justify-content:center;gap:9px}
.btn.google svg{width:18px;height:18px;flex:none}
:root[data-theme="dark"] .btn.google{background:#2b2f36;color:#e8eaed;border-color:#3c4043}
.auth-or{display:flex;align-items:center;gap:10px;margin-top:20px;color:var(--dim);
  font-size:12px;font-weight:700}
.auth-or::before,.auth-or::after{content:'';flex:1;height:1px;background:var(--line)}
.auth-or[hidden]{display:none}

/* ═══════════════════════════  마이홈  ═══════════════════════════ */
/* 히어로는 팀 컬러(--tc)를 CSS 변수로 받아 전체 분위기를 한 번에 바꿉니다 */
.hero-team{position:relative;border-radius:var(--r3);overflow:hidden;padding:20px 18px 0;
  background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 90%,#000 10%),
             color-mix(in srgb,var(--tc) 45%,#0a0d12 55%) 62%,#0a0d12);
  box-shadow:var(--sh2);animation:pop .45s var(--ease) backwards}
.hero-team::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 78% 0%,rgba(255,255,255,.22),transparent 62%)}
/* 사진이 있으면 배경으로 깔고, 팀 색 그라데이션을 덮어 글자가 읽히게 합니다 */
.ht-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  animation:fadein .6s ease}
.ht-shade{position:absolute;inset:0;background:
  linear-gradient(102deg,color-mix(in srgb,var(--tc) 88%,#000 12%) 0%,
                  color-mix(in srgb,var(--tc) 62%,transparent) 34%,
                  rgba(6,8,12,.30) 58%,transparent 82%),
  linear-gradient(0deg,rgba(4,6,10,.86),rgba(4,6,10,.10) 58%),
  radial-gradient(120% 90% at 4% 0%,rgba(0,0,0,.55),transparent 56%)}
.hero-team.photo{padding-bottom:12px;min-height:186px;display:flex;flex-direction:column}
.hero-team.photo::after{display:none}
.ht-credit{position:relative;z-index:1;margin-top:auto;padding-top:14px;font-size:10px;
  color:rgba(255,255,255,.62);letter-spacing:.01em}
.ht-credit a{color:inherit;text-decoration:underline}
.ht-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.ht-badge{width:52px;height:52px;border-radius:15px;flex:none;display:grid;place-items:center;
  font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.04em;color:#fff;
  background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30),0 4px 14px rgba(0,0,0,.35);
  text-shadow:0 1px 3px rgba(0,0,0,.5)}
.ht-name{min-width:0;color:#fff}
.ht-name b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;
  text-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht-name span{display:block;font-size:12.5px;opacity:.82;margin-top:2px}
.ht-num{margin-left:auto;font-size:30px;font-weight:900;color:rgba(255,255,255,.5);
  letter-spacing:-.02em;flex:none}
/* 사진 위에 얹는 포인트·순위 — 유리판처럼 띄웁니다 */
.ht-stats{position:relative;z-index:1;margin-top:auto;display:flex;gap:8px;padding-top:14px}
.ht-stats>div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  border-radius:12px;padding:7px 12px;text-align:center}
.ht-stats b{display:block;font-family:var(--mono);font-size:15px;font-weight:700;color:#fff;
  line-height:1.1;letter-spacing:-.03em;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.ht-stats .lbl{color:rgba(255,255,255,.66);font-size:8px;margin-top:3px}
.hero-team.photo .ht-stats + .ht-credit{margin-top:9px;padding-top:0}
.ht-car{position:relative;z-index:1;margin:2px -6px -4px}
.ht-car svg{width:100%;height:auto;display:block;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
@keyframes ht-roll{from{transform:translateX(-7%)}to{transform:translateX(0)}}
.ht-car{animation:ht-roll .75s var(--ease) backwards}

.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.hstat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  padding:13px 10px;text-align:center;box-shadow:var(--sh1)}
.hstat b{display:block;font-size:21px;font-weight:900;letter-spacing:-.02em}
.hstat span{display:block;font-size:11px;color:var(--dim);margin-top:3px;font-weight:700}
.hstat.acc b{color:var(--tc)}

.hsec{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px}
.hsec h2{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.hsec span{font-size:11.5px;color:var(--dim);font-weight:700}
.hsec .refresh{margin-left:auto}

/* ── 승자 맞히기 ── */
.gm{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r4);padding:0 16px 16px;margin-bottom:22px;box-shadow:var(--sh2);
  animation:pop .4s var(--ease) backwards}
.gm::before{content:'';position:absolute;left:0;right:0;top:0;height:104px;pointer-events:none;
  background:linear-gradient(158deg,color-mix(in srgb,var(--br) 26%,transparent),transparent 72%)}
.gm>*{position:relative}
.gm-top{display:flex;align-items:center;gap:10px;
  margin:0 -16px 14px;padding:15px 16px 13px;border-bottom:1px solid var(--line)}
.gm-rank{display:flex;align-items:baseline;gap:9px;min-width:0}
.gm-rank b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.gm-rank span{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--br);
  letter-spacing:-.02em}
.gm-streak{margin-left:auto;flex:0 0 auto;font-size:10.5px;font-weight:800;color:#e8a13a;
  background:rgba(232,161,58,.14);border-radius:999px;padding:4px 9px}
.gm-race{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx-2);
  padding:11px 12px;background:var(--surface-2);border-radius:var(--r2);margin-bottom:12px}
.gm-race b{font-weight:800;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-race span{margin-left:auto;flex:0 0 auto;color:var(--tx-3);font-size:11px}
.gm-q{font-size:14.5px;font-weight:800;letter-spacing:-.01em;margin-bottom:11px}
.gm-my{font-size:13px;color:var(--tx-2);padding:11px 12px;border-radius:var(--r2);
  background:var(--br-tint);border:1px solid var(--line)}
.gm .btn{margin-top:11px}
.gm .note{margin-top:10px}
.gm-res{padding:13px;border-radius:var(--r2);text-align:center}
.gm-res b{display:block;font-size:15px;font-weight:800;margin-bottom:4px}
.gm-res span{font-size:12px;opacity:.85}
.gm-res.hit{background:rgba(52,168,83,.14);color:#2f9e4f}
:root[data-theme="dark"] .gm-res.hit{color:#5ed67f}
.gm-res.miss{background:var(--surface-2);color:var(--tx-2)}

/* 팀 카드가 여러 장 쌓이므로 사이를 띄웁니다 */
.hero-team + .hero-team,
.hstats + .hero-team{margin-top:22px}

/* 설정 단계 */
.hsetup{margin:4px 0 6px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.setup-step .hint{color:var(--dim);font-weight:600}
.tgroup{display:flex;align-items:center;gap:7px;margin:14px 0 8px;
  font-size:12px;font-weight:800;color:var(--tx-2);letter-spacing:.01em}
.tgroup:first-child{margin-top:0}
.setup-step{margin-bottom:20px}
.setup-step>.fl{margin-bottom:9px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.tcard{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r2);
  padding:11px 9px;cursor:pointer;color:var(--tx);text-align:left;display:flex;
  align-items:center;gap:8px;font-size:12.5px;font-weight:700;
  transition:transform .16s var(--ease),border-color .16s var(--ease)}
.tcard:active{transform:scale(.97)}
.tcard .sw{width:11px;height:11px;border-radius:4px;flex:none}
/* 팀 색 배지에 약칭을 넣어 로고처럼 씁니다 */
.tcard .mk{width:27px;height:27px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-size:9px;font-weight:900;color:#fff;letter-spacing:.01em;font-style:normal;
  text-shadow:0 1px 2px rgba(0,0,0,.28)}
.tcard:has(.mk){padding:8px 10px}
/* 시리즈 칸은 표시를 빼고 색 띠로만 구분합니다 */
.tcard.ser{padding-left:12px;position:relative}
.tcard.ser::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--tc)}
.tcard.on{border-color:var(--tc,var(--br));background:color-mix(in srgb,var(--tc,var(--br)) 12%,var(--surface))}
.tcard em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 3D 서킷 — 같은 패스를 Z축으로 겹쳐 두께를 만들고 판 전체를 기울입니다 */
.trk3d{perspective:760px;display:grid;place-items:center;flex:0 0 auto}
.trk3d .stack{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transform:rotateX(50deg) rotateZ(-22deg);
  transition:transform .55s var(--ease)}
.trk3d.flat .stack{transform:rotateX(0deg) rotateZ(0deg)}
.trk3d svg{position:absolute;inset:0;width:100%;height:100%;
  fill:none;stroke:var(--acc);stroke-linecap:round;stroke-linejoin:round;stroke-width:9}
.trk3d svg.top{stroke-width:7.5;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}

/* 서킷 지도 카드 */
.trkcard{position:relative;overflow:hidden;border-radius:var(--r3);border:1px solid var(--line);
  background:var(--surface-2);margin-top:14px;padding:16px 8px 16px 18px;min-height:158px;
  display:flex;align-items:center;gap:6px;cursor:pointer;
  transition:transform .2s var(--ease)}
.trkcard:active{transform:scale(.985)}
.trkcard .wash{position:absolute;inset:0;opacity:.13;
  background:radial-gradient(circle at 74% 50%,var(--acc),transparent 66%)}
.trkcard>*{position:relative}
.trkcard .info{flex:1;min-width:0}
.trkcard .info b{display:block;font-size:14px;font-weight:800;letter-spacing:-.02em}
.trkcard .info span{display:block;margin-top:3px}

/* 드라이버 이름 — 이름은 가볍게, 성은 굵고 좁게 (중계 그래픽 스타일) */
.dn{font-weight:800;letter-spacing:-.03em}
.dn .gn{font-weight:500;font-size:.84em;color:var(--tx-2);margin-right:.34em;letter-spacing:-.01em}

/* 드라이버 상세 통계 */
.dstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.dstat div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);
  padding:12px 6px;text-align:center}
.dstat b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.03em}
.dstat span{display:block;font-family:var(--mono);font-size:8px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3);margin-top:4px}
</style>
</head>

/* 3D 서킷 — 같은 패스를 Z축으로 겹쳐 두께를 만들고 통째로 기울입니다 */
function track3d(key, color, size, id){
  const d = CIRCUITS[key];
  if(!d) return '';
  const L = 9;
  let s = '';
  for(let i=L; i>=1; i--)
    s += `<svg class="side" viewBox="0 0 200 200" style="transform:translateZ(${(-i*1.7).toFixed(1)}px);opacity:${(0.12+0.035*(L-i)).toFixed(2)}"><path d="${d}"/></svg>`;
  s += `<svg class="top" viewBox="0 0 200 200"><path d="${d}"/></svg>`;
  return `<div class="trk3d" ${id?`id="${id}"`:''} style="--acc:${color};width:${size}px;height:${size}px">
            <div class="stack">${s}</div></div>`;
}

  low :{ n:['아래로','Bottom','下'],  dy: 0.07 },
};
/* 이 기기 화면 비율로 1080 폭에 맞춘 크기 */
function autoSize(){
  const sw = Math.min(screen.width, screen.height);
  const sh = Math.max(screen.width, screen.height);
  const ratio = (sw && sh) ? sh / sw : 1920 / 1080;
  return { w:1080, h: Math.round(1080 * Math.min(Math.max(ratio, 1), 2.6)) };
}
const widSize = ()=>{
  const k = DB.get('widSize', 'auto');
  const s = WID_SIZES[k];
  return (!s || k === 'auto') ? autoSize() : { w:s.w, h:s.h };
};
const widLay = ()=> WID_LAYS[DB.get('widLay','mid')] ? DB.get('widLay','mid') : 'mid';

/* 배경화면용 SVG 한 장을 문자열로 만듭니다 (외부 리소스 없이 자체 완결) */
function widgetSvg(r, key, W, H, lay){
  W = W || 1080; H = H || 1920;
  /* 잠금화면 시계·바로가기를 피해 글자를 올리거나 내립니다.
     배경(바탕색·무늬)은 그대로 두고 글자와 서킷 지도만 움직입니다. */
  const DY = (WID_LAYS[lay] || WID_LAYS.mid).dy * H;
  const th = THEMES[key] || THEMES.midnight, s = SERIES[r.s];
  const acc = th.useSeries ? s.color
            : th.acc || (key==='sunset' ? '#ffd66b' : key==='checker' ? '#ffffff' : '#5aa0ff');
  const bg  = th.useSeries ? [s.color, '#070b14'] : th.bg;
  const d   = Math.max(0, r.ms - Date.now());
  const dd  = Math.floor(d/86400000), hh = Math.floor(d%86400000/3600000), mm = Math.floor(d%3600000/60000);
  const z   = n => String(n).padStart(2,'0');
  const done = status(r) === 'done';
  const esx = v => String(v).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const ck  = circuitKey(r);
  /* 같은 문서에 여러 장이 놓여도 섞이지 않도록 id를 고유하게 */
  const gid = 'w' + key + Math.random().toString(36).slice(2,7);

  /* 체커 플래그 / 청사진 격자 패턴 */
  let deco = '';
  if(th.checker){
    let sq = '';
    for(let y=0;y<3;y++) for(let x=0;x<18;x++)
      if((x+y)%2===0) sq += `<rect x="${x*60}" y="${H-180+y*60}" width="60" height="60" fill="#fff" opacity=".9"/>`;
    deco = sq;
  }
  if(th.grid){
    let g = '';
    for(let x=0;x<=W;x+=60)  g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#7fb3ff" stroke-width="1" opacity=".12"/>`;
    for(let y=0;y<=H;y+=60)  g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#7fb3ff" stroke-width="1" opacity=".12"/>`;
    deco = g;
  }
  if(th.weave){                                   /* 카본 — 대각 짜임 */
    let g = '';
    for(let i=-H;i<W+H;i+=26){
      g += `<line x1="${i}" y1="0" x2="${i+H}" y2="${H}" stroke="#ffffff" stroke-width="9" opacity=".035"/>`;
      g += `<line x1="${i}" y1="${H}" x2="${i+H}" y2="0" stroke="#ffffff" stroke-width="9" opacity=".025"/>`;
    }
    deco = g;
  }
  if(th.lights){                                  /* 스타트 라이트 5개 */
    let g = '';
    for(let i=0;i<5;i++){
      const cx = W/2 + (i-2)*106;
      g += `<rect x="${cx-44}" y="${H*0.026}" width="88" height="106" rx="16" fill="#141418" stroke="#2a2a33" stroke-width="3"/>`;
      g += `<circle cx="${cx}" cy="${H*0.026+53}" r="29" fill="${acc}" opacity=".92"/>`;
    }
    deco = g;
  }

  /* 서킷 지도 (200×200 좌표계를 카드 크기에 맞춰 확대) */
  const size = 620, tx = (W-size)/2, ty = H*0.30;
  const track = ck ? `<g transform="translate(${tx},${ty}) scale(${size/200})" opacity=".92"
      ${th.glow ? `filter="url(#${gid}-glow)"` : ''}>
      <path d="${CIRCUITS[ck]}" fill="none" stroke="${acc}" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/></g>` : '';

  const cd = done
    ? `<text x="${W/2}" y="${H*0.79}" fill="${th.fg}" font-size="86" font-weight="800"
             text-anchor="middle" font-family="sans-serif">${esx(t('hero.done'))}</text>`
    : `<text x="${W/2}" y="${H*0.785}" fill="${acc}" font-size="132" font-weight="800"
             text-anchor="middle" font-family="monospace" letter-spacing="-4">${z(dd)} : ${z(hh)} : ${z(mm)}</text>
       <text x="${W/2}" y="${H*0.815}" fill="${th.dim}" font-size="34" font-weight="700"
             text-anchor="middle" font-family="sans-serif" letter-spacing="14">${
             esx(t('alert.d'))}      ${esx(t('alert.h'))}      ${esx(t('alert.m'))}</text>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/>
  </linearGradient>${th.glow ? `<filter id="${gid}-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="16" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>` : ''}</defs>
  <rect width="${W}" height="${H}" fill="url(#${gid})"/>
  ${deco}
  <g transform="translate(0,${DY})">
  <text x="${W/2}" y="${H*0.115}" fill="${acc}" font-size="40" font-weight="800" text-anchor="middle"
        font-family="sans-serif" letter-spacing="10">${esx(s.name)}  ·  ${esx(t('hero.round', r.r))}</text>
  <text x="${W/2}" y="${H*0.175}" fill="${th.fg}" font-size="76" font-weight="800" text-anchor="middle"
        font-family="sans-serif">${esx(rname(r))}</text>
  <text x="${W/2}" y="${H*0.218}" fill="${th.dim}" font-size="40" font-weight="600" text-anchor="middle"
        font-family="sans-serif">${esx(r.cc)}  ${esx(rcirc(r))}</text>
  ${track}
  <text x="${W/2}" y="${H*0.715}" fill="${th.fg}" font-size="46" font-weight="700" text-anchor="middle"
        font-family="sans-serif">${esx(fmtFull(r.ms))}</text>
  ${cd}
  </g>
  <text x="${W/2}" y="${H*0.945}" fill="${th.dim}" font-size="30" font-weight="800" text-anchor="middle"
        font-family="sans-serif" letter-spacing="8" opacity=".7">APEX</text>
</svg>`;
}

/* SVG를 PNG로 굽습니다. blob URL은 동일 출처라 캔버스가 오염되지 않습니다. */
function saveWidget(r, key){
  const sz = widSize();
  const svg = widgetSvg(r, key, sz.w, sz.h, widLay());
  const url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  img.onload = ()=>{
    try{
      const c = el('canvas'); c.width = sz.w; c.height = sz.h;
      c.getContext('2d').drawImage(img, 0, 0, sz.w, sz.h);
      c.toBlob(b=>{
        if(!b){ toast(t('wid.fail')); return; }
        const u = URL.createObjectURL(b), a = el('a');
        a.href = u; a.download = 'apex-' + r.id + '-' + key + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(u), 3000);
        toast(t('wid.saved'));
      }, 'image/png');
    }catch(e){ toast(t('wid.fail')); }
    URL.revokeObjectURL(url);
  };
  img.onerror = ()=>{ toast(t('wid.fail')); URL.revokeObjectURL(url); };
  img.src = url;
}

/* ══════════════════════════════════════════════════════════════
   주말 세션 — 연습주행 · 예선 · 스프린트 · 결승
   결승 시각만 데이터로 갖고 있고, 나머지는 시리즈별 표준 주말 형식으로 역산합니다.
   h = 결승 시작 기준 오프셋(시간), m = 세션 길이(분).
   확정 타임테이블이 나온 경기는 RACES 항목에
     ss:[{k:'fp1',t:'2026-03-06T21:30:00+09:00',m:60}, …]
   를 넣으면 계산 대신 그 값을 그대로 씁니다.
   ══════════════════════════════════════════════════════════════ */
const SES_FMT = {
  /* F1 일반 주말 — 금 FP1·FP2 / 토 FP3·예선 / 일 결승 */
  f1   :[{k:'fp1',h:-49.5,m:60},{k:'fp2',h:-46,m:60},{k:'fp3',h:-26.5,m:60},{k:'q',h:-23,m:60},{k:'r',h:0}],
  /* F1 스프린트 주말 — 금 FP1·스프린트 예선 / 토 스프린트·예선 / 일 결승 */
  f1sp :[{k:'fp1',h:-51.5,m:60},{k:'sq',h:-47.5,m:45},{k:'spr',h:-28,m:30},{k:'q',h:-24,m:60},{k:'r',h:0}],
  /* WEC — 예선 뒤에 상위 차량만 다시 겨루는 하이퍼폴이 붙습니다 */
  wec  :[{k:'fp1',h:-50,m:90},{k:'fp2',h:-45.5,m:90},{k:'fp3',h:-27,m:60},{k:'q',h:-21.5,m:20},{k:'hy',h:-20.75,m:20},{k:'r',h:0}],
  imsaE:[{k:'fp1',h:-49,m:90},{k:'fp2',h:-44,m:105},{k:'fp3',h:-26,m:60},{k:'q',h:-23,m:45},{k:'r',h:0}],
  imsaS:[{k:'fp1',h:-28,m:90},{k:'fp2',h:-24,m:60},{k:'q',h:-21,m:30},{k:'wu',h:-2,m:20},{k:'r',h:0}],
  /* DTM은 한 주말에 결승이 두 번 — 2차전 앞에도 예선을 따로 치릅니다 */
  dtm1 :[{k:'fp1',h:-27,m:45},{k:'fp2',h:-23,m:45},{k:'q',h:-3.25,m:20},{k:'r',h:0}],
  dtm2 :[{k:'q',h:-3.25,m:20},{k:'r',h:0}],
  /* 슈퍼GT — 토 공식연습·예선(Q1·Q2) / 일 워밍업·결승 */
  sgt  :[{k:'fp1',h:-29,m:100},{k:'q',h:-24,m:75},{k:'wu',h:-4.5,m:20},{k:'r',h:0}],
  gtE  :[{k:'fp1',h:-27,m:90},{k:'fp2',h:-23,m:60},{k:'q',h:-4,m:30},{k:'r',h:0}],
  gtS  :[{k:'fp1',h:-26,m:60},{k:'q',h:-2.5,m:30},{k:'r',h:0}],
  /* GT·TC의 같은 주말 2차전 — 예선을 따로 치르지 않아 결승만 남습니다 */
  only :[{k:'r',h:0}],
};

/* 같은 주말 2차전인지 — 같은 시리즈·같은 서킷에서 48시간 안에 앞선 경기가 있으면 2차전입니다.
   GT·TC는 지역별 시리즈를 하나로 합치면서 라운드 번호가 뒤섞여(예: 오카야마 r19·r21),
   홀짝으로는 1·2차전을 가릴 수 없어 실제 일정으로 판정합니다. */
const WKND_GAP = 48 * 3600000;
function isFollowUp(r){
  if(r._fu === undefined)
    r._fu = RACES.some(o => o !== r && o.s === r.s && o.c[0] === r.c[0]
                            && o.ms < r.ms && r.ms - o.ms <= WKND_GAP);
  return r._fu;
}

function sesFmt(r){
  if(r.s === 'f1')   return r.sp ? SES_FMT.f1sp : SES_FMT.f1;
  if(r.s === 'wec')  return SES_FMT.wec;
  if(r.s === 'imsa') return r.h >= 6 ? SES_FMT.imsaE : SES_FMT.imsaS;
  if(r.s === 'dtm')  return isFollowUp(r) ? SES_FMT.dtm2 : SES_FMT.dtm1;
  if(r.s === 'sgt')  return SES_FMT.sgt;
  return isFollowUp(r) ? SES_FMT.only : (r.h >= 3 ? SES_FMT.gtE : SES_FMT.gtS);
}

/* 예선·스프린트·결승 = '주요 세션'. 알림 기본값이 여기까지입니다. */
const SES_KEY = { q:1, sq:1, spr:1, hy:1, r:1 };

/* 한 경기의 세션 목록. 시간순이고, 마지막이 결승입니다.
   언어에 따라 바뀌는 건 이름뿐이라 시각만 캐시해 둡니다. */
function sessionsOf(r){
  if(r._ses) return r._ses;
  const raw = r.ss || sesFmt(r).map(x => ({ k:x.k, ms:r.ms + x.h*3600000, m:x.m }));
  return (r._ses = raw.map(x=>{
    const ms  = x.t ? new Date(x.t).getTime() : x.ms;
    const dur = x.k === 'r' ? r.h*3600000 : (x.m || 60)*60000;
    return { k:x.k, ms, end:ms + dur, key:!!SES_KEY[x.k] };
  }).sort((a,b)=>a.ms-b.ms));
}
const sesName   = k  => t('ses.'+k);
const sesStatus = se => Date.now() < se.ms ? 'soon' : (Date.now() < se.end ? 'live' : 'done');

/* 알림 범위 — race(결승만) / key(예선·스프린트까지) / all(전부) */
const SCOPES  = ['race','key','all'];
const inScope = se => CFG.scope === 'all' ? true : CFG.scope === 'race' ? se.k === 'r' : se.key;

/* 가장 가까운 세션(진행 중이면 그 세션). 구독한 시리즈를 먼저 보고, 없으면 전체에서 찾습니다.
   같은 주말에 여러 시리즈가 겹치면 결승 순서와 세션 순서가 어긋날 수 있어
   전부 훑어 가장 이른 것을 고릅니다.
   알림 범위를 '결승만'으로 둔 사람에게 연습주행을 세어 주면 앞뒤가 맞지 않아,
   카운트다운도 알림과 같은 범위를 따릅니다. */
function nextUp(){
  const now = Date.now();
  const scan = subbed => {
    let best = null;
    for(const r of RACES){
      if(r.end <= now || (subbed && !CFG.subs[r.s])) continue;
      for(const se of sessionsOf(r)){
        if(se.end <= now || !inScope(se)) continue;
        if(!best || se.ms < best.se.ms) best = { r, se };
        break;                       /* 세션도 시간순 — 첫 미래 세션이면 충분합니다 */
      }
    }
    return best;
  };
  return scan(true) || scan(false);
}

   저장소 — 지금은 전부 localStorage(= 내 기기 전용).
   나중에 Firebase/Supabase 등을 붙일 땐 이 두 함수만 갈아끼우면 됩니다.
   ══════════════════════════════════════════════════════════════ */
const DB = {
  get(k, fb){ try{ const v = localStorage.getItem('ms-'+k); return v===null ? fb : JSON.parse(v); }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem('ms-'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('ms-'+k); }catch(e){} },
};

/* 데이터의 국기 문자를 ISO 2글자 코드로 — 화면에는 이모지 대신 코드 배지를 씁니다.
   RACES 초기화보다 먼저 호출되므로 호이스팅되는 함수 선언으로 둡니다. */
function ccOf(f){
  return [...String(f)].map(ch => String.fromCharCode(ch.codePointAt(0) - 0x1F1E6 + 65)).join('');
}
const ccTag = r => `<span class="cc">${esc(r.cc)}</span>`;

/* ── 날짜: 기기 시간대 기준 ── */
const TZ = (()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Seoul'; }catch(e){ return 'Asia/Seoul'; } })();
const dtf = o => new Intl.DateTimeFormat(LOCALE[L], Object.assign({timeZone:TZ}, o));
const fmtDate  = ms => dtf({month:'long',day:'numeric',weekday:'short'}).format(ms);
const fmtShort = ms => dtf({month:'short',day:'numeric'}).format(ms);
const fmtTime  = ms => dtf({hour:'2-digit',minute:'2-digit',hour12:false}).format(ms);
const fmtFull  = ms => fmtDate(ms) + ' ' + fmtTime(ms);
const fmtMonth = ms => dtf({year:'numeric',month:'long'}).format(ms);
function dayKey(ms){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(ms);
  const g = k => p.find(x=>x.type===k).value;
  return `${+g('year')}-${+g('month')}-${+g('day')}`;
}
const partsNow = ()=>{ const k = dayKey(Date.now()).split('-'); return {y:+k[0], m:+k[1], d:+k[2]}; };

function relTime(ms){
  const diff = Date.now()-ms, m = Math.floor(diff/60000);
  if(m < 1) return t('time.now');   /* Intl의 0분 표현("현재 분")이 어색해서 직접 씁니다 */
  const rtf = new Intl.RelativeTimeFormat(LOCALE[L], {numeric:'auto'});
  if(m < 60)   return rtf.format(-m,'minute');
  if(m < 1440) return rtf.format(-Math.floor(m/60),'hour');
  return rtf.format(-Math.floor(m/1440),'day');
}

/* '30분' · '30 min' — 영어만 숫자와 단위를 띄우고, 1이면 단수형을 씁니다 */
const unit = (n, k) => n + t('alert.sp') + t('alert.' + k + (n === 1 ? '1' : ''));
function leftTime(ms){
  const d = ms - Date.now();
  if(d <= 0) return unit(0,'m');
  const h = Math.floor(d/3600000), m = Math.floor(d%3600000/60000);
  if(h >= 24) return unit(Math.floor(h/24),'d') + ' ' + unit(h%24,'h');
  return h ? unit(h,'h') + ' ' + unit(m,'m') : unit(m,'m');
}
/* 타임테이블 배지용 — 좁은 칸에 들어가도록 가장 큰 단위 하나만 */
function shortLeft(ms){
  const d = Math.max(0, ms - Date.now());
  if(d >= 86400000) return 'D-' + Math.ceil(d/86400000);
  const h = Math.floor(d/3600000);
  return h ? unit(h,'h') : unit(Math.max(1, Math.floor(d/60000)),'m');
}

const LEADS = [10,30,60,180,1440];

/* HTML에 고정된 라벨을 현재 언어로 맞춥니다.
   화면을 그릴 때마다 호출해서, 어떤 경로로 들어오든 라벨이 옛 언어로 남지 않게 합니다. */
function syncLabels(){
  document.querySelectorAll('[data-i18n]').forEach(n=>{ n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(n=>{ n.innerHTML = t(n.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ n.placeholder = t(n.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(n=>{ n.setAttribute('aria-label', t(n.dataset.i18nAria)); });
  const ls = $('#leadSel');       /* 드롭다운 항목도 여기서 함께 다시 만듭니다 */
  if(ls) ls.innerHTML = LEADS.map(m=>
    `<option value="${m}" ${m===CFG.lead?'selected':''}>${esc(t('alert.lead', leadLabel(m)))}</option>`).join('');
  const sc = $('#scopeSel');
  if(sc) sc.innerHTML = SCOPES.map(v=>
    `<option value="${v}" ${v===CFG.scope?'selected':''}>${esc(t('ses.scope'+v[0].toUpperCase()+v.slice(1)))}</option>`).join('');
}

function applyLang(){
  L = CFG.lang;

function cleanLead(s){
  return String(s || '')
    .replace(/\s*(Keep reading|Read more|Continue reading)\s*\.*\s*$/i, '')
    .replace(/\s*[-–—]\s*\.\.\.\s*$/, '')
    .replace(/([.!?])([A-Z"'‘“])/g, '$1 $2')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 900);
}

async function fetchNews(key){
  const feed = SERIES[key].feed;
  /* 자기 피드가 따로 있는 시리즈는 그걸 먼저 씁니다.
     실패하면 아래 공용 피드로 넘어갑니다 */
  const own = SERIES[key].feedUrl && HOSTED
    ? [{ src: SERIES[key].src || 'RSS', url: () => SERIES[key].feedUrl }] : [];
  let lastErr;
  for(const f of [...own, ...FEEDS]){
    try{
      const u = f.url(feed);
      if(!u) continue;                    /* 이 시리즈에는 그 소스가 없습니다 */
      const ac = new AbortController();
      const timer = setTimeout(()=>ac.abort(), 10000);
      const res = await fetch(u, {signal:ac.signal});
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const doc = new DOMParser().parseFromString(await res.text(), 'text/xml');
      const nodes = [...doc.querySelectorAll('item')];
      if(!nodes.length) throw new Error('empty');
      const all = nodes.map(it=>({
        title: stripTags(it.querySelector('title')?.textContent),
        desc : cleanLead(stripTags(it.querySelector('description')?.textContent)),
        link : (it.querySelector('link')?.textContent || '').split('?')[0],
        img  : it.querySelector('enclosure')?.getAttribute('url') || '',
        src  : f.src,
        at   : Date.parse(it.querySelector('pubDate')?.textContent || '') || Date.now(),
      }));
      return all.slice(0,20);
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

/* 제목 번역 — Google 번역 공개 엔드포인트(키 불필요, CORS 허용).
   제목을 줄바꿈으로 이어 한 번에 보냅니다. 번역기가 문장부호에서 한 제목을 여러 세그먼트로
   쪼개기도 하므로, 세그먼트 수를 세지 않고 각 세그먼트의 '원문'에 들어 있는 줄바꿈을
   경계 삼아 원래 제목 단위로 다시 붙입니다. */
/* 번역기가 유독 못 옮기는 모터스포츠 말은 보내기 전에 쉬운 영어로 바꿉니다.
   영어를 영어로 바꾸는 것이라 번역기가 헷갈리지 않습니다.
   (livery를 그대로 두면 "상징", shootout은 "승부차기"로 나옵니다) */
const EN_FIX = [
  [/\blivery\b/gi, 'car design'],
  [/\bliveries\b/gi, 'car designs'],
  [/\bshootout\b/gi, 'final round'],
  [/\bcalendar return\b/gi, 'return to the calendar'],
  [/\bcurtain[- ]raiser\b/gi, 'season opener'],
  [/\bsilly season\b/gi, 'driver transfer season'],
];
const enFix = s => EN_FIX.reduce((a,[re,to]) => a.replace(re,to), String(s || ''));

/* 번역이 끝난 뒤 남는 어색한 말을 바로잡습니다. 모터스포츠 기사에서만 쓰는 표현이라
   다른 뜻으로 잘못 바뀔 걱정이 적은 것만 골랐습니다 */
const KO_FIX = [
  /* 받침이 바뀌면 뒤따르는 조사도 같이 바꿔야 "리버리을"처럼 어긋나지 않습니다 */
  [/자동차 디자인을/g, '리버리를'], [/자동차 디자인은/g, '리버리는'],
  [/자동차 디자인이/g, '리버리가'], [/자동차 디자인과/g, '리버리와'],
  [/자동차 디자인/g, '리버리'],
  [/승부차기를/g, '슛아웃을'], [/승부차기는/g, '슛아웃은'],
  [/승부차기가/g, '슛아웃이'], [/승부차기와/g, '슛아웃과'],
  [/승부차기/g, '슛아웃'],
  [/운전자/g, '드라이버'],
  [/캘린더를 반환/g, '캘린더로 복귀'],
  [/구덩이 정거장|구덩이 스톱/g, '피트스톱'],
  [/안전차/g, '세이프티카'],
  [/자격 예선|예선 자격/g, '예선'],
  /* 롱런(장거리 주행 페이스)을 '달리기'로 옮겨 놓아 무슨 말인지 알 수 없었습니다 */
  [/장거리 달리기|긴 달리기/g, '롱런'],
  [/팀 동료/g, '팀메이트'],
  [/타이어 화합물|고무 화합물/g, '타이어 컴파운드'],
  [/노란색 깃발/g, '옐로 플래그'], [/빨간 깃발|적색 깃발/g, '레드 플래그'],
  [/연습 세션/g, '연습 주행'],

];
/* 구글 번역은 이름을 "조지 러셀(George Russell)" 처럼 원문을 괄호에 남겨 둡니다.
   거기에 이름 사전이 괄호 안까지 바꿔서 "조지 러셀(조지 러셀)"이 됩니다.
   (실측: 260줄 중 31줄) 괄호 안이 바로 앞 글자와 같으면 괄호째 뗍니다.
   "(12위)" 처럼 내용이 다른 괄호는 건드리지 않습니다. */
function dropEcho(s){
  return String(s || '').replace(/([^()]+?)\s*\(([^()]{1,30})\)/g, (m, before, inner) => {
    const flat = x => x.replace(/\s+/g, '');
    const a = flat(before), b = flat(inner);
    if(!b) return m;
    if(a.endsWith(b)) return before.replace(/\s+$/, '');
    /* 구글의 음차와 앱 사전의 표기가 다를 때도 이름이 두 번 나옵니다
       ("미구엘 몰리나" 뒤 괄호에 "미겔 몰리나"). 괄호 안이 사전에 있는
       정식 표기면 앞의 음차를 그걸로 바꿉니다. 엉뚱한 말을 지우지 않도록
       첫 글자가 같고 길이도 비슷할 때만 합니다 (르클레르 뒤의 페라리는 그대로). */
    const inn = inner.trim();
    if(!koNames().includes(inn)) return m;
    /* 글자 수가 아니라 낱말 수로 맞춥니다. "미구엘"과 "미겔"처럼
       음차 길이가 달라도 같은 이름을 집어낼 수 있습니다. */
    const n = inn.split(/\s+/).length;
    const w = before.split(/\s+/);
    if(w.length < n) return m;
    const t = flat(w.slice(-n).join(' '));
    if(!t || t[0] !== b[0] || Math.abs(t.length - b.length) > 3) return m;
    return w.slice(0, w.length - n).concat(inn).join(' ');
  });
}
const koFix = s => dropEcho(KO_FIX.reduce((a,[re,to]) => a.replace(re,to), String(s || '')));

/* 제목 전용 다듬기 — 종결어미를 걷어내고 마침표를 뗍니다 */
const HEAD_FIX = [
  [/아닙니다([.!?]?)$/, '아니다'],
  [/합니다([.!?]?)$/,   '한다'],
  [/됩니다([.!?]?)$/,   '된다'],
  [/입니다([.!?]?)$/,   '이다'],   /* 받아들입니다 → 받아들이다 */
  [/습니다([.!?]?)$/,   '다'],     /* 느렸습니다 → 느렸다, 했습니다 → 했다 */
  [/[.]$/, ''],                    /* 우리말 제목에는 마침표를 찍지 않습니다 */
];
/* 화면에 뿌릴 때 쓰는 제목. 한국어일 때만 기사 제목투로 다듬습니다 */
const hl = s => L === 'ko' ? reorder(headline(koFix(postNames(s)))) : String(s || '');

/* 우리말 기사 제목이 쓰는 어순으로 바꿉니다.
   번역기는 영어 어순을 그대로 두기 때문에 아무리 어미를 고쳐도 번역투가 남습니다.
   ① 큰따옴표가 앞에 오면 말한 사람을 앞으로 (영어는 "말" - 사람, 우리말은 사람 "말")
   ② 맨 앞 이름 뒤의 조사를 쉼표로 (르클레르는 → 르클레르,)
   ③ 붙임말 정리 (~에 대한 → 없앰, ~와의 → ~와) */
/* NAME_MAP 이 이 아래에서 만들어지므로, 처음 쓸 때 한 번만 계산합니다 */
let _koNames = null;
function koNames(){
  if(_koNames) return _koNames;
  const set = new Set();
  for(const [, ko] of NAME_MAP) if(/^[가-힣]/.test(ko)) set.add(ko);
  return (_koNames = [...set].sort((a,b)=> b.length - a.length));
}

/* 문장 앞에서 아는 이름과 그 뒤 조사를 떼어 냅니다. 없으면 null */
function peelName(s){
  for(const n of koNames()){
    if(!s.startsWith(n)) continue;
    const m = s.slice(n.length).match(/^(는|은|이|가)\s+/);
    if(m) return { name:n, rest: s.slice(n.length + m[0].length) };
  }
  return null;
}

function reorder(s){
  let out = String(s || '');

  /* ① "말" - 사람이 …  →  사람 "말", … */
  const q = out.match(/^["“]([^"”]{2,60})["”]\s*[-–—]\s*(.+)$/);
  if(q){
    const p = peelName(q[2]);
    out = p ? p.name + ' "' + q[1] + '", ' + p.rest
            : q[2] + ' "' + q[1] + '"';
  }

  /* ② 맨 앞 이름 뒤 조사를 쉼표로 */
  const p2 = peelName(out);
  if(p2) out = p2.name + ', ' + p2.rest;

  /* ③ 제목에서 잘 안 쓰는 붙임말 */
  return out
    .replace(/에 대한 /g, ' ')
    .replace(/([가-힣])과의 /g, '$1과 ')
    .replace(/([가-힣])와의 /g, '$1와 ')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function headline(s){
  let out = String(s || '').trim();
  for(const [re, to] of HEAD_FIX){
    const next = out.replace(re, to).trim();
    if(next !== out){ out = next; break; }   /* 한 번만 손봅니다 */
  }
  return out.replace(/\s+([,·])/g, '$1').trim();
}

/* 기계 번역은 사람·팀 이름을 영어로 남겨 두는 일이 잦습니다("Mercedes의 감독").
   번역이 끝난 뒤 남은 영어 이름을 한국어로 바꿔 표기를 통일합니다.
   긴 이름부터 바꿔야 "Aston Martin"이 "Aston"에 먼저 걸리지 않습니다. */
/* 현역이 아니라 DRIVERS에 없지만 기사에 자주 나오는 이름들 */
const LEGENDS = [
  ['Michael Schumacher','미하엘 슈마허'], ['Ayrton Senna','아일톤 세나'],

  ['Frederic Vasseur','프레데리크 바쇠르'], ['Andrea Stella','안드레아 스텔라'],
