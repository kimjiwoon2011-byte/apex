/* ══════════════════════════════════════════════════════════════
   2. 일정
   ══════════════════════════════════════════════════════════════ */
let calMode = 'cal';       // 'cal' | 'stand'
let standTab = 'drivers';  // 'drivers' | 'teams'
let calFilter = 'all';

const tname = k => lz(TEAMS[k].n);
const dname = d => lz(d.n);
/* 이름/성을 나눠 성만 굵게 — 중계 그래픽처럼 보이게 */
function dnameHtml(d){
  const full = dname(d), i = full.lastIndexOf(' ');
  return i < 0 ? esc(full)
               : `<span class="gn">${esc(full.slice(0,i))}</span>${esc(full.slice(i+1))}`;
}
/* 결과 데이터(영문 포디움)에서 우승·포디움 수를 셉니다 */
function driverStats(d){
  let wins=0, pod=0;
  RACES.forEach(r=>{
    if(r.s!=='f1' || !r.p) return;
    const en = r.p[1];
    if(en[0].includes(d.key)) wins++;
    if(en.some(x=>x.includes(d.key))) pod++;
  });
  return {wins, pod};
}

function buildCalPills(){
  const box = $('#calPills'); box.innerHTML = '';
  [['cal','cal.tabCal'],['stand','cal.tabStand']].forEach(([k,key])=>{
    const b = el('button', k===calMode?'on':'');
    b.textContent = t(key);
    b.onclick = ()=>{ calMode = k; renderCal(); };
    box.appendChild(b);
  });
}

/* 날짜를 선택했으면 그 날 경기를, 아니면 다음 경기를 보여줍니다 */
function heroRace(){
  if(calSel){
    const day = visibleRaces().filter(x=>dayKey(x.ms) === calSel);
    if(day.length) return {r:day[0], more:day.length-1};
  }
  return {r: visibleRaces().find(x=>x.end > Date.now()), more:0};
}

function renderHero(){
  const card = $('#heroCard');
  const {r, more} = heroRace();
  if(!r){ card.hidden = true; return; }
  card.hidden = false;
  const s = SERIES[r.s], st = status(r);
  const d = Math.max(0, r.ms - Date.now());
  const dd = Math.floor(d/86400000), hh = Math.floor(d%86400000/3600000),
        mm = Math.floor(d%3600000/60000), ss = Math.floor(d%60000/1000);
  const z = n => String(n).padStart(2,'0');
  card.style.setProperty('--acc', s.color);
  const hk = circuitKey(r);

  let bottom;
  if(st === 'live')      bottom = `<div class="cdrow"><div class="cdu"><b>${t('hero.live')}</b></div></div>`;
  else if(st === 'done') bottom = `<div class="cdrow"><div class="cdu"><b style="font-size:17px">${t('hero.done')}</b>
                                     <span class="lbl">${r.p ? esc(lz(r.p)[0]) : t('hero.doneSub')}</span></div></div>`;
  else bottom = `<div class="cdrow">
      <div class="cdu"><b>${z(dd)}</b><span class="lbl">${t('alert.d')}</span></div>
      <div class="cdu"><b>${z(hh)}</b><span class="lbl">${t('alert.h')}</span></div>
      <div class="cdu"><b>${z(mm)}</b><span class="lbl">${t('alert.m')}</span></div>
      <div class="cdu"><b>${z(ss)}</b><span class="lbl">${t('alert.s')}</span></div>
    </div>`;

  card.innerHTML = `
    <span class="wash"></span>
    ${hk ? `<span class="trk">${track3d(hk, s.color, 116)}</span>` : ''}
    <div class="rnd">
      <span class="tag solid" style="background:${s.color}">${esc(s.name)}</span>
      <span class="lbl">${esc(t('hero.round', r.r))}</span>
      <span class="lbl">${calSel ? t('hero.picked') : t('hero.next')}</span>
      ${more ? `<span class="tag grey">+${more}</span>` : ''}
    </div>
    <h2>${esc(rname(r))}</h2>
    <div class="circ">${ccTag(r)}${esc(rcirc(r))}</div>
    <div class="dt">${fmtFull(r.ms)}</div>
    ${bottom}`;
  card.onclick = ()=> openRace(r);
}

/* ── 챔피언십 순위 ── */
function renderStandings(){
  const pills = $('#stPills'); pills.innerHTML = '';
  [['drivers','st.drivers'],['teams','st.teams']].forEach(([k,key])=>{
    const b = el('button', k===standTab?'on':'');
    b.textContent = t(key);
    b.onclick = ()=>{ standTab = k; renderStandings(); };
    pills.appendChild(b);
  });
  $('#stMeta').textContent = t('st.after', STANDINGS_AFTER);

  const fav = DB.get('fav', {driver:null, team:null});
  const list = $('#stList'); list.innerHTML = '';
  const z = n => String(n).padStart(2,'0');

  if(standTab === 'drivers'){
    DRIVERS.forEach(d=>{
      const tm = TEAMS[d.t];
      const row = el('button','srow');
      row.innerHTML = `
        <span class="pos">${z(d.p)}</span>
        <i class="bar" style="background:${tm.c}"></i>
        <span class="who"><b class="dn">${dnameHtml(d)}</b>
          <span style="color:${tm.c}">${esc(d.code)} · ${esc(tname(d.t))}</span></span>
        <span class="pts"><b>${d.pts}</b><span>${t('st.pts')}</span></span>
        <span class="fav ${fav.driver===d.code?'on':''}"><svg viewBox="0 0 24 24">${PATHS.star}</svg></span>
        <span class="chev">${ic('chev')}</span>`;
      row.querySelector('.fav').onclick = e=>{
        e.stopPropagation();
        fav.driver = fav.driver===d.code ? null : d.code;
        DB.set('fav', fav); toast(t(fav.driver ? 'fav.added' : 'fav.removed'));
        renderStandings();
      };
      row.onclick = ()=> openDriver(d);
      list.appendChild(row);
    });
  }else{
    CONSTRUCTORS.forEach(c=>{
      const tm = TEAMS[c.t];
      const row = el('button','srow');
      row.innerHTML = `
        <span class="pos">${z(c.p)}</span>
        <i class="bar" style="background:${tm.c}"></i>
        <span class="who"><b>${esc(tname(c.t))}</b>
          <span style="color:${tm.c}">${esc(DRIVERS.filter(d=>d.t===c.t).map(d=>d.code).join(' · '))}</span></span>
        <span class="pts"><b>${c.pts}</b><span>${t('st.pts')}</span></span>
        <span class="fav ${fav.team===c.t?'on':''}"><svg viewBox="0 0 24 24">${PATHS.star}</svg></span>`;
      row.querySelector('.fav').onclick = e=>{
        e.stopPropagation();
        fav.team = fav.team===c.t ? null : c.t;
        DB.set('fav', fav); toast(t(fav.team ? 'fav.added' : 'fav.removed'));
        renderStandings();
      };
      list.appendChild(row);
    });
  }
}

function openDriver(d){
  const tm = TEAMS[d.t], st = driverStats(d);
  const podiums = RACES.filter(r=>r.s==='f1' && r.p && r.p[1].some(x=>x.includes(d.key)))
    .map(r=>{ const i = r.p[1].findIndex(x=>x.includes(d.key));
              return `<div class="pod"><b class="p${i+1}">${i+1}</b>${esc(rname(r))}</div>`; }).reverse().join('');
  openSheet(`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span class="tag solid" style="background:${tm.c}">${esc(d.code)}</span>
      <span class="lbl">${esc(tname(d.t))}</span>
    </div>
    <h3 class="dn">${dnameHtml(d)}</h3>
    <div class="dstat">
      <div><b>${String(d.p).padStart(2,'0')}</b><span>${t('st.pos')}</span></div>
      <div><b>${d.pts}</b><span>${t('st.pts')}</span></div>
      <div><b>${st.wins}</b><span>${t('st.wins')}</span></div>
      <div><b>${st.pod}</b><span>${t('st.podium')}</span></div>
    </div>
    <div class="sec">${t('st.season')}</div>
    ${podiums ? `<div class="podium">${podiums}</div>`
              : `<div class="note">${t('st.noPodium')}</div>`}
    <button class="btn ghost sm" id="dClose">${t('r.close')}</button>`);
  $('#dClose').onclick = closeSheet;
}
let calYM = (()=>{ const p = partsNow(); return {y:p.y, m:p.m}; })();
let calSel = null;
const visibleRaces = ()=> calFilter==='all' ? RACES : RACES.filter(r=>r.s===calFilter);

function buildCalChips(){
  const box = $('#calChips'); box.innerHTML = '';
  const mk = (k,label,color)=>{
    const b = el('button','chip' + (k===calFilter?' on':''));
    b.innerHTML = (color?`<i class="sdot" style="background:${color}"></i>`:'') + esc(label);
    b.onclick = ()=>{ calFilter = k; calSel = null; renderCal(); };
    box.appendChild(b);
  };
  mk('all', t('cal.all'));
  Object.entries(SERIES).forEach(([k,s])=> mk(k, s.name, s.color));
}

function renderCal(){
  buildCalPills();
  $('#calView').hidden   = calMode !== 'cal';
  $('#standView').hidden = calMode !== 'stand';
  if(calMode === 'stand'){ renderStandings(); return; }

  buildCalChips();
  renderHero();
  const {y,m} = calYM;
  $('#calTitle').textContent = fmtMonth(Date.UTC(y, m-1, 15, 12));

  const byDay = {};
  visibleRaces().forEach(r=>{ (byDay[dayKey(r.ms)] ||= []).push(r); });

  const grid = $('#cgrid'); grid.innerHTML = '';
  t('cal.dow').forEach(d=>{ const h = el('div','dow'); h.textContent = d; grid.appendChild(h); });

  const lead = new Date(Date.UTC(y, m-1, 1)).getUTCDay();
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const todayKey = dayKey(Date.now());

  for(let i=0;i<lead;i++) grid.appendChild(el('button','cell pad'));
  for(let d=1; d<=days; d++){
    const key = `${y}-${m}-${d}`;
    const races = byDay[key] || [];
    const c = el('button','cell' + (races.length?' has':'') + (key===todayKey?' today':'')
              + (key===calSel?' sel':'') + ((lead+d-1)%7===0?' sun':''));
    /* 점만 찍지 않고 어떤 시리즈 경기인지 이름을 함께 적습니다 (2개까지, 나머지는 +N) */
    c.innerHTML = `<span class="d num">${d}</span>`
      + races.slice(0,2).map(r=>
          `<span class="cl" style="color:${SERIES[r.s].color}">${esc(SERIES[r.s].name)}</span>`).join('')
      + (races.length > 2 ? `<span class="cl more">+${races.length-2}</span>` : '');
    /* 날짜를 누르면 맨 위 히어로 카드가 그 경기(서킷·일시·남은 시간)로 바뀌므로
       히어로가 보이도록 위로 스크롤합니다 */
    if(races.length) c.onclick = ()=>{
      const sel = calSel === key ? null : key;
      calSel = sel; renderCal();
      if(!sel) return;
      requestAnimationFrame(()=>{
        const before = window.scrollY;
        window.scrollTo({top:0, behavior:'smooth'});
        /* 부드러운 스크롤이 동작하지 않는 환경(웹뷰 등) 대비 —
           애니메이션이 돌고 있으면 위치가 이미 바뀌었으므로 건드리지 않습니다 */
        setTimeout(()=>{ if(window.scrollY === before && before !== 0) window.scrollTo(0, 0); }, 400);
      });
    };
    grid.appendChild(c);
  }

  const list = $('#raceList'); list.innerHTML = '';
  let shown, title;
  if(calSel){
    shown = byDay[calSel] || [];
    title = t('cal.day', fmtDate(shown[0]?.ms ?? Date.now()));
  }else{
    shown = visibleRaces().filter(r=>{ const p = dayKey(r.ms).split('-'); return +p[0]===y && +p[1]===m; });
    title = t('cal.month', fmtMonth(Date.UTC(y,m-1,15,12)), shown.length);
  }
  $('#listTitle').textContent = title;

  if(!shown.length){
    list.innerHTML = `<div class="empty">${ic('flag')}${t('cal.none')}</div>`;
  }else{
    shown.forEach((r,i)=> list.appendChild(raceCard(r,i)));
  }
  if(!calSel){
    const up = RACES.filter(r=>r.ms > Date.now()).slice(0,3);
    if(up.length){
      const h = el('div','sec'); h.textContent = t('cal.upcoming'); list.appendChild(h);
      up.forEach((r,i)=> list.appendChild(raceCard(r,i)));
    }
  }
}

function raceCard(r, i){
  const s = SERIES[r.s], st = status(r);
  const b = el('button','rcard');
  b.style.animationDelay = Math.min(i,8)*28 + 'ms';
  /* 월·요일은 언어별 접미사(8月 / Aug)가 붙으므로 통째로, 일자는 숫자만 뽑습니다 */
  const g = k => k==='day'
    ? (dtf({day:'numeric'}).formatToParts(r.ms).find(x=>x.type==='day')?.value ?? '')
    : dtf(k==='month' ? {month:'short'} : {weekday:'short'}).format(r.ms);
  const stat = st==='live' ? `<div class="dd" style="color:#e5162b">${t('r.live')}</div>`
             : st==='done' ? `<div class="dd" style="color:var(--tx-3)">${t('r.done')}</div>`
             : `<div class="dd num">D-${Math.max(0,Math.ceil((r.ms-Date.now())/86400000))}</div>
                <div class="tm num">${fmtTime(r.ms)}</div>`;
  b.innerHTML = `
    <div class="rdate" style="color:${s.color}">
      <span style="position:absolute;inset:0;background:${s.color};opacity:.11"></span>
      <span class="mo">${esc(g('month'))}</span>
      <span class="dd num">${esc(g('day'))}</span>
      <span class="wd">${esc(g('weekday'))}</span>
    </div>
    <div class="rmain">
      <div class="rtop"><i class="sdot" style="background:${s.color}"></i>${esc(s.name)} · ${t('r.round', r.r)}
        ${r.sp?`<span class="tag" style="padding:2px 6px;font-size:9px">${t('r.sprint')}</span>`:''}</div>
      <div class="rname">${ccTag(r)}${esc(rname(r))}</div>
      <div class="rsub">${esc(rcirc(r))}</div>
    </div>
    <div class="rstat">${stat}</div>`;
  b.onclick = ()=> openRace(r);
  return b;
}

/* ── 시트 ── */
function openSheet(html){
  $('#sheet').innerHTML = '<div class="grab"></div>' + html;
  $('#scrim').classList.add('open');
  $('#sheet').scrollTop = 0;
}
let sheetClearTimer;
function closeSheet(){
  $('#scrim').classList.remove('open');
  /* 닫힌 뒤에도 내용이 DOM에 남으면 지난 방의 입력창·로그가 살아 있는 것처럼 보입니다.
     애니메이션이 끝난 뒤, 그 사이 다시 열리지 않았을 때만 비웁니다. */
  clearTimeout(sheetClearTimer);
  sheetClearTimer = setTimeout(()=>{
    if(!$('#scrim').classList.contains('open')) $('#sheet').innerHTML = '';
  }, 450);
}
$('#scrim').onclick = e => { if(e.target.id === 'scrim') closeSheet(); };

function openRace(r){
  const s = SERIES[r.s], st = status(r);
  const rev = DB.get('reviews', {})[r.id];
  const ck = circuitKey(r);

  const watch = (WATCH[r.s]||[]).map(w=>`
    <a class="watch" href="${w.url}" target="_blank" rel="noopener noreferrer">
      <span class="ico" style="background:linear-gradient(152deg,${w.c1},${w.c2})">${
        w.ico ? ic(w.ico,'fill') : esc(w.mark).replace(/\n/g,'<br>')}</span>
      <span class="nm">${esc(w.nm)}</span><span class="sb">${esc(lz(w.sb))}</span>
    </a>`).join('');

  let resultHtml = '';
  if(st !== 'soon'){
    resultHtml = `<div class="sec">${t('r.results')}</div>` + (r.p
      ? `<div class="podium">${lz(r.p).map((n,i)=>`<div class="pod"><b class="p${i+1}">${i+1}</b>${esc(n)}</div>`).join('')}</div>`
      : `<div class="note">${t('r.noResults')}
           <a href="${s.results}" target="_blank" rel="noopener noreferrer"
              style="color:var(--br);font-weight:800">${esc(t('r.official', s.name))}</a></div>`);
  }

  const rateHtml = st === 'done' ? `
    <div class="sec">${t('r.rate')}</div>
    <div class="stars" id="starRow">${[1,2,3,4,5].map(i=>
      `<button data-v="${i}" class="${rev&&rev.stars>=i?'lit':''}" aria-label="${i}">
         <svg viewBox="0 0 24 24">${PATHS.star}</svg></button>`).join('')}</div>
    <textarea id="revText" placeholder="${esc(t('r.ratePh'))}">${esc(rev?.text || '')}</textarea>
    <button class="btn flow" id="saveRev">${t('r.saveRate')}</button>` : '';

  openSheet(`
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap">
      <span class="tag solid" style="background:${s.color}">${esc(s.name)} ${t('r.round', r.r)}</span>
      ${r.sp?`<span class="tag">${t('r.sprintWknd')}</span>`:''}
      ${st==='live'?`<span class="tag live">${t('r.live')}</span>`:''}
      ${st==='done'?`<span class="tag grey">${t('r.done')}</span>`:''}
    </div>
    <h3>${ccTag(r)}${esc(rname(r))}</h3>
    <div class="muted">${esc(rcirc(r))} · ${esc(sfull(r.s))}</div>
    ${ck ? `<div class="trkcard" id="trkCard" style="--acc:${s.color}">
             <span class="wash"></span>
             <span class="info"><b>${esc(rcirc(r))}</b><span class="lbl">${t('r.trackTap')}</span></span>
             ${track3d(ck, s.color, 124, 'trk3dEl')}
           </div>` : ''}
    <div class="card" style="margin-top:14px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:800;letter-spacing:-.02em">${fmtFull(r.ms)}</div>
        <div class="muted">${esc(t('r.tzNote', TZ, r.h))}</div>
      </div>
      ${st==='soon' ? `<div style="text-align:right;flex:0 0 auto">
        <div class="num" style="font-size:19px;font-weight:800;color:var(--br);letter-spacing:-.03em">D-${Math.max(0,Math.ceil((r.ms-Date.now())/86400000))}</div>
        <div class="muted">${esc(leftTime(r.ms))}</div></div>` : ''}
    </div>
    <button class="btn ghost sm" id="btnIcs">${ic('cal')} ${t('r.addCal')}</button>

    <div class="sec">${t('r.watch')}</div>
    <div class="wgrid">${watch}</div>
    <div class="note">${t('r.watchNote')}</div>

    ${resultHtml}${rateHtml}

    <button class="btn ghost sm" id="btnRoom">${ic('chat')} ${t('r.makeRoom')}</button>
    <button class="btn ghost sm" id="btnClose">${t('r.close')}</button>`);

  $('#btnClose').onclick = closeSheet;
  $('#btnIcs').onclick   = ()=> downloadIcs(r);
  /* 서킷 카드를 누르면 3D ↔ 평면(위에서 본 모습) 전환 */
  const tc = $('#trkCard');
  if(tc) tc.onclick = ()=> $('#trk3dEl').classList.toggle('flat');
  $('#btnRoom').onclick  = ()=>{ closeSheet(); switchTab('chat'); openCreateRoom(r.id); };

  if(st === 'done'){
    let picked = rev?.stars || 0;
    const row = $('#starRow');
    row.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ picked = +b.dataset.v;
        row.querySelectorAll('button').forEach(x=> x.classList.toggle('lit', +x.dataset.v <= picked)); };
    });
    $('#saveRev').onclick = ()=>{
      if(!picked){ toast(t('r.pickStar')); return; }
      const all = DB.get('reviews', {});
      all[r.id] = { stars:picked, text:$('#revText').value.trim().slice(0,500), at:Date.now() };
      DB.set('reviews', all);
      toast(t('r.saved', picked)); closeSheet();
    };
  }
}

function downloadIcs(r){
  const s = SERIES[r.s], z = n => String(n).padStart(2,'0');
  const f = ms => { const d = new Date(ms);
    return d.getUTCFullYear()+z(d.getUTCMonth()+1)+z(d.getUTCDate())+'T'+z(d.getUTCHours())+z(d.getUTCMinutes())+'00Z'; };
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//APEX Motorsport//EN','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT','UID:'+r.id+'@apex-motorsport','DTSTAMP:'+f(Date.now()),
    'DTSTART:'+f(r.ms),'DTEND:'+f(r.end),
    'SUMMARY:'+s.name+' R'+r.r+' '+rname(r),'LOCATION:'+rcirc(r),'DESCRIPTION:'+sfull(r.s),
    'BEGIN:VALARM','TRIGGER:-PT'+CFG.lead+'M','ACTION:DISPLAY','DESCRIPTION:'+rname(r),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], {type:'text/calendar;charset=utf-8'}));
  const a = el('a'); a.href = url; a.download = r.id + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast(t('r.icsDone'));
}

$('#calPrev').onclick = ()=>{ calYM.m--; if(calYM.m<1){calYM.m=12;calYM.y--;} calSel=null; renderCal(); };
$('#calNext').onclick = ()=>{ calYM.m++; if(calYM.m>12){calYM.m=1;calYM.y++;} calSel=null; renderCal(); };

/* ══════════════════════════════════════════════════════════════
   3. 단톡방
   ══════════════════════════════════════════════════════════════ */
const DAY = 24*3600*1000;
const raceOf = id => RACES.find(r=>r.id===id);

/* 경기 연결 방은 경기 종료 시점부터, 자유 방은 생성 시점부터 24시간을 셉니다. */
function deadlineOf(room){
  const base = room.raceId ? (raceOf(room.raceId)?.end ?? room.createdAt) : room.createdAt;
  return Math.max(room.lastActivity || room.createdAt, base) + DAY;
}
function pruneRooms(){
  const rooms = DB.get('rooms', []);
  const keep  = rooms.filter(r => Date.now() < deadlineOf(r));
  if(keep.length !== rooms.length){
    DB.set('rooms', keep);
    const msgs = DB.get('msgs', {});
    Object.keys(msgs).forEach(k=>{ if(!keep.some(r=>r.id===k)) delete msgs[k]; });
    DB.set('msgs', msgs);
  }
  return keep;
}

/* ══════════════════════════════════════════════════════════════
   단톡방 백엔드 — Supabase REST
   설정에서 프로젝트 URL과 anon 키를 넣으면 실제로 여러 사람이 연결됩니다.
   비워두면 지금까지처럼 이 기기 안에서만 동작합니다.
   ══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   ★ 친구들과 같은 서버를 쓰려면 아래 한 줄만 채우세요 ★
   설정 → 단톡방 서버에서 연결한 뒤 "파일에 심을 설정" 복사 버튼을 누르면
   붙여넣을 내용이 그대로 나옵니다. 이 파일을 받은 사람은 아무 설정 없이
   바로 같은 방에 들어옵니다. (publishable 키는 공개용이라 적어도 됩니다)
   ══════════════════════════════════════════════════════════════ */
const DEFAULT_NET = { mode:'free', url:'', key:'' };

/* 구글 로그인용 Supabase 주소. 비우면 Google 버튼이 숨겨지고 아이디 로그인만 남습니다.
   https로 열었을 때만 씁니다 (file://은 구글이 돌아올 주소로 허용하지 않습니다) */
const SB_AUTH = 'https://nlwfmhrhbgzvvenztejn.supabase.co';

/* 모드: free = 키 없이 바로(ntfy.sh) · sb = 내 Supabase · off = 이 기기만.
   저장된 설정이 있으면 그게 우선, 없으면 위 DEFAULT_NET을 씁니다. */
const net     = ()=> Object.assign({}, DEFAULT_NET, DB.get('net', {}));
const netSb   = ()=>{ const n = net(); return n.mode === 'sb' && !!(n.url && n.key); };
const netFree = ()=> net().mode === 'free';
const netOn   = ()=> netFree() || netSb();

/* ── 키 없이 쓰는 공개 pub-sub (ntfy.sh) ──
   가입도 키도 없지만 토픽이 공개라 누구나 읽을 수 있고, 보관은 12시간입니다. */
const NTFY  = 'https://ntfy.sh/';
const LOBBY = 'apex-motorsport-lobby-v1';
const roomTopic = id => 'apex-motorsport-r-' + id;

async function ntfyPoll(topic){
  const r = await fetch(NTFY + topic + '/json?poll=1&since=all', {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const txt = (await r.text()).trim();
  if(!txt) return [];
  return txt.split('\n').map(line=>{
    try{ return JSON.parse(JSON.parse(line).message); }catch(e){ return null; }
  }).filter(Boolean);
}
/* ── 내 기기 사본 ──
   무료 서버는 12시간이 지나면 대화를 지웁니다. 내가 한 번 받아둔 것은
   이 기기에 남겨두고 서버 응답과 합쳐서 보여줍니다. 그래서 대화가 안 사라집니다. */
const msgKey = m => (m.sys ? 's' : 'm') + '|' + (m.who || '') + '|' + m.text + '|' + m.at;
function mirrorMsgs(roomId, fresh){
  const map = new Map();
  DB.get('mir-' + roomId, []).concat(fresh).forEach(m => map.set(msgKey(m), m));
  const merged = [...map.values()].sort((a,b)=>a.at - b.at).slice(-300);
  DB.set('mir-' + roomId, merged);
  return merged;
}
/* 방 목록도 같은 방식으로 — 서버에서 사라져도 24시간 규칙이 살아 있게 */
function mirrorRooms(fresh){
  const map = new Map();
  DB.get('mir-rooms', []).forEach(r => map.set(r.id, r));
  fresh.forEach(r=>{
    const prev = map.get(r.id);
    map.set(r.id, prev && prev.lastActivity > r.lastActivity ? prev : r);
  });
  const alive = [...map.values()].filter(r => Date.now() < deadlineOf(r));
  DB.set('mir-rooms', alive);
  /* 사라진 방의 대화 사본도 함께 정리 */
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith('ms-mir-') && k !== 'ms-mir-rooms'
       && !alive.some(r => 'ms-mir-' + r.id === k)) localStorage.removeItem(k);
  });
  return alive;
}

/* 파일 맨 위 DEFAULT_NET 줄과 바꿔치기할 내용 */
function embedLine(){
  const n = net();
  return `const DEFAULT_NET = { mode:'sb', url:'${n.url}', key:'${n.key}' };`;
}

/* 지금 설정이 들어간 HTML 사본을 만들어 내려받습니다.
   화면에 그려둔 내용은 비우고 원본에 가깝게 되돌린 뒤 DEFAULT_NET 줄만 바꿉니다. */
function exportConfigured(){
  try{
    const doc = document.documentElement.cloneNode(true);
    /* 실행 중 채워진 부분은 비웁니다 (열면 다시 그려집니다) */
    ['#newsList','#cgrid','#raceList','#roomList','#stList','#subList','#myStats',
     '#myReviews','#favWrap','#sheet','#heroCard','#cdCard','#newsChips','#calChips',
     '#calPills','#stPills','#authPills','#leadSel','#chatNetNote','#calTitle','#listTitle',
     '#newsFresh','#newsNext','#permTxt','#hdrTitle','#toast']
      .forEach(sel=>{ const el = doc.querySelector(sel); if(el) el.innerHTML = ''; });
    doc.removeAttribute('data-theme');

    const hd = doc.querySelector('#hdr');      if(hd) hd.className = 'hdr';

    let html = '<!DOCTYPE html>\n' + doc.outerHTML;
    const before = html;
    html = html.replace(/const DEFAULT_NET = \{[^}]*\};/, embedLine());
    if(html === before) throw new Error('DEFAULT_NET 줄을 찾지 못함');

    const url = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
    const a = el('a'); a.href = url; a.download = 'motorsport.html';
    document.body.appendChild(a); a.click(); a.remove();

async function ntfyPub(topic, obj){
  const r = await fetch(NTFY + topic, {method:'POST', body:JSON.stringify(obj)});
  if(r.status === 429){ const e = new Error('rate'); e.rate = true; throw e; }   /* 무료 서버 전송 제한 */
  if(!r.ok) throw new Error('HTTP ' + r.status);
}
/* 방 목록의 인원·마지막 활동을 알리는 짧은 신호 (너무 자주 보내지 않도록 제한) */
const beatAt = {};
async function beat(room, force){
  const now = Date.now();
  if(!force && now - (beatAt[room.id] || 0) < 20000) return;
  beatAt[room.id] = now;
  try{ await ntfyPub(LOBBY, {k:'beat', id:room.id, at:now, n:room.members.length}); }catch(e){}
}

/* Supabase에 한 번만 실행하면 되는 준비 SQL.
   비밀번호 없는 공개 단톡방이라 anon 키로 읽기·쓰기를 모두 허용합니다. */
const SETUP_SQL = `create table if not exists rooms (
  id            text primary key,
  title         text not null,
  descr         text,
  max_n         int  not null,
  race_id       text,
  owner         text,
  members       jsonb  default '[]'::jsonb,
  created_at    int8,
  last_activity int8
);
create table if not exists messages (
  id      bigserial primary key,
  room_id text not null,
  who     text,
  text    text,
  sys     boolean default false,
  at      int8
);
create index if not exists messages_room_idx on messages (room_id, at);

alter table rooms    enable row level security;
alter table messages enable row level security;

-- policies have no "create if not exists", so drop first to stay re-runnable
drop policy if exists "open rooms"    on rooms;
drop policy if exists "open messages" on messages;
create policy "open rooms"    on rooms    for all using (true) with check (true);
create policy "open messages" on messages for all using (true) with check (true);`;

/* 어떤 형태로 붙여넣어도 https://xxxx.supabase.co 만 남깁니다.
   (뒤에 /rest/v1, 물음표, 슬래시, 공백이 붙어 와도 정리) */
function normUrl(raw){
  let s = String(raw || '').trim();
  if(!s) return '';
  if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
  try{ return new URL(s).origin; }catch(e){ return ''; }
}

async function sb(path, opt){
  const n = net();
  /* 예전 anon 키(JWT, eyJ...)는 Bearer로도 보내야 하지만
     새 publishable 키(sb_publishable_...)를 Bearer로 보내면 JWT 파싱 오류가 납니다. */
  const headers = { apikey:n.key, 'Content-Type':'application/json',
                    Prefer:'return=representation' };
  if(n.key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + n.key;
  const res = await fetch(n.url.replace(/\/+$/,'') + '/rest/v1/' + path,
                          Object.assign({headers}, opt || {}));
  const txt = await res.text();
  if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + txt.slice(0,140));
  return txt ? JSON.parse(txt) : null;
}
/* 서버 컬럼 ↔ 앱에서 쓰는 형태 */
const fromRow = r => ({ id:r.id, title:r.title, desc:r.descr||'', max:r.max_n,
                        raceId:r.race_id, owner:r.owner, members:r.members||[],
                        createdAt:+r.created_at, lastActivity:+r.last_activity });
const toRow   = r => ({ id:r.id, title:r.title, descr:r.desc, max_n:r.max,
                        race_id:r.raceId, owner:r.owner, members:r.members,
                        created_at:r.createdAt, last_activity:r.lastActivity });

/* 간편 모드에서 방의 실제 참여자를 입·퇴장 기록으로 복원합니다 */
async function freeMembers(roomId){
  const evs = await ntfyPoll(roomTopic(roomId));
  const set = new Set();
  evs.forEach(d=>{ if(d.k === 'join') set.add(d.who); else if(d.k === 'leave') set.delete(d.who); });
  return [...set];
}

const CHAT = {
  async rooms(){
    if(!netOn()) return pruneRooms();

    if(netFree()){
      const evs = await ntfyPoll(LOBBY);
      const decl = new Map(), beats = new Map();
      evs.forEach(d=>{
        if(d.k === 'room') decl.set(d.id, d);
        else if(d.k === 'beat'){
          const b = beats.get(d.id);
          if(!b || d.at > b.at) beats.set(d.id, d);
        }
      });
      const list = [...decl.values()].map(d=>{
        const b = beats.get(d.id);
        return { id:d.id, title:d.title, desc:d.desc || '', max:d.max, raceId:d.raceId || null,
                 owner:d.owner, members:new Array(b ? b.n : 0).fill(''),
                 createdAt:d.at, lastActivity: b ? Math.max(b.at, d.at) : d.at };
      });
      /* 서버에서 사라진 방도 내 사본에 있으면 24시간 규칙까지 유지됩니다 */
      return mirrorRooms(list).sort((a,b)=>b.lastActivity - a.lastActivity);
    }

    const list = (await sb('rooms?select=*&order=last_activity.desc')).map(fromRow);
    /* 만료된 방은 먼저 본 클라이언트가 지웁니다 */
    const dead = list.filter(r => Date.now() >= deadlineOf(r));
    for(const r of dead){
      const q = 'eq.' + encodeURIComponent(r.id);
      try{ await sb('messages?room_id=' + q, {method:'DELETE'});
           await sb('rooms?id=' + q,       {method:'DELETE'}); }catch(e){}
    }
    return list.filter(r => Date.now() < deadlineOf(r));
  },

  async create(room){
    if(!netOn()){ const rs = pruneRooms(); rs.push(room); DB.set('rooms', rs); return room; }
    if(netFree()){
      await ntfyPub(LOBBY, {k:'room', id:room.id, title:room.title, desc:room.desc,
                            max:room.max, raceId:room.raceId, owner:room.owner, at:room.createdAt});
      return room;
    }
    await sb('rooms', {method:'POST', body:JSON.stringify(toRow(room))});
    return room;
  },

  async patch(id, fields, room){
    if(!netOn()){
      const rs = DB.get('rooms', []), r = rs.find(x=>x.id===id);
      if(r){ Object.assign(r, fields); DB.set('rooms', rs); }
      return;
    }
    if(netFree()){ if(room) await beat(room, true); return; }
    const row = {};
    if('members' in fields)      row.members = fields.members;
    if('lastActivity' in fields) row.last_activity = fields.lastActivity;
    await sb('rooms?id=eq.' + encodeURIComponent(id), {method:'PATCH', body:JSON.stringify(row)});
  },

  async msgs(roomId){
    if(!netOn()) return DB.get('msgs', {})[roomId] || [];
    if(netFree()){
      const fresh = (await ntfyPoll(roomTopic(roomId))).map(d=>{
        if(d.k === 'msg')   return {who:d.who, text:d.text, sys:false, at:d.at};
        if(d.k === 'join')  return {sys:true, text:t('chat.joined',  d.who), at:d.at};
        if(d.k === 'leave') return {sys:true, text:t('chat.leftMsg', d.who), at:d.at};
        return null;
      }).filter(Boolean);
      return mirrorMsgs(roomId, fresh);   /* 12시간 지나 서버에서 빠져도 남습니다 */
    }
    const rows = await sb('messages?room_id=eq.' + encodeURIComponent(roomId)
                          + '&select=*&order=at.asc&limit=300');
    return rows.map(m=>({ who:m.who, text:m.text, sys:m.sys, at:+m.at }));
  },

  /* kind: 'msg' | 'join' | 'leave' */
  async send(roomId, kind, payload, room){
    const at = Date.now();
    if(!netOn()){
      pushMsgLocal(roomId, kind === 'msg' ? {who:payload.who, text:payload.text, at}
        : {sys:1, at, text:t(kind === 'join' ? 'chat.joined' : 'chat.leftMsg', payload.who)});
      return;
    }
    if(netFree()){
      await ntfyPub(roomTopic(roomId), Object.assign({k:kind, at}, payload));
      if(room) await beat(room, kind !== 'msg');
      return;
    }
    const text = kind === 'msg' ? payload.text
               : t(kind === 'join' ? 'chat.joined' : 'chat.leftMsg', payload.who);
    await sb('messages', {method:'POST', body:JSON.stringify(
      {room_id:roomId, who:kind==='msg' ? payload.who : null, text, sys:kind!=='msg', at})});
    if(kind === 'msg') await CHAT.patch(roomId, {lastActivity:at});
  },
};

async function renderRooms(){
  const box = $('#roomList');
  $('#chatNetNote').innerHTML = netOn()
    ? t('chat.onlineNote') + '<br>' + t('chat.publicWarn')

  catch(e){

async function enterRoom(id, known){
  if(!CFG.nick){ askNick(()=>enterRoom(id, known)); return; }
  let rooms;
  try{ rooms = await CHAT.rooms(); }catch(e){ toast(t('net.err')); return; }
  /* 방금 만든 방은 서버 조회에 아직 안 보일 수 있어서, 아는 방이면 그대로 씁니다 */
  let room = rooms.find(r=>r.id===id) || (known && known.id===id ? known : null);
  if(!room){ toast(t('chat.gone')); renderRooms(); return; }

  /* 간편 모드는 인원만 알 수 있으므로, 입장 판단을 위해 실제 참여자를 복원합니다 */
  if(netFree()){
    try{ room.members = await freeMembers(room.id); }catch(e){ toast(t('net.err')); return; }
  }

  const joined = room.members.includes(CFG.nick);
  if(!joined && room.members.length >= room.max){ toast(t('chat.full')); return; }
  /* 무료 요금제: 동시에 참여할 수 있는 방 1개까지 */
  if(!joined && !isPro()){
    let mine = rooms.filter(x=>x.members.includes(CFG.nick)).length;
    if(netFree()){          /* 목록만으로는 알 수 없어 각 방을 확인 */
      mine = 0;
      for(const x of rooms){
        if(x.id === room.id) continue;
        try{ if((await freeMembers(x.id)).includes(CFG.nick)) mine++; }catch(e){}
      }
    }
    if(mine >= FREE_ROOMS){ toast(t('pro.limitJoin')); openPro(); return; }
  }
  if(!joined){
    room.members.push(CFG.nick);
    await CHAT.patch(room.id, {members:room.members, lastActivity:Date.now()}, room);
    await CHAT.send(room.id, 'join', {who:CFG.nick}, room);
  }else{
    await CHAT.patch(room.id, {lastActivity:Date.now()}, room);
  }
  room.lastActivity = Date.now();

  const race = room.raceId ? raceOf(room.raceId) : null;
  const s = race ? SERIES[race.s] : null;
  openSheet(`
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap">
      ${s?`<span class="tag solid" style="background:${s.color}">${esc(s.name)}</span>`:''}
      <span class="tag">${ic('user')} ${room.members.length}/${room.max}</span>
      <span class="tag grey" id="ttlBadge"></span>
    </div>
    <h3>${esc(room.title)}</h3>
    <div class="muted">${esc(room.desc || t('chat.noDesc'))}${race?` · ${ic('flag')} ${esc(rname(race))} (${esc(fmtFull(race.ms))})`:''}</div>
    <div class="cwrap">
      <div class="clog" id="chatLog"></div>
      <div class="cin">
        <input type="text" id="msgIn" maxlength="300" placeholder="${esc(t('chat.msgPh'))}">
        <button class="flow" id="msgSend">${t('chat.send')}</button>
      </div>
    </div>
    <div class="row2">
      <button class="btn ghost sm" id="leaveRoom">${t('chat.leave')}</button>
      <button class="btn ghost sm" id="closeRoom">${t('r.close')}</button>
    </div>
    <div class="note">${netOn() ? t('chat.onlineNote') : t('chat.localNote')}</div>`);

  let seen = 0, lastMsgs = [], pending = [];   /* pending = 서버 반영 전 내 메시지 */

  const draw = (list, force)=>{
    const log = $('#chatLog'); if(!log) return;
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    log.innerHTML = list.map(m => m.sys
      ? `<div class="msg sys">${esc(m.text)}</div>`
      : `<div class="msg ${m.who===CFG.nick?'me':'other'}"${m.wait?' style="opacity:.55"':''}>
           ${m.who===CFG.nick?'':`<span class="who">${esc(m.who)}</span>`}
           ${esc(m.text)}<span class="tm num">${fmtTime(m.at)}</span></div>`).join('');
    if(atBottom || force) log.scrollTop = log.scrollHeight;
    const tb = $('#ttlBadge');
    if(tb) tb.innerHTML = ic('clock') + ' ' + esc(t('chat.ttlShort', leftTime(deadlineOf(room))));
  };

  const paint = async (force)=>{
    if(!$('#chatLog')) return false;
    let msgs;
    try{ msgs = await CHAT.msgs(room.id); }catch(e){ return false; }
    /* 서버에 올라온 내 메시지는 임시 목록에서 뺍니다 */
    pending = pending.filter(p => !msgs.some(m => !m.sys && m.who === p.who && m.text === p.text));
    if(!force && msgs.length === seen && !pending.length) return true;
    seen = msgs.length; lastMsgs = msgs;
    draw(msgs.concat(pending), force);
    return true;
  };
  await paint(true);

  /* 온라인이면 새 메시지를 주기적으로 받아옵니다 (시트가 닫히면 멈춤) */
  const poll = setInterval(async ()=>{
    if(!$('#scrim').classList.contains('open') || !$('#chatLog')){ clearInterval(poll); return; }
    if(netOn()) await paint(false);
  }, 2500);

  const send = async ()=>{
    const inp = $('#msgIn'), v = inp.value.trim(); if(!v) return;
    inp.value = '';
    /* 서버 반영에 몇 초 걸리므로 내 말풍선은 즉시 띄우고(흐리게) 나중에 맞춥니다 */
    const mine = {who:CFG.nick, text:v, at:Date.now(), wait:true};
    pending.push(mine);
    draw(lastMsgs.concat(pending), true);
    try{ await CHAT.send(room.id, 'msg', {who:CFG.nick, text:v}, room); }
    catch(e){
      pending = pending.filter(p => p !== mine);
      draw(lastMsgs.concat(pending), true);
      toast(t(e && e.rate ? 'net.rate' : 'net.err'));
      inp.value = v; return;                      /* 쓴 내용은 돌려줍니다 */
    }
    await paint(true);
  };
  $('#msgSend').onclick = send;
  $('#msgIn').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
  $('#closeRoom').onclick = ()=>{ clearInterval(poll); closeSheet(); renderRooms(); };
  $('#leaveRoom').onclick = async ()=>{
    clearInterval(poll);
    room.members = room.members.filter(n=>n!==CFG.nick);
    await CHAT.patch(room.id, {members:room.members}, room);
    await CHAT.send(room.id, 'leave', {who:CFG.nick}, room);
    closeSheet(); renderRooms();
  };
}

function pushMsgLocal(roomId, m){
  const msgs = DB.get('msgs', {});
  (msgs[roomId] ||= []).push(m);
  if(msgs[roomId].length > 300) msgs[roomId] = msgs[roomId].slice(-300);
  DB.set('msgs', msgs);
  const rooms = DB.get('rooms', []), r = rooms.find(x=>x.id===roomId);
  if(r && !m.sys){ r.lastActivity = m.at; DB.set('rooms', rooms); }
}

        mm = Math.floor(d%3600000/60000), ss = Math.floor(d%60000/1000);

    <div class="lbl">${live ? t('alert.live') : t('alert.next')}</div>
    <div class="nm">${ccTag(r)}${esc(rname(r))}</div>

      <div><b>${dd}</b><span>${t('alert.d')}</span></div>
      <div><b>${String(hh).padStart(2,'0')}</b><span>${t('alert.h')}</span></div>
      <div><b>${String(mm).padStart(2,'0')}</b><span>${t('alert.m')}</span></div>

/* ══════════════════════════════════════════════════════════════
   로그인 / 회원가입
   ⚠ 서버가 없으므로 진짜 인증이 아닙니다. 계정은 이 브라우저에만 저장되고,
     기기를 쓸 수 있는 사람은 누구나 우회할 수 있습니다.
     비밀번호는 평문 대신 솔트를 섞어 SHA-256으로 저장합니다.
   ══════════════════════════════════════════════════════════════ */
let authMode = 'login';

async function pwHash(pw, salt){
  const buf = new TextEncoder().encode(salt + ' ' + pw);
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const accounts = ()=> DB.get('accts', {});
const session  = ()=> DB.get('session', null);

/* ── 구글 로그인 ──
   Supabase가 구글과의 대화를 대신 해주고, 끝나면 주소 뒤 #access_token= 으로 돌아옵니다.
   그 토큰(JWT) 안에 이메일과 이름이 들어 있어서 따로 서버에 물어볼 필요가 없습니다.
   구글이든 Supabase든 하나라도 막히면 그냥 아이디 로그인 화면이 남습니다. */
const googleOk = ()=> !!SB_AUTH && location.protocol === 'https:';

function googleStart(){
  const back = location.origin + location.pathname;
  location.href = SB_AUTH + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(back);
}

function jwtBody(tok){
  try{
    let s = String(tok).split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    const bytes = Uint8Array.from(atob(s), c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ return null; }
}

/* 이메일 앞부분이나 구글 이름으로 아이디를 만듭니다.
   이미 남이 쓰는 아이디면 뒤에 숫자를 붙입니다 */
function googleId(email, name){
  let base = String(name || '').replace(/\s+/g,'') || email.split('@')[0];
  base = base.replace(/[^0-9A-Za-z가-힣ぁ-んァ-ヶ一-龥_-]/g,'').slice(0,14);
  if(base.length < 2) base = 'user';
  const all = accounts();
  if(!all[base] || all[base].email === email) return base;
  for(let i=2; i<999; i++){
    const cand = base + i;
    if(!all[cand] || all[cand].email === email) return cand;
  }
  return base + Date.now().toString(36).slice(-3);
}

/* 구글에서 돌아온 직후인지 확인하고, 맞으면 로그인시킵니다 */
function googleReturn(){
  const h = location.hash || '';
  if(!/access_token=|error=/.test(h)) return false;
  const q = new URLSearchParams(h.slice(1));
  history.replaceState(null, '', location.pathname + location.search);   /* 토큰을 주소창에서 지웁니다 */

  if(q.get('error') || q.get('error_description')){ toast(t('auth.gFail')); return false; }
  const pl = jwtBody(q.get('access_token') || '');
  const email = pl && pl.email;
  if(!email){ toast(t('auth.gFail')); return false; }

  const meta = pl.user_metadata || {};
  const all  = accounts();
  let id = Object.keys(all).find(k => all[k].email === email) || googleId(email, meta.name || meta.full_name);
  all[id] = { google:true, email, at: all[id] ? all[id].at : Date.now() };
  DB.set('accts', all);
  DB.set('session', id);
  DB.set('guest', false);
  CFG.nick = id; saveCfg();
  toast(t('auth.welcome', id));
  return true;
}

function buildAuthPills(){
  const box = $('#authPills'); box.innerHTML = '';
  [['login','auth.login'],['signup','auth.signup']].forEach(([k,key])=>{
    const b = el('button', k===authMode ? 'on' : '');
    b.type = 'button'; b.textContent = t(key);
    b.onclick = ()=>{ authMode = k; paintAuth(); };
    box.appendChild(b);
  });
}
function paintAuth(){
  buildAuthPills();
  $('#auPw2Wrap').hidden = authMode !== 'signup';
  $('#auSubmit').textContent = t(authMode === 'signup' ? 'auth.signup' : 'auth.login');
  $('#auPw').setAttribute('autocomplete', authMode === 'signup' ? 'new-password' : 'current-password');
  $('#auOr').hidden = $('#auGoogle').hidden = !googleOk();
}

$('#authForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const id = $('#auId').value.trim(), pw = $('#auPw').value;
  if(id.length < 2 || id.length > 16) return toast(t('auth.errId'));
  if(pw.length < 4)                   return toast(t('auth.errPw'));
  const all = accounts();

  if(authMode === 'signup'){
    if($('#auPw2').value !== pw) return toast(t('auth.errPw2'));
    if(all[id])                  return toast(t('auth.errDup'));
    const salt = [...crypto.getRandomValues(new Uint8Array(8))]
                   .map(b=>b.toString(16).padStart(2,'0')).join('');
    all[id] = { salt, hash: await pwHash(pw, salt), at: Date.now() };
    DB.set('accts', all);
  }else{
    const acct = all[id];
    if(!acct)                                     return toast(t('auth.errNo'));
    if(acct.google)                               return toast(t('auth.errGoogle'));
    if(await pwHash(pw, acct.salt) !== acct.hash) return toast(t('auth.errWrong'));
  }
  DB.set('session', id);
  CFG.nick = id; saveCfg();
  $('#auId').value = $('#auPw').value = $('#auPw2').value = '';
  closeAuth(); toast(t('auth.welcome', id));
  if(tab === 'chat') renderRooms();
});

          : `<button class="btn flow sm" id="setLogin" style="margin-top:0">${t('set.loginBtn')}</button>`}
    <div class="sec">${t('set.plan')}</div>
    <button class="btn ghost sm" id="setPlan" style="margin-top:0;display:flex;align-items:center;gap:8px;justify-content:center">
      <span class="tag ${isPro()?'':'grey'}" style="${isPro()?'background:var(--br);color:#fff':''}">${
        isPro() ? t('plan.pro') : t('plan.free')}</span>
      ${isPro() ? t('pro.already') : t('pro.buy')}
    </button>
    <div class="sec">${t('set.display')}</div>
    <div class="seg c2" id="themeSeg">
      <button data-t="light" class="${CFG.theme==='light'?'on':''}">
        <span class="p" style="background:linear-gradient(135deg,#eff4ff,#fff)"></span>${t('set.light')}</button>
      <button data-t="dark" class="${CFG.theme==='dark'?'on':''}">
        <span class="p" style="background:linear-gradient(135deg,#0b1424,#030711)"></span>${t('set.dark')}</button>
    </div>
    <div class="sec">${t('set.lang')}</div>
    <div class="seg c3" id="langSeg">
      ${Object.entries(LANGS).map(([k,v])=>
        `<button data-l="${k}" class="${CFG.lang===k?'on':''}">${esc(v)}</button>`).join('')}
    </div>
    <div class="sec">${t('set.me')}</div>
    <label class="fl">${t('set.nick')}</label>
    <input type="text" id="setNick" maxlength="16" value="${esc(CFG.nick)}" placeholder="${esc(t('chat.nickPh'))}">
    <button class="btn flow sm" id="setNickSave">${t('set.saveNick')}</button>
    <div class="sec">${t('net.title')}</div>
    <div class="seg c3" id="netSeg">
      <button data-m="free" class="${net().mode==='free'?'on':''}">${t('net.mFree')}</button>
      <button data-m="sb"   class="${net().mode==='sb'  ?'on':''}">${t('net.mSb')}</button>
      <button data-m="off"  class="${net().mode==='off' ?'on':''}">${t('net.mOff')}</button>
    </div>
    <div class="note">${t('net.m' + (net().mode==='free'?'FreeDesc':net().mode==='sb'?'SbDesc':'OffDesc'))}</div>
    ${net().mode === 'sb' ? `<div class="card" style="margin-top:10px">
      <div class="trow" style="padding-top:0">
        <span class="tag ${netSb()?'':'grey'}" style="${netSb()?'background:#12b76a;color:#fff':''}">${
          netSb() ? t('net.on') : t('net.off')}</span>
        <div class="tx"><small>${t('net.guide')}</small></div>
      </div>
      <label class="fl">${t('net.url')}</label>
      <input type="text" id="netUrl" placeholder="https://xxxx.supabase.co" value="${esc(net().url)}">
      <label class="fl">${t('net.key')}</label>
      <input type="text" id="netKey" placeholder="eyJhbGciOi..." value="${esc(net().key)}">
      <button class="btn flow sm" id="netSave">${t('net.save')}</button>
      <label class="fl">${t('net.sql')}</label>
      <pre id="netSql" style="background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r2);
        padding:11px;font-size:10.5px;line-height:1.55;overflow-x:auto;margin:0;white-space:pre">${esc(SETUP_SQL)}</pre>
      <button class="btn ghost sm" id="netCopy">${t('net.copy')}</button>
      <div class="note">${t('net.warn')}</div>
      ${netSb() ? `
      <label class="fl">${t('net.embed')}</label>
      <div class="note" style="margin-top:0">${t('net.embedHow')}</div>
      <pre id="netEmbed" style="background:var(--surface-3);border:1px solid var(--line);
        border-radius:var(--r2);padding:11px;font-size:10.5px;line-height:1.55;
        overflow-x:auto;margin:8px 0 0;white-space:pre">${esc(embedLine())}</pre>
      <button class="btn flow sm" id="netExport">${ic('down')} ${t('net.exportFile')}</button>
      <button class="btn ghost sm" id="netEmbedCopy">${t('net.embedCopy')}</button>` : ''}
    </div>` : ''}

    <div class="sec">${t('set.data')}</div>
    <button class="btn ghost sm" id="clearNews">${t('set.clearNews')}</button>
    <button class="btn danger sm" id="resetAll">${t('set.reset')}</button>
    <div class="note">${t('set.note')}<br>${esc(t('set.tz', TZ))}<br>
      ${esc(t('r.trackNote'))} <span style="opacity:.75">bacinger/f1-circuits (ODbL)</span></div>
    <button class="btn ghost sm" id="setClose">${t('set.close')}</button>`);

  $('#setPlan').onclick = ()=>{ closeSheet(); openPro(); };
  $('#netSeg').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      const n = net(); n.mode = b.dataset.m; DB.set('net', n);
      closeSheet(); $('#btnSettings').onclick();
      if(tab === 'chat') renderRooms();
    };
  });
  if($('#netExport')) $('#netExport').onclick = exportConfigured;
  if($('#netEmbedCopy')) $('#netEmbedCopy').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(embedLine()); toast(t('net.copied')); }
    catch(e){ const rg=document.createRange(); rg.selectNodeContents($('#netEmbed'));
              const s=getSelection(); s.removeAllRanges(); s.addRange(rg); }
  };
  if($('#netCopy')) $('#netCopy').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(SETUP_SQL); toast(t('net.copied')); }
    catch(e){ /* 클립보드가 막힌 환경에서는 직접 선택할 수 있게 */
      const rg = document.createRange(); rg.selectNodeContents($('#netSql'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    }
  };
  if($('#netSave')) $('#netSave').onclick = async ()=>{
    const url = normUrl($('#netUrl').value), key = $('#netKey').value.trim();
    if(!url || !key){ toast(t('net.need')); return; }
    $('#netUrl').value = url;                       /* 정리된 주소를 보여줍니다 */
    const prev = net();
    DB.set('net', {mode:'sb', url, key});
    try{
      await sb('rooms?select=id&limit=1');          /* 실제로 닿는지 확인 */
      toast(t('net.ok')); closeSheet();
      if(tab === 'chat') renderRooms();
    }catch(e){
      DB.set('net', prev);                          /* 실패하면 되돌립니다 */
      const m = String(e.message || '');
      /* 무엇을 고쳐야 하는지 알려줍니다 */
      toast(t(/401|403|PGRST301|JWSError|JWT/.test(m) ? 'net.errKey'
            : /PGRST205|PGRST106/.test(m)            ? 'net.errTable'
            : /404|PGRST125/.test(m)                 ? 'net.errUrl'
            : 'net.err'));
    }
  };
  const bLogin = $('#setLogin'), bOut = $('#setLogout');
  if(bLogin) bLogin.onclick = ()=>{ closeSheet(); authMode='login'; openAuth(); };
  if(bOut)   bOut.onclick   = ()=>{
    DB.del('session'); CFG.nick=''; saveCfg();
    closeSheet(); toast(t('auth.bye')); authMode='login'; openAuth();
  };
  $('#themeSeg').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ CFG.theme = b.dataset.t; saveCfg(); applyTheme();
      $('#themeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); };
  });
  $('#langSeg').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      CFG.lang = b.dataset.l; saveCfg(); applyLang();
      const cur = tab; closeSheet(); switchTab(cur); $('#btnSettings').onclick();
    };
  });
  $('#setNickSave').onclick = ()=>{
    const v = $('#setNick').value.trim();
    if(!v){ toast(t('chat.needNick')); return; }
    CFG.nick = v; saveCfg(); toast(t('set.nickSaved'));
  };
  $('#clearNews').onclick = ()=>{
    Object.keys(SERIES).forEach(k=> DB.del('news2-'+k));
    toast(t('set.newsCleared')); closeSheet(); switchTab('news');
  };
  $('#resetAll').onclick = ()=>{
    if(!confirm(t('set.resetAsk'))) return;
    ['rooms','msgs','reviews','cfg','fired','fav','accts','session','guest','pro','myhome'].forEach(DB.del);
    Object.keys(localStorage).forEach(k=>{ if(k.startsWith('ms-mir-')) localStorage.removeItem(k); });
    Object.keys(SERIES).forEach(k=> DB.del('news2-'+k));
    location.reload();
  };
  $('#setClose').onclick = closeSheet;
};

/* ══════════════════════════════════════════════════════════════
   시작
   ══════════════════════════════════════════════════════════════ */
applyLang();
pruneRooms();
switchTab('news');
/* 구글에서 돌아온 직후면 그대로 로그인, 아니면 평소대로.
   로그인한 적도, 둘러보기를 고른 적도 없으면 첫 실행에 로그인 화면을 띄웁니다 */
if(googleReturn())               { /* 이미 로그인됨 */ }
else if(session())               CFG.nick = session();
else if(!DB.get('guest', false)) openAuth();

setInterval(()=>{
  if(tab === 'alert') paintCountdown();
  if(tab === 'cal' && calMode === 'cal') renderHero();   /* 남은 시간이 실시간으로 줄어들도록 */
  if(tab === 'chat' && !netOn()){
    const before = DB.get('rooms', []).length;
    if(pruneRooms().length !== before) renderRooms();
  }
}, 1000);
/* 온라인일 때 방 목록을 주기적으로 새로고침 (시트가 열려 있으면 건너뜀) */
setInterval(()=>{
  if(tab === 'chat' && netOn() && !$('#scrim').classList.contains('open')) renderRooms();
}, 6000);
setInterval(checkAlerts, 30000);
checkAlerts();
</script>
</body>
</html>
